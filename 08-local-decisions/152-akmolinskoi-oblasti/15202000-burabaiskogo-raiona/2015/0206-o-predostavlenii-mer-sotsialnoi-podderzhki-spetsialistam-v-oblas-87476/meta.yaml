act_code: '87476'
requisite: Решение Бурабайского районного маслихата Акмолинской области от 6 февраля 2015 года № 5С-39/1. Зарегистрировано Департаментом юстиции Акмолинской области 4 марта 2015 года № 4670. Утратило силу решением Бурабайского районного маслихата Акмолинской области от 25 февраля 2020 года № 6С-56/3 (вводится в действие со дня официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Бурабайского района
  kaz: Бурабай ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
