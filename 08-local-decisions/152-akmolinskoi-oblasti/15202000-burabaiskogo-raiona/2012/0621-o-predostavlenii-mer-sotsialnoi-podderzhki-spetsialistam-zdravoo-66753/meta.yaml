requisite: Решение Бурабайского районного маслихата Акмолинской области от 21 июня 2012 года № 5С-7/2. Зарегистрирвано Управлением юстиции Бурабайского района Акмолинской области 20 июля 2012 года № 1-19-234
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорт и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Бурабайского района
  kaz: Бурабай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы
