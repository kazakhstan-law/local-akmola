  title:
    rus: О внесении изменения и дополнений в решение Бурабайского районного маслихата от 26 августа 2013 года № 5С-20/7 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан по Бурабайскому району»
    kaz: Бурабай аудандық мәслихатының 2013 жылғы 26 тамыздағы № 5С-20/7 «Бурабай ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс және толықтырулар енгізу туралы
