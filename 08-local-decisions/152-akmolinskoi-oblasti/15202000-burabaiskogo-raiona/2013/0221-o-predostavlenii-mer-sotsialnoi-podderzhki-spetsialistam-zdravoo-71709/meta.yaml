act_code: '71709'
requisite: Решение Бурабайского районного маслихата Акмолинской области от 21 февраля 2013 года № 5С-13/7. Зарегистрировано Департаментом юстиции Акмолинской области 27 марта 2013 года № 3691
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Бурабайского района
  kaz: Бурабай ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы
