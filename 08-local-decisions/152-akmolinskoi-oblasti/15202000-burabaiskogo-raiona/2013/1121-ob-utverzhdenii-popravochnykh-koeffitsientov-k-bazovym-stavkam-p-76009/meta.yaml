requisite: Решение Бурабайского районного маслихата Акмолинской области от 21 ноября 2013 года № 5С-23/2. Зарегистрировано Департаментом юстиции Акмолинской области 12 декабря 2013 года № 3926. Утратило силу решением Бурабайского районного маслихата Акмолинской области от 24 мая 2019 года № 6С-43/5 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении поправочных коэффициентов к базовым ставкам платы за земельные участки в городе Щучинске, поселке Бурабай и сельских населенных пунктах Бурабайского района
  kaz: Бурабай ауданының Щучинск қаласы, Бурабай кенті мен ауылдық елді мекендеріндегі жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы
