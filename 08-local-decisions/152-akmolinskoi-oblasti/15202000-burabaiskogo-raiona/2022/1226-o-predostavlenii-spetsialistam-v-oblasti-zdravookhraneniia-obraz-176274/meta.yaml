act_code: '176274'
requisite: Решение Бурабайского районного маслихата Акмолинской области от 26 декабря 2022 года № 7С-32/3
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Бурабайского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2023 год
  kaz: 2023 жылға арналған Бурабай ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, кент, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
