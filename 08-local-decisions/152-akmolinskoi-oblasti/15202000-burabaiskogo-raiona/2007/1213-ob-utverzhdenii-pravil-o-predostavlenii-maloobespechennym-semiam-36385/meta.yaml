title:
  rus: Об утверждении Правил «О предоставлении малообеспеченным семьям (гражданам) жилищной помощи на оплату содержания жилища (кроме содержания индивидуального жилого дома), потребления коммунальных услуг и телефонной абонентской связи»
  kaz: «Тұрғын үйді (жеке тұрғын үйден басқа) күтіп ұстау және коммуналдық қызметтерге төлемақы жасау үшін әл-ауқаты төмен азаматтарға тұрғын үй және телефон абоненттерінің байланысына жәрдемақы беру» Ережелерді бекіту туралы
