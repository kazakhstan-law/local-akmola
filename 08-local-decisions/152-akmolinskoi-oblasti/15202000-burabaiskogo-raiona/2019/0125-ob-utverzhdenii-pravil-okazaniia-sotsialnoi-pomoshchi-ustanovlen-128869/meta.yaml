  title:
    rus: О внесении изменений и дополнения в решение Бурабайского районного маслихата от 25 января 2019 года № 6С-38/6 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан по Бурабайскому району»
    kaz: Бурабай аудандық мәслихаттың 2019 жылғы 25 қаңтардағы № 6С-38/6 «Бурабай ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
