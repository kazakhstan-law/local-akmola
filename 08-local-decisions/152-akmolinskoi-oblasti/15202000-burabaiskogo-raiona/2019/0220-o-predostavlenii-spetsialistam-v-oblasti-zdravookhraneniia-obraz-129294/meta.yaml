act_code: '129294'
requisite: Решение Бурабайского районного маслихата Акмолинской области от 20 февраля 2019 года № 6С-39/3. Зарегистрировано Департаментом юстиции Акмолинской области 25 февраля 2019 года № 7073
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Бурабайского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2019 год
  kaz: 2019 жылға арналған Бурабай ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
