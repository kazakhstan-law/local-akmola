title:
  rus: Об утверждении границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки города Щучинска, поселка Бурабай и сельских населенных пунктов Бурабайского района
  kaz: Бурабай ауданының Щучинск қаласы, Бурабай кенті мен ауылдық елді мекендеріндегі бағалау аймақтарының шекараларын және жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы
