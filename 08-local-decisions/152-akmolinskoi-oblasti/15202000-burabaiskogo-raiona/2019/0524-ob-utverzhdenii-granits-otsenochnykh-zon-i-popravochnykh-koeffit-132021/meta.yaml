  title:
    rus: О внесении изменения в решение Бурабайского районного маслихата от 24 мая 2019 года № 6С-43/5 «Об утверждении границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки города Щучинска, поселка Бурабай и сельских населенных пунктов Бурабайского района»
    kaz: Бурабай аудандық мәслихаттың 2019 жылғы 24 мамырдағы № 6С-43/5 «Бурабай ауданының Щучинск қаласы, Бурабай кенті мен ауылдық елді мекендеріндегі бағалау аймақтарының шекараларын және жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы» шешіміне өзгеріс енгізу туралы
