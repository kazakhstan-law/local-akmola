act_code: '57626'
requisite: Решение Бурабайского районного маслихата Акмолинской области от 10 февраля 2011 года № С-30/2. Зарегистрировано Управлением юстиции Бурабайского района Акмолинской области 9 марта 2011 года № 1-19-194
title:
  rus: О предоставлении мер социальной поддержки на 2011 год специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Бурабайского района
  kaz: Бурабай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2011 жылы әлеуметтік қолдау шараларын ұсыну туралы
