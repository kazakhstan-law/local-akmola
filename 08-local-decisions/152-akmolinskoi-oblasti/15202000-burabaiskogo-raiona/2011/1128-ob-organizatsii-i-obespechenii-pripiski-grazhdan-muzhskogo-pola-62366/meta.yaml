  kaz: Бурабай ауданында 2012 жылдың қаңтарынан наурызына дейінгі кезенде 1995 жылы туған, тіркелетін жылы он жеті жасқа толатын, еркек жынысты азаматтарды шақыру учаскесіне тіркеуді ұйымдастыру және қамтамасыз ету туралы
