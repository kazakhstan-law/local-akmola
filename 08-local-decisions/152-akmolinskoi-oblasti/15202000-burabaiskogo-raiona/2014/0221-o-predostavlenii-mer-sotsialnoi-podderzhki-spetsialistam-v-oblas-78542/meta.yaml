act_code: '78542'
requisite: Решение Бурабайского районного маслихата Акмолинской области от 21 февраля 2014 года № 5С-27/2. Зарегистрировано Департаментом юстиции Акмолинской области 31 марта 2014 года № 4059. Утратило силу решением Бурабайского районного маслихата Акмолинской области от 25 февраля 2020 года № 6С-56/3 (вводится в действие со дня официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Бурабайского района
  kaz: Бурабай ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына әлеуметтік қолдау шараларын ұсыну туралы
