  title:
    rus: О внесении изменений и дополнения в решение Бурабайского районного маслихата от 25 сентября 2014 года № 5С-34/2 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Бурабайском районе»
    kaz: Бурабай аудандық мәслихатының 2014 жылғы 25 қыркүйектегі № 5С-34/2 «Бурабай ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсалған шығындарды өндіріп алудың тәртібін және мөлшерін анықтау туралы» шешiмiне өзгерістер мен толықтыру енгiзу туралы
