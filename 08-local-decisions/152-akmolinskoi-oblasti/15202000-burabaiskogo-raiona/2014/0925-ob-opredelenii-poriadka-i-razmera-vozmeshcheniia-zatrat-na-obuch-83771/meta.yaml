    kaz: Бурабай аудандық мәслихатының 2014 жылғы 25 қыркүйектегі № 5С-34/2 «Бурабай ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсалған шығындарды өндіріп алудың тәртібін және мөлшерін айқындау туралы» шешiмiне өзгерістер енгiзу туралы
