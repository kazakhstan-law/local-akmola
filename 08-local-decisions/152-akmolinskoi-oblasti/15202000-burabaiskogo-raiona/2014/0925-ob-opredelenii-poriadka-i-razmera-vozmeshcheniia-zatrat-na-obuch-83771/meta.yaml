  title:
    rus: О внесении изменений в решение Бурабайского районного маслихата от 25 сентября 2014 года № 5С-34/2 «Об определении порядка и размера на обучение на дому детей с ограниченными возможностями из числа инвалидов»
    kaz: Бурабай аудандық мәслихаттың 2014 жылғы 25 қыркүйектегі № 5С-34/2 «Мүгедектер қатарындағы мүмкіндігі шектеулі балаларды үйде оқытуға тәртібін және мөлшерін белгілеу туралы» шешiмiне өзгерістер енгiзу туралы
