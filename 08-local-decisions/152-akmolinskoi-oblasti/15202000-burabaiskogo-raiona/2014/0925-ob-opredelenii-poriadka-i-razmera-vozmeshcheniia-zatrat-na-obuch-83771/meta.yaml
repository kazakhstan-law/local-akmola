act_code: '83771'
requisite: Решение Бурабайского районного маслихата Акмолинской области от 25 сентября 2014 года № 5С-34/2. Зарегистрировано Департаментом юстиции Акмолинской области 15 октября 2014 года № 4398. Утратило силу решением Бурабайского районного маслихата Акмолинской области от 10 ноября 2023 года № 8С-10/1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Бурабайском районе
  kaz: Бурабай ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
