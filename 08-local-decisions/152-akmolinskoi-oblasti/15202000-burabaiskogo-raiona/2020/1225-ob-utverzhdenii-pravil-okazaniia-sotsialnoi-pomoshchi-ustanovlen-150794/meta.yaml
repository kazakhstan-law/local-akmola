  title:
    rus: О внесении изменения в решение Бурабайского районного маслихата от 25 декабря 2020 года № 6С-70/10 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан по Бурабайскому району»
    kaz: Бурабай аудандық мәслихатының 2020 жылғы 25 желтоқсандағы № 6С-70/10 «Бурабай ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
