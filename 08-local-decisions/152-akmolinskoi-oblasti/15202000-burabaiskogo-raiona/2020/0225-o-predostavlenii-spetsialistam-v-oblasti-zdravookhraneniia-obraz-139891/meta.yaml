act_code: '139891'
requisite: Решение Бурабайского районного маслихата Акмолинской области от 25 февраля 2020 года № 6С-56/2. Зарегистрировано Департаментом юстиции Акмолинской области 28 февраля 2020 года № 7702. Утратило силу решением Бурабайского районного маслихата Акмолинской области от 23 октября 2020 года № 6С-67/1 (вводится в действие со дня официального опубликования)
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Бурабайского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2020 год
  kaz: 2020 жылға арналған Бурабай ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
