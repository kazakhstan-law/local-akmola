act_code: '147841'
requisite: Решение Бурабайского районного маслихата Акмолинской области от 23 октября 2020 года № 6С-67/1. Зарегистрировано Департаментом юстиции Акмолинской области 28 октября 2020 года № 8100
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Бурабайского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2020 год
  kaz: 2020 жылға арналған Бурабай ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, кент, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
