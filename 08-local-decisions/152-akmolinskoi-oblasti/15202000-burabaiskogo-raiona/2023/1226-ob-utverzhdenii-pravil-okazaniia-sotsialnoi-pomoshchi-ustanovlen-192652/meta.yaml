    kaz: Бурабай аудандық мәслихатының 2023 жылғы 26 желтоқсандағы № 8С-12/11 «Бурабай ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
