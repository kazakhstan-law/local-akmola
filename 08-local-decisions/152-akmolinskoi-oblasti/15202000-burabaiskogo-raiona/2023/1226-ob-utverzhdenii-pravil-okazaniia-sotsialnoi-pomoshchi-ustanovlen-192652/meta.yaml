  title:
    rus: О внесении изменений в решение Бурабайского районного маслихата от 26 декабря 2023 года № 8С-12/11 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Бурабайском районе»
    kaz: Бурабай аудандық мәслихатының 2023 жылғы 26 желтоқсандағы № 8С-12/11 «Бурабай ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
