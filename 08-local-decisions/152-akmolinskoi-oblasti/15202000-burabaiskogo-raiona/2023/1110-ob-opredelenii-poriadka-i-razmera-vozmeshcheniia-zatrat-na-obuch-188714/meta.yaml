  title:
    rus: О внесении изменения в решение Бурабайского районного маслихата от 10 ноября 2023 года № 8С-10/1 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Бурабайском районе»
    kaz: «Бурабай ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі және мөлшерін айқындау туралы» Бурабай аудандық мәслихатының 2023 жылғы 10 қарашадағы № 8С-10/1 шешіміне өзгеріс енгізу туралы
