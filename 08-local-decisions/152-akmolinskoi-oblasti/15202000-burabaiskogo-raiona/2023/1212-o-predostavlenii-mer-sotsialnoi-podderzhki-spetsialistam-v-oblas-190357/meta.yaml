act_code: '190357'
requisite: Решение Бурабайского районного маслихата Акмолинской области от 12 декабря 2023 года № 8С-11/1
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Бурабайского района на 2024 год
  kaz: Бурабай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, кент, ауылдық округтер әкімдері аппараттарының 2024 жылға арналған мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
