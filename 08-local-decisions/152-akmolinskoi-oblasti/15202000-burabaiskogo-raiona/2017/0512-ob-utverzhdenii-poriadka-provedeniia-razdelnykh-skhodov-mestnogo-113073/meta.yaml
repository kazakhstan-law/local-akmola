act_code: '113073'
requisite: Решение Бурабайского районнного маслихата Акмолинской области от 12 мая 2017 года № 6С-15/2. Зарегистрировано Департаментом юстиции Акмолинской области 21 июня 2017 года № 6002. Утратило силу решением Бурабайского районного маслихата Акмолинской области от 29 апреля 2021 года № 7С-7/2 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Бурабайского района
  kaz: Бурабай ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
