  title:
    rus: О внесении изменения в решение Бурабайского районного маслихата от 12 мая 2017 года № 6С-15/2 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Бурабайского района»
    kaz: Бурабай аудандық мәслихатының 2017 жылғы 12 мамырдағы № 6С-15/2 «Бурабай ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгеріс енгізу туралы
