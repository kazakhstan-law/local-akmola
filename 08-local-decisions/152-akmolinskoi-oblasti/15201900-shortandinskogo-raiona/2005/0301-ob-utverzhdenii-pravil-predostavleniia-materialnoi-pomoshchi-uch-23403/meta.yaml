act_code: '23403'
requisite: Решение Шортандинского районного маслихата Акмолинской области от 1 марта 2005 года № С-11/7. Зарегистрировано Департаментом юстиции Акмолинской области 30 марта 2005 года № 3108. Утратило силу решением Шортандинского районного маслихата Акмолинской области от 29 апреля 2009 года № С-15/4
title:
  rus: Об утверждении Правил предоставления материальной помощи участникам и инвалидам Великой войны, вдовам погибших и умерших участников и инвалидов войны, труженикам тыла к 60-й годовщины Победы в Великой Отечественной войне 1941-1945 годов
  kaz: Ұлы Отан соғысының қатысушылары мен мүгедектеріне, тыл еңбеккелеріне, Ұлы Отан соғысында қаза тапқан және қайтыс болған жауынгерлердің жесірлеріне 1941-1945 жылдардағы Ұлы Отан соғысының Жеңісінің 60 жылдығына қарсы материалдық көмек көрсету Ережелерін бекіту туралы
