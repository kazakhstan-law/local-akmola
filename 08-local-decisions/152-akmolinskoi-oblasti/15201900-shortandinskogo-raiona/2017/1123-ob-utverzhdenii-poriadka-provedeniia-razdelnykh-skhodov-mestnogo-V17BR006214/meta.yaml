requisite: Решение Шортандинского районного маслихата Акмолинской области от 23 ноября 2017 года № С-20/5. Зарегистрировано Департаментом юстиции Акмолинской области 12 декабря 2017 года № 6214. Утратило силу решением Шортандинского районного маслихата Акмолинской области от 18 марта 2022 года № 7С-20/6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Шортандинского района
  kaz: Шортанды ауданының аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
