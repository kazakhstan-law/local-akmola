  title:
    rus: О признании утратившим силу решения Шортандинского районного маслихата от 23 ноября 2017 года № С-20/5 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Шортандинского района»
    kaz: Шортанды аудандық мәслихатының 2017 жылғы 23 қарашадағы № С-20/5 «Шортанды ауданының аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешімінің күші жойылды деп тану туралы
