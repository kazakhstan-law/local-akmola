  title:
    rus: О внесении изменения в решение Шортандинского районного маслихата от 23 ноября 2017 года № С-20/3 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шортандинского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2018 год»
    kaz: Шортанды аудандық мәслихатының 2017 жылғы 23 қарашадағы № С-20/3 «2018 жылға арналған Шортанды ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй алу немесе салу үшін көтерме жәрдемақы және әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
