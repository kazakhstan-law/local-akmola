requisite: Решение Шортандинского районного маслихата Акмолинской области от 2 декабря 2025 года № 8С-45/3. Отменено решением Шортандинского районного маслихата Акмолинской области от 10 октября 2026 года № 8С-58/4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Шортандинского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2026 год
  kaz: 2026 жылға арналған Шортанды ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
