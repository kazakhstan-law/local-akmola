act_code: '60710'
requisite: Решение Шортандинского районного маслихата Акмолинской области от 19 сентября 2011 года № С-42/4. Зарегистрировано Управлением юстиции Шортандинского района Акмолинской области 7 октября 2011 года № 1-18-140. Утратило силу решением Шортандинского районного маслихата Акмолинской области от 17 августа 2015 года № С-41/5
title:
  rus: Об оказании единновременной социальной помощи специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельской местности Шортандинского района, для приобретения топлива
  kaz: Шортанды ауданының селолық жерлерінде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт, мемлекеттік ұйымдарының мамандарына отын сатып алу үшін бір жолғы әлеуметтік көмек көрсету туралы
