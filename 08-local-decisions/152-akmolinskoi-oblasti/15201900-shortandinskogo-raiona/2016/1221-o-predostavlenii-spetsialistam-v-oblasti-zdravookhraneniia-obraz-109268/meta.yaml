act_code: '109268'
requisite: Решение Шортандинского районного маслихата Акмолинской области от 21 декабря 2016 года № С-11/4. Зарегистрировано Департаментом юстиции Акмолинской области 16 января 2017 года № 5708
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шортандинского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2017 год
  kaz: 2017 жылға арналған Шортанды ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй алу немесе салу үшін көтерме жәрдемақы және әлеуметтік қолдау көрсету туралы
