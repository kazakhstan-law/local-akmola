  title:
    rus: О внесении изменений и дополнения в решение Шортандинского районного маслихата от 21 декабря 2016 года № С-11/3 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Шортандинском районе»
    kaz: Шортанды аудандық мәслихатының 2016 жылғы 21 желтоқсандағы № С-11/3 «Шортанды ауданында мүгедектер қатарындағы кемтар балаларды жеке оқу жоспары бойынша үйде оқытуға жұмсаған шығындарды өтеу тәртібі мен мөлшерін белгілеу туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
