requisite: Решение Шортандинского районного маслихата Акмолинской области от 21 декабря 2016 года № С-11/3. Зарегистрировано Департаментом юстиции Акмолинской области 16 января 2017 года № 5710. Утратило силу решением Шортандинского районного маслихата Акмолинской области от 24 октября 2023 года № 8С-9/2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Шортандинском районе
  kaz: Шортанды ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
