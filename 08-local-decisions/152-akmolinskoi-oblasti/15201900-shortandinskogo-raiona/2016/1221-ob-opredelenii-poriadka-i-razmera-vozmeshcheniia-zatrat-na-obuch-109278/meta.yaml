  title:
    rus: О внесении изменений в решение Шортандинского районного маслихата от 21 декабря 2016 года № С-11/3 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Шортандинском районе»
    kaz: Шортанды аудандық мәслихатының 2016 жылғы 21 желтоқсандағы № С-11/3 «Шортанды ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
