act_code: '160723'
requisite: Решение Шортандинского районного маслихата Акмолинской области от 23 ноября 2021 года № 7С-14/5
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Шортандинского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2022 год
  kaz: 2022 жылға арналған Шортанды ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, кенттер, ауылдық округтер əкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
