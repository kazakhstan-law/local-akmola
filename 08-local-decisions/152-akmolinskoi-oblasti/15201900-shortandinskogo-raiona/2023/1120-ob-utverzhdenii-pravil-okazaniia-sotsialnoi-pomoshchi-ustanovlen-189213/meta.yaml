  title:
    rus: О внесении изменений в решение Шортандинского районного маслихата от 20 ноября 2023 года № 8С-10/3 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Шортандинского района»
    kaz: Шортанды аудандық мәслихатының 2023 жылғы 20 қарашадағы № 8С-10/3 «Шортанды ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
