act_code: '191728'
requisite: Решение Шортандинского районного маслихата Акмолинской области от 25 декабря 2023 года № 8С-13/4
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Шортандинского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2024 год
  kaz: 2024 жылға арналған Шортанды ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, кенттер, ауылдық округтер əкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
