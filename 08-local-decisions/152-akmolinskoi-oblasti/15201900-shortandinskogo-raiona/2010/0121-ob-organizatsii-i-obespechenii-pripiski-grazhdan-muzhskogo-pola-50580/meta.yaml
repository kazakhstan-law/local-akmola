requisite: Решение акима Шортандинского района Акмолинской области от 21 января 2010 года № 1. Зарегистрировано Управлением юстиции Шортандинского района Акмолинской области 5 февраля 2010 года № 1-18-105. Утратило силу - решением акима Шортандинского района Акмолинской области от 20 декабря 2010 года № 9
title:
  rus: Об организации и обеспечении приписки граждан мужского пола, которым в год приписки исполняется семнадцать лет, к призывному участку государственного учреждения "Отдел по делам обороны Шортандинского района Акмолинской области"
  kaz: Тіркеу жылы он жеті жасқа толатын еркек жынысты азаматтарды "Ақмола облысы Шортанды ауданының қорғаныс істері жөніндегі бөлімі" мемлекеттік мекемесінің шақыру учаскесіне тіркеуді ұйымдастыру және қамтамасыз ету туралы
