act_code: '231533'
requisite: Решение Шортандинского районного маслихата Акмолинской области от 10 октября 2026 года № 8С-58/4
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, архивного дела, культуры, спорта, в сфере цифровых технологий, агропромышленного комплекса, государственным служащим аппаратов акимов поселков, сельских округов, прибывшим или вернувшимся с обучения для работы и проживания в сельские населенные пункты Шортандинского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2026 год
  kaz: 2026 жылға арналған Шортанды ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген немесе оқудан оралған денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, архив ісі, мәдениет, спорт саласындағы, цифрлық технологиялар, агроөнеркәсіптік кешен саласындағы мамандарға, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
