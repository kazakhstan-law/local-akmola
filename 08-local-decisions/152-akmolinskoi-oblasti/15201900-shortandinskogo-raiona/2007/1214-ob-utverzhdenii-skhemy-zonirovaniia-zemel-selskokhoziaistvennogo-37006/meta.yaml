requisite: Решение Шортандинского районного маслихата Акмолинской области от 14 декабря 2007 года № С-3/13. Зарегистрировано Управлением юстиции Шортандинского района Акмолинской области 21 января 2008 года № 1-18-44. Утратило силу решением Шортандинского районного маслихата Акмолинской области от 26 февраля 2010 года № С-24/11
title:
  rus: Об утверждении схемы зонирования земель сельскохозяйственного назначения, сельских населенных пунктов в Шортандинском районе Акмолинской области и поправочный коэффициентов к базовым ставкам земельного налога
  kaz: Ақмола облысы Шортанды ауданының ауыл шаруашылық тағайындауындағы жерлері мен елді мекендердің жерлерін аймақтарға бөлу сызбасын және жер салығының базалық мөлшерлемесінің түзету коэффициентерін бекіту туралы
