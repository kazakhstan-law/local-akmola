  title:
    rus: О внесении изменений в решение Шортандинского районного маслихата от 25 октября 2013 года № С-21/3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Шортандинском районе»
    kaz: Шортанды аудандық мәслихатының 2013 жылғы 25 қазандағы № С-21/3 «Шортанды ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
