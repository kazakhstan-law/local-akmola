requisite: Решение Шортандинского районного маслихата Акмолинской области от 29 августа 2019 года № С-46/3. Зарегистрировано Департаментом юстиции Акмолинской области 2 сентября 2019 года № 7349. Утратило силу решением Шортандинского районного маслихата Акмолинской области от 20 ноября 2023 года № 8С-10/3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Шортандинского района
  kaz: Шортанды ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы
