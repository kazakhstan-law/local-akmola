act_code: '137634'
requisite: Решение Шортандинского районного маслихата Акмолинской области от 24 декабря 2019 года № С-51/3. Зарегистрировано Департаментом юстиции Акмолинской области 30 декабря 2019 года № 7606. Утратило силу решением Шортандинского районного маслихата Акмолинской области от 9 октября 2020 года № С-64/3 (вводится в действие со дня официального опубликования)
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шортандинского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2020 год
  kaz: 2020 жылға арналған Шортанды ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
