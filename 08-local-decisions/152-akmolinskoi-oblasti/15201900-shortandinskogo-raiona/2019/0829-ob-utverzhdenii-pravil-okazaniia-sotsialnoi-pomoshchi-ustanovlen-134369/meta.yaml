  title:
    rus: О внесении изменений в решение Шортандинского районного маслихата от 29 августа 2019 года № С-46/3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Шортандинского района»
    kaz: Шортанды аудандық мәслихатының 2019 жылғы 29 тамыздағы № С-46/3 «Шортанды ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
