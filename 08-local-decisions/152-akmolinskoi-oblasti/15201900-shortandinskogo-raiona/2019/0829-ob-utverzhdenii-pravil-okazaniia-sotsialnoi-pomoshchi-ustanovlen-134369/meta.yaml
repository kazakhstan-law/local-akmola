  title:
    rus: О внесении изменений в решение Шортандинского районного маслихата от 29 августа 2019 года № С-46/3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Шортандинского района»
