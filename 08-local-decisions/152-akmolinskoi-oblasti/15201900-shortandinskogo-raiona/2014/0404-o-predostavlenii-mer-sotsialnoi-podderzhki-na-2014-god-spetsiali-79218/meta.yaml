act_code: '79218'
requisite: Решение Шортандинского районного маслихата Акмолинской области от 4 апреля 2014 года № С-26/5. Зарегистрировано Департаментом юстиции Акмолинской области 23 апреля 2014 года № 4120
title:
  rus: О предоставлении мер социальной поддержки на 2014 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шортандинского района
  kaz: Шортанды ауданындағы ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2014 жылға әлеуметтік қолдау шараларын ұсыну туралы
