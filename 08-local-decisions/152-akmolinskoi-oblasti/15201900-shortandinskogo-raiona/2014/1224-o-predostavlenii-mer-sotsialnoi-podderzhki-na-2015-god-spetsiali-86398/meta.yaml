act_code: '86398'
requisite: Решение Шортандинского районного маслихата Акмолинской области от 24 декабря 2014 года № С-36/4. Зарегистрировано Департаментом юстиции Акмолинской области 15 января 2015 года № 4590
title:
  rus: О предоставлении мер социальной поддержки на 2015 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шортандинского района
  kaz: Шортанды ауданындағы ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және  агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылға әлеуметтік қолдау шараларын ұсыну туралы
