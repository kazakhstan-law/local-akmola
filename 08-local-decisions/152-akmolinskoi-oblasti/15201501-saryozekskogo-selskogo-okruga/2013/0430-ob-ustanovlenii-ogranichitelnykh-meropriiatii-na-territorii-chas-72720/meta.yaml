act_code: '72720'
requisite: Решение акима Приреченского сельского округа Денисовского района Костанайской области от 30 апреля 2013 года № 1. Зарегистрировано Департаментом юстиции Костанайской области 21 мая 2013 года № 4136. Утратило силу решением акима Приреченского сельского округа Денисовского района Костанайской области от 16 июля 2014 года № 1
title:
  rus: Об установлении ограничительных мероприятий на территории частных подворий сел Окраинка, Приреченка Приреченского сельского округа, и на территорию животноводческого комплекса товарищества с ограниченной ответственностью "Приреченское", расположенного на территории Приреченского сельского округа
  kaz: Приречен селолық округінің Окраинка, Приреченка селолары жеке аулаларының аумағында, және Приречен селолық округінің аумағында орналасқан "Приреченское" жауапкершілігі шектеулі серіктестігінің мал шаруашылығы кешені аумағында шектеу шараларын белгілеу туралы
