  title:
    rus: О внесении изменения в решение маслихата города Косшы от 1 августа 2022 года № 85/17-7 «Об утверждении тарифа для населения на сбор, транспортировку, сортировку и захоронение твердых бытовых отходов по городу Косшы»
    kaz: Қосшы қаласы мәслихатының 2022 жылғы 1 тамыздағы № 85/17-7 «Қосшы қаласы бойынша халық үшін тұрмыстық қатты қалдықтарды жинауға, тасымалдауға, сұрыптауға және көмуге арналған тарифтерді бекіту туралы» шешіміне өзгеріс енгізу туралы
