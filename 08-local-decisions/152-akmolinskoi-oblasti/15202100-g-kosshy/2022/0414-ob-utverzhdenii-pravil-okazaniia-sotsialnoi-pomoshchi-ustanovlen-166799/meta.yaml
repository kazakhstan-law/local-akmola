requisite: Решение маслихата города Косшы Акмолинской области от 14 апреля 2022 года № 57/12-7. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 апреля 2022 года № 27670. Утратило силу решением маслихата города Косшы Акмолинской области от 29 декабря 2023 года № 85/19-8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Косшы
