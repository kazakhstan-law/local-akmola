  title:
    rus: О внесении изменений и дополнения в решение маслихата города Косшы от 14 апреля 2022 года № 57/12-7 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Косшы»
    kaz: Қосшы қаласы мәслихатының 2022 жылғы 14 сәуірдегі № 57/12-7 «Қосшы қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
