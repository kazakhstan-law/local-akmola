  title:
    rus: О внесении изменений в решение маслихата города Косшы от 17 марта 2022 года № 46/11-7 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в городе Косшы»
    kaz: Қосшы қаласы мәслихатының 2022 жылғы 17 наурыздағы № 46/11-7 «Қосшы қаласында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
