requisite: Решение маслихата города Косшы Акмолинской области от 17 марта 2022 года № 46/11-7. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 апреля 2022 года № 27356. Утратило силу решением маслихата города Косшы Акмолинской области от 7 декабря 2023 года № 68/15-8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в городе Косшы
  kaz: Қосшы қаласында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
