  title:
    rus: О внесении изменений в решение  маслихата города Косшы от 29 декабря 2023 года № 85/19-8 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Косшы»
    kaz: «Қосшы каласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Қосшы қаласының мәслихатының 2023 жылғы 29 желтоқсандағы № 85/19-8 шешіміне өзгеріс енгізу туралы
