  requisite: Решение Жаркаинского районного маслихата Акмолинской области от 2 ноября 2012 года № 5С-11/3. Зарегистрировано Департаментом юстиции Акмолинской области 19 ноября 2012 года № 3491. Утратило силу решением Жаркаинского районного маслихата Акмолинской области от 4 марта 2013 года № 5С-16/3
  title:
    rus: О внесении изменений в решение Жаркаинского районного маслихата от 6 марта 2012 года № 5С-2/6 "О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельских населенных пунктах Жаркаинского района"
    kaz: Жарқайың аудандық мәслихаттың 2012 жылғы 6 наурыздағы № 5С-2/6 "Жарқайың ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамтамасыз ету, білім беру, мәдениет және спорт мемлекеттік ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы" шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/68662/rus
