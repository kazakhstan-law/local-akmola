  requisite: Решение Жаркаинского районного маслихата Акмолинской области от 21 октября 2024 года № 8С-35/3
  title:
    rus: О внесении изменения в решение Жаркаинского районного маслихата от 13 декабря 2023 года № 8С-18/3 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жаркаинского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2024 год»
    kaz: «2024 жылға арналған Жарқайың ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер əкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы» Жарқайың аудандық мәслихатының 2023 жылғы 13 желтоқсандағы № 8С-18/3 шешіміне өзгеріс енгізу туралы
