  title:
    rus: О внесении изменения в решение Жаркаинского районного маслихата от 12 декабря 2017 года № 6С-16/3 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жаркаинского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2018 год»
