title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жаркаинского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2018 год
  kaz: 2018 жылға арналған Жарқайың ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй алу немесе салу үшін көтерме жәрдемақы және әлеуметтік қолдау көрсету туралы
