  title:
    rus: О признании утратившим силу решения Жаркаинского районного маслихата от 08 февраля 2021 года № 7С-3/1 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Жаркаинского района»
    kaz: Жарқайың аудандық мәслихатының 2021 жылғы 08 ақпандағы № 7С-3/1 «Жарқайың ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешімінің күші жойылды деп тану туралы
