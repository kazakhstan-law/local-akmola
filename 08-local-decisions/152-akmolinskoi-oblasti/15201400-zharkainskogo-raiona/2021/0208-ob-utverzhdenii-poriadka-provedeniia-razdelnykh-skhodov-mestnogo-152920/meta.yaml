act_code: '152920'
requisite: Решение Жаркаинского районного маслихата Акмолинской области от 8 февраля 2021 года № 7С-3/1. Зарегистрировано Департаментом юстиции Акмолинской области 17 февраля 2021 года № 8360. Утратило силу решением Жаркаинского районного маслихата Акмолинской области от 24 июня 2022 года № 7С-32/2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Жаркаинского района
  kaz: Жарқайың ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
