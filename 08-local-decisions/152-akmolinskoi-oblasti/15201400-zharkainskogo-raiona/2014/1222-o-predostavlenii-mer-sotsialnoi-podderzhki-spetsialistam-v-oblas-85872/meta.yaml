requisite: Решение Жаркаинского районного маслихата Акмолинской области от 22 декабря 2014 года № 5С-39/4. Зарегистрировано Департаментом юстиции Акмолинской области 14 января 2015 года № 4583
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жаркаинского района на 2015 год
  kaz: 2015 жылға арналған Жарқайың ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
