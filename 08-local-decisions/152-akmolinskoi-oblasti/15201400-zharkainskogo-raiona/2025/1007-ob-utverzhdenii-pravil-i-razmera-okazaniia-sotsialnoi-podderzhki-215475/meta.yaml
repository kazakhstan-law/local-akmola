act_code: '215475'
requisite: Решение Жаркаинского районного маслихата Акмолинской области от 7 октября 2025 года № 8С-58/2. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 октября 2025 года № 37101
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Жаркаинского района
  kaz: Жарқайың ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету мөлшері және қағидаларын бекіту туралы
