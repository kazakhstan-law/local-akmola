act_code: '212155'
requisite: Решение Жаркаинского районного маслихата Акмолинской области от 10 июля 2025 года № 8С-52/3. Отменено решением Жаркаинского районного маслихата Акмолинской области от 18 июля 2025 года № 8С-54/2 (вступает в силу и вводится в действие со дня подписания)
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Жаркаинского района
  kaz: Жарқайың ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
