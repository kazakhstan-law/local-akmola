act_code: '148922'
requisite: Решение Жаркаинского районного маслихата Акмолинской области от 23 ноября 2020 года № 6С-63/2. Зарегистрировано Департаментом юстиции Акмолинской области 26 ноября 2020 года № 8169
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жаркаинского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2020 год
  kaz: 2020 жылға арналған Жарқайың ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер əкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
