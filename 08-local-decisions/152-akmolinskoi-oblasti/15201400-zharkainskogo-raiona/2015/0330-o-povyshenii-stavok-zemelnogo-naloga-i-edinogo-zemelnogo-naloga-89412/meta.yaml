  title:
    rus: О внесении изменения и дополнений в решение Жаркаинского районного маслихата от 30 марта 2015 года № 5С-40/8 «О повышении ставки земельного налога и ставки единого земельного налога на не используемые земли сельскохозяйственного назначения Жаркаинского района»
    kaz: «Жарқайың ауданының пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының мөлшерлемелерін және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы» Жарқайың аудандық мәслихатының 2015 жылғы 30 наурыздағы № 5С-40/8 шешіміне өзгеріс және толықтырулар енгізу туралы
