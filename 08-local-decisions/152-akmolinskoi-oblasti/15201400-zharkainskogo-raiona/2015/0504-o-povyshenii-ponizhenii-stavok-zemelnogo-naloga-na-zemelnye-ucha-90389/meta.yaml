act_code: '90389'
requisite: Решение Жаркаинского районного маслихата Акмолинской области от 4 мая 2015 года № 5С-41/7. Зарегистрировано Департаментом юстиции Акмолинской области 2 июня 2015 года № 4817. Утратило силу решением Жаркаинского районного маслихата Акмолинской области от 26 ноября 2021 года № 7С-18/2 (вводится в действие с 1 января 2022 года)
title:
  rus: О повышении (понижении) ставок земельного налога на земельные участки города Державинска и сельских населенных пунктов Жаркаинского района
  kaz: Жарқайың ауданының Державин қаласы және ауылдық елді мекендері жер учаскелеріне, жер салығының мөлшерлемелерін арттыру (азайту) туралы
