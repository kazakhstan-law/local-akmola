  requisite: Решение Жаркаинского районного маслихата Акмолинской области от 18 апреля 2016 года № 6С-2/3. Зарегистрировано Департаментом юстиции Акмолинской области 22 апреля 2016 года № 5313. Утратило силу решением Жаркаинского районного маслихата Акмолинской области от 26 ноября 2021 года № 7С-18/2 (вводится в действие с 1 января 2022 года)
  title:
    rus: О внесении изменений в решение Жаркаинского районного маслихата от 4 мая 2015 года № 5С-41/7 «О повышении (понижении) базовых ставок земельного налога на земельные участки города Державинска и сельских населенных пунктов Жаркаинского района, за исключением земель, выделенных (отведенных) под автостоянки (паркинги), автозаправочные станции»
    kaz: «Жарқайың ауданының Державин қаласы және ауылдық елді мекендері жер учаскелеріне, автотұрақтарға (паркингтерге), жанар май құю станцияларына бөлінген (қалдырылған) жерлерден басқаларына жер салығының базалық ставкаларын жоғарылату (төмендету) туралы» Жарқайың аудандық мәслихатының 2015 жылғы 4 мамырдағы № 5С-41/7 шешіміне өзгерістер енгізу туралы
