act_code: '97706'
requisite: Решение Жаркаинского районного маслихата Акмолинской области от 22 декабря 2015 года № 5С-46/5. Зарегистрировано Департаментом юстиции Акмолинской области 13 января 2016 года № 5198
title:
  rus: «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жаркаинского района на 2016 год»
  kaz: 2016 жылға арналған Жарқайың ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
