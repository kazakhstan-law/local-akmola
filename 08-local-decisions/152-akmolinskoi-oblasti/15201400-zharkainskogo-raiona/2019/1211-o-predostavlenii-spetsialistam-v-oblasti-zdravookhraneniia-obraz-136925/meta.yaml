act_code: '136925'
requisite: Решение Жаркаинского районного маслихата Акмолинской области от 11 декабря 2019 года № 6С-46/3. Зарегистрировано Департаментом юстиции Акмолинской области 12 декабря 2019 года № 7568. Утратило силу решением Жаркаинского районного маслихата Акмолинской области от 23 ноября 2020 года № 6С-63/2 (вводится в действие со дня официального опубликования)
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жаркаинского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2020 год
  kaz: 2020 жылға арналған Жарқайың ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
