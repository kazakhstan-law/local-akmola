title:
  rus: Об определении порядка и размера оказания социальной поддержки медицинским и фармацевтическим работникам, направленным для работы в сельскую местность Акмолинской области за счет бюджетных средств
  kaz: Бюджет қаражаты есебінен Ақмола облысының ауылдық жеріне жұмысқа жіберілген медицина және фармацевтика қызметкерлеріне әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін айқындау туралы
