requisite: Решение Акмолинского областного маслихата от 23 апреля 2001 года № С-8-02. Зарегистрировано Управлением юстиции Акмолинской области 8 июня 2001 года № 651а. Утратило силу решением Акмолинского областного маслихата от 10 декабря 2004 года № 3С-9-19
title:
  rus: Об уточнении областного бюджета на 2001 год в соответствии с постановлением Правительства Республики Казахстан от 18.04.2001г. № 503 «О некоторых вопросах кредитования местных бюджетов в целях обеспечения сельхозтоваропроизводителей горюче-смазочными материалами на период весенне-полевых и уборочных работ 2001 года»
  kaz: ҚР Үкіметінің 2001 жылғы 18 сәуірдегі № 503 «Ауыл шаруашылығы тауарларын өндірушілерді 2001 жылғы көктемгі егіс және егін жинау жұмыстары кезеңінде жанар-жағармай материалдарымен қамтамасыз ету мақсатында жергілікті бюджеттерді несиелендірудің кейбір мәселелері туралы» қаулысына сәйкес 2001 жылға арналған облыстық бюджетті нақтылау туралы
