  title:
    rus: О внесении изменений в решение Акмолинского областного маслихата от 21 декабря 2021 года № 7С-13-3 «Об определении порядка и размера оказания социальной поддержки медицинским и фармацевтическим работникам, направленным для работы в сельскую местность и поселки, города районного и областного значения Акмолинской области за счет бюджетных средств»
    kaz: «Ақмола облысының ауылдық жеріне және кенттеріне, аудандық және облыстық маңызы бар қалаларына жұмысқа жіберілген медицина және фармацевтика қызметкерлеріне бюджет қаражаты есебінен әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін айқындау туралы» Ақмола облыстық мәслихатының 2021 жылғы 21 желтоқсандағы № 7С-13-3 шешіміне өзгерістер енгізу туралы
