title:
  rus: Об определении системы мер социальной поддержки медицинских и фармацевтических работников, направленных для работы в сельскую местность и поселки, города районного и областного значения, а также правил и размера оказания им социальной поддержки за счет бюджетных средств
  kaz: Ауылдық елді мекендерге және кенттерге, аудандық және облыстық маңызы бар қалаларға жұмыс істеуге жіберілген медициналық және фармацевтикалық қызметкерлерге әлеуметтік қолдау көрсету шараларының жүйесін, сондай-ақ оларға бюджет қаражаты есебінен әлеуметтік қолдау көрсету қағидалары мен мөлшерін айқындау туралы
