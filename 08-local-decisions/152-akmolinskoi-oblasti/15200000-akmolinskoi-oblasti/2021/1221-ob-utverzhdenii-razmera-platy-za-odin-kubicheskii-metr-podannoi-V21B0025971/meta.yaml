  title:
    rus: О признании утратившим силу решения Акмолинского областного маслихата от 21 декабря 2021 года № 7С-13-2 «Об утверждении размера платы за один кубический метр поданной питьевой воды населению из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения в Акмолинской области»
    kaz: «Ақмола облысында ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды топтық және оқшау жүйелерінен халыққа берілген ауызсудың бір текше метрі үшін төлемақы мөлшерін бекіту туралы» Ақмола облыстық мәслихатының 2021 жылғы 21 желтоқсандағы № 7С-13-2 шешімінің күші жойылды деп тану туралы
