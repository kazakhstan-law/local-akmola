requisite: Решение Акмолинского областного маслихата от 7 декабря 2012 года № 5С-8-10. Зарегистрировано Департаментом юстиции Акмолинской области 20 декабря 2012 года № 3547. Утратило силу решением Акмолинского областного маслихата от 10 октября 2018 года № 6С-24-8 (вводится в действие со дня официального опубликования)
title:
  rus: Об установлении размера возмещения расходов на топливо специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, работающим и проживающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде жұмыс істейтін және тұратын мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отынға шығындарын өтеу мөлшерін белгілеу туралы
