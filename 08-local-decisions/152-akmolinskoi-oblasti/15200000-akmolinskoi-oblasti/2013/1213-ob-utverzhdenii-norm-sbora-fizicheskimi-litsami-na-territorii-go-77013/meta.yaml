title:
  rus: Об утверждении норм сбора физическими лицами на территории государственного лесного фонда для собственных нужд лесных ресурсов и ставок платы за лесные пользования в государственном лесном фонде и особо охраняемых природных территориях Акмолинской области на 2014-2016 годы
  kaz: Ақмола облысының мемлекеттік орман қорының аумағында жеке тұлғалардың өз қажеттіліктері үшін орман ресурстарын жинау нормаларын және мемлекеттік орман қорында және ерекше қорғалатын табиғи аумақтарында орманды пайдаланғаны үшін 2014-2016 жылдарға арналған төлем ставкаларын бекіту туралы
