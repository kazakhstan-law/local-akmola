title:
  rus: Об утверждении границ оценочных зон и поправочных коэффициентов к базовым  ставкам платы  за земельные участки города Степногорск и населенных пунктов в административных границах города Степногорск Акмолинской области
  kaz: Ақмола облысы Степногорск қаласы және Степногорск қаласының әкімшілік шекараларында елді мекендеріндегі бағалау аймақтарының шекаралары және жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы
