title:
  rus: Об утверждении норм сбора физическими лицами на территории государственного лесного фонда для собственных нужд лесных ресурсов и ставок платы за лесные пользования в государственном лесном фонде и особо охраняемые природных территориях Акмолинской области
  kaz: Ақмола облысының мемлекеттік орман қорының аумағында өз қажеттіліктері үшін жеке тұлғалардың орман ресурстарын жинау нормаларын және мемлекеттік орман қорында және ерекше қорғалатын табиғи аумақтарында орманды пайдаланғаны үшін төлем ставкаларын бекіту туралы
