  requisite: Решение Акмолинского областного маслихата от 19 марта 2025 года № 8С-18-4
  title:
    rus: О внесении изменения и дополнения в решение Акмолинского областного маслихата от 27 июня 2024 года № 8С-11-10 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Акмолинской области при амбулаторном лечении бесплатно»
    kaz: «Ақмола облысы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша беру туралы» Ақмола облыстық мәслихатының 2024 жылғы 27 маусымдағы № 8С-11-10 шешіміне өзгеріс пен толықтыру енгізу туралы
