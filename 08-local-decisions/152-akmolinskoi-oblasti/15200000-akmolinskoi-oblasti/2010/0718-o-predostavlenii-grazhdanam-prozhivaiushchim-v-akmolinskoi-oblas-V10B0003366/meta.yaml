title:
  rus: О предоставлении гражданам, проживающим в Акмолинской области, бесплатного проезда за пределы населенного пункта на лечение за счет бюджетных средств
  kaz: Ақмола облысында тұратын азаматтарға емделу үшін елді мекен шегінен тысқары жерлерге бюджет қаражаты есебінен тегін жол жүруді ұсыну туралы
