title:
  rus: Об утверждении ставок ежемесячной платы за размещение объектов наружной (визуальной) рекламы в населенных пунктах и в полосе отвода автомобильных дорог общего пользования местного значения Акмолинской области
  kaz: Ақмола облысының елді мекендері мен жергілікті маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінде сыртқы (көрнекі) жарнама нысандарын орналастыру үшін ай сайынғы төлемақы ставкаларын бекіту туралы
