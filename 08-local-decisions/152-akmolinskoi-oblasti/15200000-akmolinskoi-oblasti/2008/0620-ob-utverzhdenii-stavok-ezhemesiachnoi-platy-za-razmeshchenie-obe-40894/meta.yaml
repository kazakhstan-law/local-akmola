  title:
    rus: О внесении изменений и дополнений в решение Акмолинского областного маслихата № 4С-7-15 от 20 июня 2008 года "Об утверждении ставок ежемесячной платы за размещение объектов наружной (визуальной) рекламы в населенных пунктах и в полосе отвода автомобильных дорог общего пользования местного значения Акмолинской области"
    kaz: Ақмола облыстық мәслихатының 2008 жылғы 20 маусымдағы № 4С-7-15 "Ақмола облысының елді мекендері мен жергілікті маңызы бар жалпыға ортақ пайданылатын автомобиль жолдарының бөлінген белдеуінде сыртқы (көрнекі) жарнама нысандарын орналастыру үшін ай сайынғы төлемақы ставкаларын бекіту туралы" шешіміне өзгерістер мен толықтырулар енгізу туралы
