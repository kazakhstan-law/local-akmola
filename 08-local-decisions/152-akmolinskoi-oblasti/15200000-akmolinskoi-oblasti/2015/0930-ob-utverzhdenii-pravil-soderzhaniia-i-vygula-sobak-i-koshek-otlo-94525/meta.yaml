title:
  rus: Об утверждении Правил содержания и выгула собак и кошек, отлова и уничтожения бродячих собак и кошек в городах и других населенных пунктах Акмолинской области
  kaz: Ақмола облысының қалаларында және басқа да елдi мекендерінде иттер мен мысықтарды асырау және серуендету, қаңғыбас иттер мен мысықтарды аулау және жою Қағидаларын бекіту туралы
