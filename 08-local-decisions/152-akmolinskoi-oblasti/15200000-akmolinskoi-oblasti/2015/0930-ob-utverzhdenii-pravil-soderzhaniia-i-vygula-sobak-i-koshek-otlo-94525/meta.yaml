  title:
    rus: О внесении изменений и дополнений в решение Акмолинского областного маслихата от 30 сентября 2015 года № 5С-41-8 «Об утверждении Правил содержания и выгула собак и кошек, отлова и уничтожения бродячих собак и кошек в городах и других населенных пунктах Акмолинской области»
    kaz: Ақмола облыстық мәслихатының 2015 жылғы 30 қыркүйектегі № 5С-41-8 «Ақмола облысының қалаларында және басқа да елдi мекендерінде иттер мен мысықтарды асырау және серуендету, қаңғыбас иттер мен мысықтарды аулау және жою Қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
