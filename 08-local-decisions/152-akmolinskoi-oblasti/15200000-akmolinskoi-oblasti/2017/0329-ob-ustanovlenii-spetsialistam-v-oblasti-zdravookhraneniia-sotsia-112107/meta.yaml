  title:
    rus: О внесении изменений в решение Акмолинского областного маслихата от 29 марта 2017 года № 6С-9-7 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности Акмолинской области»
    kaz: «Ақмола облысының азаматтық қызметшілері болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандарына жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелер белгiлеу туралы» Ақмола облыстық мәслихатының 2017 жылғы 29 наурыздағы № 6С-9-7 шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/135638/rus
