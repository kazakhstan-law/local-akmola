act_code: '112107'
requisite: Решение Акмолинского областного маслихата от 29 марта 2017 года № 6С-9-7. Зарегистрировано Департаментом юстиции Акмолинской области 3 мая 2017 года № 5928
title:
  rus: Об установлении специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии и лесного хозяйства, являющимся гражданскими служащими и работающим в сельской местности Акмолинской области, повышенных на двадцать пять процентов должностных окладов и тарифных ставок по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметшілер болып табылатын және Ақмола облысының ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт, ветеринария және орман шаруашылығы саласындағы мамандарға қызметтiң осы түрлерiмен қалалық жағдайда айналысатын азаматтық қызметшiлердiң айлықақыларымен және мөлшерлемелерімен салыстырғанда жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелерін белгiлеу туралы
