act_code: '147247'
requisite: Решение Акмолинского областного маслихата от 7 октября 2020 года № 6С-50-7. Зарегистрировано Департаментом юстиции Акмолинской области 9 октября 2020 года № 8073. Утратило силу решением Акмолинского областного маслихата от 27 июня 2024 года № 8С-11-9 (вводится в действие со дня его первого официального опубликования)
title:
  rus: О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Акмолинской области при амбулаторном лечении бесплатно
  kaz: Ақмола облысы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша беру туралы
