  title:
    rus: О внесении изменения в решение Акмолинского областного маслихата от 7 октября 2020 года № 6С-50-7 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Акмолинской области при амбулаторном лечении бесплатно»
    kaz: «Ақмола облысы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша беру туралы» Ақмола облыстық мәслихатының 2020 жылғы 7 қазандағы № 6С-50-7 шешіміне өзгеріс енгізу туралы
