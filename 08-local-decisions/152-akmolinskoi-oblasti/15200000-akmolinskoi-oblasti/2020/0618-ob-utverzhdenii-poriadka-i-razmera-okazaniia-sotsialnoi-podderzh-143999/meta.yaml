  title:
    rus: О внесении изменения в решение Акмолинского областного маслихата от 18 июня 2020 года № 6С-45-6 «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств педагогам, осуществляющим профессиональную деятельность в сельских населенных пунктах Акмолинской области»
    kaz: Ақмола облыстық мәслихатының «Ақмола облысының ауылдық елді мекендерінде кәсіптік қызметін жүзеге асыратын педагогтерге бюджет қаражатының есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін бекіту туралы» 2020 жылғы 18 маусымдағы № 6С-45-6 шешіміне өзгеріс енгізу туралы
