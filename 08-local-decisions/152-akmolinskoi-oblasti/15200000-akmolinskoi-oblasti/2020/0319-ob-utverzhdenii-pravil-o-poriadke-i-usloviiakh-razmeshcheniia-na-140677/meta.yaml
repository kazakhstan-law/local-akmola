act_code: '140677'
requisite: Решение Акмолинского областного маслихата от 19 марта 2020 года № 6С-41-7. Зарегистрировано Департаментом юстиции Акмолинской области 30 марта 2020 года № 7751
title:
  rus: Об утверждении Правил о порядке и условиях размещения наружной (визуальной) рекламы на открытом пространстве за пределами помещений в населенных пунктах, в полосе отвода автомобильных дорог общего пользования, на открытом пространстве за пределами помещений вне населенных пунктов и вне полосы отвода автомобильных дорог общего пользования Акмолинской области
  kaz: Ақмола облысының сыртқы (көрнекі) жарнаманы елді мекендердегі үй-жайлардың шегінен тыс ашық кеңістікте, жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінде, елді мекендерден тыс жердегі үй-жайлардың шегінен тыс ашық кеңістікте және жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінен тыс жерде орналастыру тәртібі мен шарттары туралы қағидаларды бекіту туралы
