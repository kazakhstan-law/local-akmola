requisite: Решение Егиндыкольского районного маслихата Акмолинской области от 16 сентября 2016 года № 6С7-3. Зарегистрировано Департаментом юстиции Акмолинской области 29 сентября 2016 года № 5553. Утратило силу решением Егиндыкольского районного маслихата Акмолинской области от 31 января 2024 года № 8С16-2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Егиндыкольском районе
  kaz: Егіндікөл ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы
