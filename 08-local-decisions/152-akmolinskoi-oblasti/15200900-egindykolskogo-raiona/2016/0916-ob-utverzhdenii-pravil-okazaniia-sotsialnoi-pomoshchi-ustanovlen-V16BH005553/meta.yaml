  title:
    rus: О внесении изменений в решение Егиндыкольского районного маслихата от 16 сентября 2016 года № 6С 7-3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Егиндыкольском районе»
    kaz: «Егіндікөл ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Егіндікөл аудандық мәслихатының 2016 жылғы 16 қыркүйектегі № 6С 7-3 шешіміне өзгерістер енгізу туралы
