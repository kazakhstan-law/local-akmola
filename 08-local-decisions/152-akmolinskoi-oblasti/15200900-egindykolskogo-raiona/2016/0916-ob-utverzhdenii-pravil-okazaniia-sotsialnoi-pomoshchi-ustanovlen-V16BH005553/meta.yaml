  title:
    rus: О внесении изменения в решение маслихата Егиндыкольского района от 16 сентября 2016 года № 6С7-3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Егиндыкольского района»
    kaz: «Егіндікөл ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» Егіндікөл аудандық мәслихатының 2016 жылғы 16 қыркүйектегі № 6С7-3 шешіміне өзгеріс енгізу туралы
