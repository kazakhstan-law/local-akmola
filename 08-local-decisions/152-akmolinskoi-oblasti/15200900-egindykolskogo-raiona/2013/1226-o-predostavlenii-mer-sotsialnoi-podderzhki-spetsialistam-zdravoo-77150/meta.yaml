act_code: '77150'
requisite: Решение Егиндыкольского районного маслихата Акмолинской области от 26 декабря 2013 года № 5С 23-3. Зарегистрировано Департаментом юстиции Акмолинской области 24 января 2014 года № 3988. Утратило силу решением Егиндыкольского районного маслихата Акмолинской области от 29 сентября 2014 года № 5С30-3
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Егиндыкольского района на 2014 год
  kaz: 2014 жылға арналған Егіндікөл ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы
