requisite: Решение Егиндыкольского районного маслихата Акмолинской области от 24 декабря 2019 года № 6С42-4. Зарегистрировано Департаментом юстиции Акмолинской области 8 января 2020 года № 7612. Утратило силу решением Егиндыкольского районного маслихата Акмолинской области от 30 ноября 2020 года № 6С53-4 (вводится в действие со дня официального опубликования)
title:
