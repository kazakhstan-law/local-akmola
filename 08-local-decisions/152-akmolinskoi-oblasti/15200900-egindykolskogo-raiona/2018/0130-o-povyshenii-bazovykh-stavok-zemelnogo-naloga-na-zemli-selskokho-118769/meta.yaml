requisite: Решение Егиндыкольского районного маслихата Акмолинской области от 30 января 2018 года № 6С20-3. Зарегистрировано Департаментом юстиции Акмолинской области 12 февраля 2018 года № 6394. Утратило силу решением Егиндыкольского районного маслихата Акмолинской области от 9 февраля 2022 года № 7С15-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
