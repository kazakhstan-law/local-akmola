  title:
    rus: О внесении изменения в решение Егиндыкольского районного маслихата от 24 декабря 2018 года № 6С30-4 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2019 год»
    kaz: Егіндікөл аудандық мәслихаттың 2018 жылғы 24 желтоқсандағы № 6С30-4 «2019 жылға арналған ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтiк қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
