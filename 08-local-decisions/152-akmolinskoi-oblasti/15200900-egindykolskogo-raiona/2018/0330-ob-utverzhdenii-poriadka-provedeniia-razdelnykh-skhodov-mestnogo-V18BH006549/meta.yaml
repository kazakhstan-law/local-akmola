  title:
    rus: О признании утратившим силу решения Егиндыкольского районного маслихата от 30 марта 2018 года № 6С23-4 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Егиндыкольского района»
    kaz: Егіндікөл аудандық мәслихатының 2018 жылғы 30 наурыздағы № 6С23-4 «Егіндікөл ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешімінің күші жойылды деп тану туралы
