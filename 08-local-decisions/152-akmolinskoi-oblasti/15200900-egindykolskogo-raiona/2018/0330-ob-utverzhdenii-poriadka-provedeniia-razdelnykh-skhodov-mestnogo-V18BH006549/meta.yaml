requisite: Решение Егиндыкольского районного маслихата Акмолинской области от 30 марта 2018 года № 6С23-4. Зарегистрировано Департаментом юстиции Акмолинской области 16 апреля 2018 года № 6549. Утратило силу решением Егиндыкольского районного маслихата Акмолинской области от 27 апреля 2021 года № 7С4-5 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Егиндыкольского района
  kaz: Егіндікөл ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
