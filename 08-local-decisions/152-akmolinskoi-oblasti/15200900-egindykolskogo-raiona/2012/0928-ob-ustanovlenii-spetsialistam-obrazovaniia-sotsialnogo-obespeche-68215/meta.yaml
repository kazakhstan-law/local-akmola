requisite: Решение Егиндыкольского районного маслихата Акмолинской области от 28 сентября 2012 года № 5С9-2. Зарегистрировано Департаментом юстиции Акмолинской области 23 октября 2012 года № 3474. Утратило силу решением Егиндыкольского районного маслихата Акмолинской области от 30 июня 2014 года № 5С28-3
title:
  rus: Об установлении специалистам образования, социального обеспечения и культуры, работающих в сельских населенных пунктах Егиндыкольского района повышенные на двадцать пять процентов оклады и тарифные ставки
  kaz: Егіндікөл ауданының ауылдық елді мекендерінде жұмыс істейтін білім беру, әлеуметтік қамсыздандыру және мәдениет мамандарына жиырма бес пайыз жоғары  айлықақы мен тарифтік ставкалар белгілеу туралы
