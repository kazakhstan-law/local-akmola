act_code: '217328'
requisite: Решение Егиндыкольского районного маслихата Акмолинской области от 21 ноября 2025 года № 8С34-6. Зарегистрировано в Министерстве юстиции Республики Казахстан 25 ноября 2025 года № 37460
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Егиндыкольского района
  kaz: Егіндікөл ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидалар және мөлшерін бекіту туралы
