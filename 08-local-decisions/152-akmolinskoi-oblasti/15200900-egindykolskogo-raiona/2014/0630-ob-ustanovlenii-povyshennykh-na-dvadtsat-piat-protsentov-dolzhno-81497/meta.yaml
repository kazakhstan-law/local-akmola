requisite: Решение Егиндыкольского районного маслихата Акмолинской области от 30 июня 2014 года № 5С28-3. Зарегистрировано Департаментом юстиции Акмолинской области 21 июля 2014 года № 4286. Утратило силу решением Егиндыкольского районного маслихата Акмолинской области от 15 января 2016 года № 5С41-6
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерлерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және ветеринария саласының мамандарына жиырма бес пайызға жоғары лауазымдық жалақылар мен тарифтік ставкаларды белгілеу туралы
