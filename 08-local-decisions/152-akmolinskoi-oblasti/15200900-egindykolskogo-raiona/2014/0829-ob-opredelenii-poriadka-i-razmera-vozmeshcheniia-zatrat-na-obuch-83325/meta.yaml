    kaz: Егіндікөл аудандық мәслихатының «Мүгедектер қатарындағы мүмкіндігі шектеулі балаларды үйде оқытуға тәртібін және мөлшерін белгілеу туралы» 2014 жылғы 29 тамыздағы № 5С29-6 шешіміне өзгерістер енгізу туралы
