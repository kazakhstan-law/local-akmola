  title:
    rus: О внесении изменения в решение Егиндыкольского районного маслихата от 22 декабря 2023 года № 8С13-4 «О предоставлении специалистам в области здравоохранения, образования социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Егиндыкольского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2024 год»
    kaz: Егіндікөл аудандық мәслихатының 2023 жылғы 22 желтоқсандағы № 8С13-4 «2024 жылға арналған Егіндікөл ауданының ауылдық елді мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/200929/rus
