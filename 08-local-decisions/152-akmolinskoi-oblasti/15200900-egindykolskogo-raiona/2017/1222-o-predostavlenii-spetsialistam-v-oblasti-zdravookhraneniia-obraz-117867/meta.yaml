  title:
    rus: О внесении изменения в решение Егиндыкольского районного маслихата от 22 декабря 2017 года № 6С18-5 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2018 год»
