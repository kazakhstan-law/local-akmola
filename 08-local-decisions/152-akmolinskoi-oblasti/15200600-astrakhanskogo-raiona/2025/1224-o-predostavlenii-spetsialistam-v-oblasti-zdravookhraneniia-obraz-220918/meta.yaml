act_code: '220918'
requisite: Решение Астраханского районного маслихата Акмолинской области от 24 декабря 2025 года № 8С-46-14
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, села, прибывшим для работы и проживания в сельские населенные пункты Астраханского района подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2026 год
  kaz: 2026 жылға арналған Астрахан ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру,  мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық  округтер, ауыл әкімдері аппараттарының мемлекеттік қызметшілеріне, көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
