requisite: Решение Астраханского районного маслихата Акмолинской области от 19 декабря 2019 года № 6С-58-3. Зарегистрировано Департаментом юстиции Акмолинской области 23 декабря 2019 года № 7586. Утратило силу решением Астраханского районного маслихата Акмолинской области от 10 декабря 2020 года № 6С-77-3 (вводится в действие со дня официального опубликования)
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2020 год
  kaz: 2020 жылға арналған ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
