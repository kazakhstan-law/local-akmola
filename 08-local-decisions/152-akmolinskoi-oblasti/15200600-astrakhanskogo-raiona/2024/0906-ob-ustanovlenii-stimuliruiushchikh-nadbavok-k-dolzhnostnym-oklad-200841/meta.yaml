title:
  rus: Об установлении стимулирующих надбавок к должностным окладам специалистам КГУ «Молодежный ресурсный центр Астраханского района» при отделе внутренней политики Астраханского района, финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын ішкі саясат бөлімінің жанындағы «Астрахан ауданының Жастар ресурстық орталығы» КММ мамандарының лауазымдық айлықақыларына ынталандырушы үстемеақылар белгілеу туралы
