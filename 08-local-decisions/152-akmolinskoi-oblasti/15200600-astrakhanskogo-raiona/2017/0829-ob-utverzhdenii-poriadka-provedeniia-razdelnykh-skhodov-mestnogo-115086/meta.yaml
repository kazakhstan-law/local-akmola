requisite: Решение Астраханского районного маслихата Акмолинской области от 29 августа 2017 года № 6С-22-4. Зарегистрировано Департаментом юстиции Акмолинской области 6 октября 2017 года № 6103. Утратило силу решением Астраханского районного маслихата Акмолинской области от 9 апреля 2019 года № 6С-51-4 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Астраханского района
  kaz: Астрахан ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
