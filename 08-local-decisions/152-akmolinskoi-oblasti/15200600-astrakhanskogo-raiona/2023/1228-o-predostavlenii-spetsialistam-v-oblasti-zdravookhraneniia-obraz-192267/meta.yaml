  requisite: Решение Астраханского районного маслихата Акмолинской области от 1 ноября 2024 года № 8С-28-2
  title:
    rus: О внесении изменения в решение Астраханского районного маслихата от 28 декабря 2023 года № 8С-17-3 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов села, поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Астраханского района подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2024 год»
    kaz: Астрахан аудандық маслихатының 2023 жылғы 28 желтоқсандағы № 8С-17-3 «2024 жылға арналған Астрахан ауданының ауылдық елді мекендеріне жұмыс істеу үшін және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауыл, кент, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне, көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/202201/rus
