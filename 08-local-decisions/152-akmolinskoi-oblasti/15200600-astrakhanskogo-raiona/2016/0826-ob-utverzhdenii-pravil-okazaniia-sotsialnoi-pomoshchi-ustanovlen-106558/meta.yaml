  title:
    rus: О внесении изменений и дополнения в решение Астраханского районного маслихата от 26 августа 2016 года № 6С-8-7 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Астраханского района»
    kaz: Астрахан аудандық мәслихатының 2016 жылғы 26 тамыздағы № 6С-8-7 «Астрахан ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер және толықтыру енгізу туралы
