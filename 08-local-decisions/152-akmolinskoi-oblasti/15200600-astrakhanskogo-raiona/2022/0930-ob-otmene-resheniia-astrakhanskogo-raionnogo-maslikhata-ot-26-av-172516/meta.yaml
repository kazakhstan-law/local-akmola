act_code: '172516'
requisite: Решение Астраханского районного маслихата Акмолинской области от 30 сентября 2022 года № 7С-29-17
title:
  rus: Об отмене решения Астраханского районного маслихата от 26 августа 2022 года № 7С-27-4 «Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Астраханского района, Акмолинской области»
  kaz: «Ақмола облысы, Астрахан ауданының аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санының айқындау қағидаларын бекіту туралы» Астрахан аудандық мәслихаттың 2022 жылғы 26 тамыздағы № 7С-27-4 шешімінің күшін жою туралы
