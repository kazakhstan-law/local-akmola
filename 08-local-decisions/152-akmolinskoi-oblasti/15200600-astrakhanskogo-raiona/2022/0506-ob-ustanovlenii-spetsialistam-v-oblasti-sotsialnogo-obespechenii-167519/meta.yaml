act_code: '167519'
requisite: Решение Астраханского районного маслихата Акмолинской области от 6 мая 2022 года № 7С-22-3. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 мая 2022 года № 27978
title:
  rus: Об установлении специалистам в области социального обеспечения, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности, повышенных на двадцать пять процентов должностных окладов и тарифных ставок по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандарға қызметтің осы түрлерімен қалалық жағдайда айналысатын азаматтық қызметшілердің айлықақыларымен және мөлшерлемелерімен салыстырғанда жиырма бес пайызға жоғарылатылған лауазымдық айлықақылары мен тарифтік мөлшерлемелерін белгілеу туралы
