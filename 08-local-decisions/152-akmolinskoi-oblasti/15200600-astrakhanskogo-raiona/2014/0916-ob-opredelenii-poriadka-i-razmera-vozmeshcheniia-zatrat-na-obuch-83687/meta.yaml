  title:
    rus: О внесении изменений и дополнения в решение Астраханского районного маслихата от 16 сентября 2014 года № 5С-35-2 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану»
    kaz: Астрахан аудандық мәслихатының 2014 жылғы 16 қыркүйектегі № 5С-35-2 «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
