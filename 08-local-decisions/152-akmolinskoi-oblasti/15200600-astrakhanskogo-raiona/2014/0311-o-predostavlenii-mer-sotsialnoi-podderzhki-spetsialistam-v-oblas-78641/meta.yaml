title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Астраханского района на 2014 год
  kaz: 2014 жылға арналған Астрахан ауданының ауылдық елді мекендерге жұмыс  істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешені мамандарына әлеуметтік қолдау шараларын ұсыну туралы
