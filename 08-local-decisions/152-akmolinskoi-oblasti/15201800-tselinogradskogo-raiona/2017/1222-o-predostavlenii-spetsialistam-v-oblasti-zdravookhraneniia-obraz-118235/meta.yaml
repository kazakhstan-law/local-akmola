  title:
    rus: О внесении изменения в решение Целиноградского районного маслихата от 22 декабря 2017 года № 167/22-6 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Целиноградского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2018 год»
    kaz: Целиноград аудандық мәслихатының 2017 жылғы 22 желтоқсандағы № 167/22-6 «2018 жылға арналған Целиноград ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
