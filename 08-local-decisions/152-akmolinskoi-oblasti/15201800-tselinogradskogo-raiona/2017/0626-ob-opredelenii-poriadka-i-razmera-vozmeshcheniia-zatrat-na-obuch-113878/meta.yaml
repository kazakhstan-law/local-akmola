  title:
    rus: О внесении изменений и дополнения в решение Целиноградского районного маслихата от 26 июня 2017 года № 129/16-6 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Целиноградском районе»
    kaz: Целиноград аудандық мәслихатының 2017 жылғы 26 маусымдағы № 129/16-6 «Целиноград ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
