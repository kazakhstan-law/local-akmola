  title:
    rus: О внесении изменений и дополнений в решение Целиноградского районного маслихата от 23 октября 2017 года № 146/20-6 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Целиноградском районе»
    kaz: Целиноград аудандық мәслихатының 2017 жылғы 23 қазандағы № 146/20-6 «Целиноград ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
