requisite: Решение акима Целиноградского района Акмолинской области от 30 ноября 2011 года № 13. Зарегистрировано Управлением юстиции Целиноградского района Акмолинской области 28 декабря 2011 года № 1-17-157
title:
  rus: Об организации и обеспечении в январе-марте 2012 года приписки граждан мужского пола 1995 года рождения, которым в год приписки исполняется семнадцать лет к призывному участку государственного учреждения "Отдел по делам обороны Целиноградского района Акмолинской области"
  kaz: 2012 жылдың қаңтар-наурызында 1995 жылы туған тіркелетін жылы он жеті жасқа толатын еркек жынысты азаматтарды "Ақмола облысы Целиноград ауданының қорғаныс істер жөніндегі бөлімі" мемлекеттік мекемесінің шақыру учаскесіне тіркеуді ұйымдастыру және қамтамасыз ету туралы
