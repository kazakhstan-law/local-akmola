requisite: Решение Целиноградского районного маслихата Акмолинской области от 13 февраля 2014 года № 185/26-5. Зарегистрировано Департаментом юстиции Акмолинской области 17 марта 2014 года № 4036. Утратило силу решением Целиноградского районного маслихата Акмолинской области от 25 июля 2022 года № 161/29-7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки в селе Акмол и сельских населенных пунктах Целиноградского района
  kaz: Целиноград ауданының Ақмол ауылы мен ауылдық елді мекендеріндегі бағалау аймақтарының шекаралары және жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы
