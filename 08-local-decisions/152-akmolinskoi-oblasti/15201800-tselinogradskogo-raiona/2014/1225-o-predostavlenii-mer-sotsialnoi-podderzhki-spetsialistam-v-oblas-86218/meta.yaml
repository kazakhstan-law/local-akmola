requisite: Решение Целиноградского районного маслихата Акмолинской области от 25 декабря 2014 года № 265/39-5. Зарегистрировано Департаментом юстиции Акмолинской области 22 января 2015 года № 4606. Утратило силу решением Целиноградского районного маслихата Акмолинской области от 18 сентября 2015 года № 326/46-5
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Целиноградского района, на 2015 год
  kaz: 2015 жылға арналған Целиноград ауданының ауылдық елді мекендерге жұмыс істеу жәнетұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына әлеуметтік қолдау шараларын ұсыну туралы
