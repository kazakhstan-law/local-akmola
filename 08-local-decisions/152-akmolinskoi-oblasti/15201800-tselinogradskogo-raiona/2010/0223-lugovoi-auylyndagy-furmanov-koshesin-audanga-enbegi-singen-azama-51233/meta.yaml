act_code: '51233'
requisite: Жамбыл облысы Т. Рысқұлов ауданы әкімдігі Луговой ауыл аймағы әкімінің 2010 жылғы 23 ақпандағы № 19 шешімі. Жамбыл облысы Т. Рысқұлов ауданының Әділет басқармасында 2010 жылғы 12 наурызда 6-8-96 нөмірімен тіркелді
