  title:
    rus: О внесении изменения в решение Целиноградского районного маслихата от 24 декабря 2018 года № 263/38-6 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Целиноградского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2019 год»
    kaz: Целиноград аудандық мәслихатының 2018 жылғы 24 желтоқсандағы № 263/38-6 «2019 жылға арналған Целиноград ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
