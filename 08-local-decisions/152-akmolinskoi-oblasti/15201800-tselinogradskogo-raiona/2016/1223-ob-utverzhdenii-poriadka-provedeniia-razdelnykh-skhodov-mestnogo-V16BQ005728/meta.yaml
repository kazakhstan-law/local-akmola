requisite: Решение Целиноградского районного маслихата Акмолинской области от 23 декабря 2016 года № 87/10-6. Зарегистрировано Департаментом юстиции Акмолинской области 24 января 2017 года № 5728. Утратило силу решением Целиноградского районного маслихата Акмолинской области от 5 сентября 2022 года № 169/31-7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества в Целиноградском районе и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества
  kaz: Целиноград ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
