  title:
    rus: О признании утратившим силу решения Целиноградского районного маслихата от 23 декабря 2016 года № 87/10-6 «Об утверждении порядка проведения раздельных сходов местного сообщества в Целиноградском районе и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества»
    kaz: «Целиноград ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау туралы» Целиноград аудандық мәслихатының 2016 жылғы 23 желтоқсандағы № 87/10-6 шешімінің күші жойылды деп тану туралы
