act_code: '108993'
requisite: Решение Целиноградского районного маслихата Акмолинской области от 23 декабря 2016 года № 85/10-6. Зарегистрировано Департаментом юстиции Акмолинской области 9 января 2017 года № 5678
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Целиноградского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2017 год
  kaz: 2017 жылға арналған Целиноград ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау,білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй алу немесе салу үшін көтерме жәрдемақы және әлеуметтік қолдау көрсету туралы
