  title:
    rus: О внесении изменений и дополнения в решение Целиноградского районного маслихата от 30 мая 2023 года № 43/5-8 «Об утверждении Плана по управлению пастбищами и их использованию Нуресильского сельского округа, сельского округа Кабанбай батыра, Караоткельского сельского округа, села Коянды, Жарлыкольского сельского округа, сельского округа Тасты, Арайлынского сельского округа, Жанаесильского сельского округа, сельского округа Родина, Приреченского сельского округа, сельского округа Рахымжана Кошкарбаева, Софиевского сельского округа, Талапкерского сельского округа, Шалкарского сельского округа, села Маншук Целиноградского района на 2023-2024 годы»
    kaz: «Целиноград ауданы Нұресіл ауылдық округі, Қабанбай батыр ауылдық округі, Қараөткел ауылдық округі, Қоянды ауылы, Жарлыкөл ауылдық округі, Тасты ауылдық округі, Арайлы ауылдық округі, Жаңаесіл ауылдық округі, Родина ауылдық округі, Приречный ауылдық округі, Рахымжан Қошқарбаев ауылдық округі, Софиевка ауылдық округі, Талапкер ауылдық округі, Шалқар ауылдық округі, Мәншүк ауылы бойынша 2023-2024 жылдарға арналған жайылымдарды басқару және оларды пайдалану Жоспарын бекіту туралы» Целиноград аудандық мәслихатының 2023 жылғы 30 мамырдағы № 43/5-8 шешіміне өзгерістер мен толықтыру енгізу туралы
