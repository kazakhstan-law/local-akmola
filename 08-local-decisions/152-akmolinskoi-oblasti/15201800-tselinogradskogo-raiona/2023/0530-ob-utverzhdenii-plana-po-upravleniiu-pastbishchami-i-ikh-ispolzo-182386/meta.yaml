title:
  rus: Об утверждении Плана по управлению пастбищами и их использованию Нуресильского сельского округа, сельского округа Кабанбай батыра, Караоткельского сельского округа, села Коянды, Жарлыкольского сельского округа, сельского округа Тасты, Арайлынского сельского округа, Жанаесильского сельского округа, сельского округа Родина, сельского округа Ақжар, сельского округа Рахымжана Кошкарбаева, Софиевского сельского округа, Талапкерского сельского округа, Шалкарского сельского округа, села Мәншүк Мәметова, Оразакского сельского округа Целиноградского района на 2023-2024 годы
  kaz: Целиноград ауданы Нұресіл ауылдық округі, Қабанбай батыр ауылдық округі, Қараөткел ауылдық округі, Қоянды ауылы, Жарлыкөл ауылдық округі, Тасты ауылдық округі, Арайлы ауылдық округі, Жаңаесіл ауылдық округі, Родина ауылдық округі, Ақжар ауылдық округі, Рахымжан Қошқарбаев ауылдық округі, Софиевка ауылдық округі, Талапкер ауылдық округі, Шалқар ауылдық округі, Мәншүк Мәметова ауылы, Оразак ауылдық округі бойынша 2023-2024 жылдарға арналған жайылымдарды басқару және оларды пайдалану Жоспарын бекіту туралы
