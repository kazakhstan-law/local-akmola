  requisite: Решение Целиноградского районного маслихата Акмолинской области от 18 октября 2024 года № 235/31-8
  title:
    rus: О внесении изменения в решение Целиноградского районного маслихата от 25 декабря 2023 года №106/15-8 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Целиноградского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2024 год»
    kaz: Целиноград аудандық мәслихатының 2023 жылғы 25 желтоқсандағы № 106/15-8 «2024 жылға арналған Целиноград ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201850/rus
