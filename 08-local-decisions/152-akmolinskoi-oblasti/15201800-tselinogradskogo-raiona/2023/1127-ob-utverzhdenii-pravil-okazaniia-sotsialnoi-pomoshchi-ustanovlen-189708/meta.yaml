  title:
    rus: О внесении изменений в решение Целиноградского районного маслихата от 27 ноября 2023 года № 80/12-8 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Целиноградского района»
    kaz: Целиноград аудандық мәслихатының 2023 жылғы 27 қарашадағы № 80/12-8 «Целиноград ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
