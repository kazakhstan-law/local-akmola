  title:
    rus: О внесении изменения в решение Целиноградского районного маслихата от 27 ноября 2023 года № 80/12-8 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Целиноградского района»
