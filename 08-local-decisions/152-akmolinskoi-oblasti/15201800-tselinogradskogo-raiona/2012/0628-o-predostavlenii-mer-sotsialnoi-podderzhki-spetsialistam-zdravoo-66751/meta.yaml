act_code: '66751'
requisite: Решение Целиноградского районного маслихата Акмолинской области от 28 июня 2012 года № 46/6-5. Зарегистрировано Управлением юстиции Целиноградского района Акмолинской области 20 июля 2012 года № 1-17-178. Утратило силу - решением Целиноградского районного маслихата Акмолинской области от 14 декабря 2012 года № 80/11-5
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Целиноградского района
  kaz: Целиноград ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау шараларын ұсыну туралы
