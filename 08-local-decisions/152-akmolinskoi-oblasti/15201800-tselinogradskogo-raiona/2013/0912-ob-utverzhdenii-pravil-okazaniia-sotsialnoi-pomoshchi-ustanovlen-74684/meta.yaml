  title:
    rus: О внесении изменения и дополнения в решение Целиноградского районного маслихата от 12 сентября 2013 года № 142/20-5 «Об утверждении правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Целиноградском районе»
    kaz: Целиноград аудандық мәслихатының 2013 жылғы 12 қыркүйектегі № 142/20-5 «Целиноград ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс пен толықтыру енгізу туралы
