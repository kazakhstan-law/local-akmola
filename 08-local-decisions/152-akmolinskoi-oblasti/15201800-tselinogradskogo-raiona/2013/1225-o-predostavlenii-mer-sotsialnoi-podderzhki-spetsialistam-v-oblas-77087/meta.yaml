    kaz: Целиноград аудандық мәслихатының 2013 жылғы 25 желтоқсандағы № 173/24-5 "2014 жылға арналған Целиноград ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы" шешіміне өзгерістер енгізу туралы
