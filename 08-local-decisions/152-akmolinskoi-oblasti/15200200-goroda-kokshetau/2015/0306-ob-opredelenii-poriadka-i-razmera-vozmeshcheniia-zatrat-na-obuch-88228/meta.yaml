act_code: '88228'
requisite: Решение Кокшетауского городского маслихата Акмолинской области от 6 марта 2015 года № С-35/4. Зарегистрировано Департаментом юстиции Акмолинской области 3 апреля 2015 года № 4729
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в городе Кокшетау
  kaz: Көкшетау қаласында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарды өндіріп алу тәртібін және мөлшерін айқындау туралы
