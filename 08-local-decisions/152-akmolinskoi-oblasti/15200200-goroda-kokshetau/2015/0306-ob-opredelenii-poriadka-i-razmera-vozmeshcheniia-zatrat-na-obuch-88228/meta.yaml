  title:
    rus: О внесении изменений и дополнения в решение Кокшетауского городского маслихата от 6 марта 2015 года № С-35/4 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов»
    kaz: Көкшетау қалалық мәслихатының 2015 жылғы 6 наурыздағы № С-35/4 «Мүгедектер қатарындағы кемтар балаларды үйде оқытуға жұмсаған шығындарды өтеу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
