act_code: '206568'
requisite: Решение Кокшетауского городского маслихата Акмолинской области от 30 декабря 2024 года № С-19/3
title:
  rus: О предоставлении в 2025 году специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, ветеринарным специалистам ветеринарных пунктов, осуществляющих деятельность в области ветеринарии, государственным служащим аппарата акима Красноярского сельского округа, прибывшим для работы и проживания в сельские населенные пункты, подъемного пособия и социальной поддержки для приобретения или строительства жилья
  kaz: 2025 жылға арналған ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ветеринария саласындағы қызметті жүзеге асыратын ветеринариялық пункттердің ветеринариялық мамандарына, Красный яр ауылдық округі әкімі аппаратының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
