act_code: '217909'
requisite: Решение Кокшетауского городского маслихата Акмолинской области от 28 ноября 2025 года № С-26/8
title:
  rus: О предоставлении в 2026 году специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, ветеринарным специалистам ветеринарных пунктов, осуществляющих деятельность в области ветеринарии, государственным служащим аппарата акима Красноярского сельского округа, прибывшим для работы и проживания в сельские населенные пункты, мер социальной поддержки в виде подъемного пособия и бюджетного кредита на приобретение или строительства жилья
  kaz: 2026 жылға арналған ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ветеринария саласындағы қызметті жүзеге асыратын ветеринариялық пункттердің ветеринариялық мамандарына, Красный Яр ауылдық округі әкімі аппаратының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй алу немесе салу үшін бюджеттік кредит түріндегі әлеуметтік қолдау көрсету туралы
