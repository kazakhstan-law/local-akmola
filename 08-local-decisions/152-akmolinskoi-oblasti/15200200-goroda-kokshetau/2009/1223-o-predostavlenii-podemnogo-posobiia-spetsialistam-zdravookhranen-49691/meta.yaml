requisite: Решение Кокшетауского городского маслихата Акмолинской области от 23 декабря 2009 года № С-31/7. Зарегистрировано Управлением юстиции города Кокшетау Акмолинской области 30 декабря 2009 года № 1-1-114. Утратило силу - Решением акима города Кокшетау Акмолинской области от 5 ноября 2010 года № С-40/7
title:
  rus: О предоставлении подъемного пособия специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в Красноярский сельский округ
