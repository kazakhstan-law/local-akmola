act_code: '168091'
requisite: Решение Кокшетауского городского маслихата Акмолинской области от 24 мая 2022 года № С-18/2
title:
  rus: О предоставлении в 2022 году специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппарата акима Красноярского сельского округа, прибывшим для работы и проживания в сельские населенные пункты, подъемного пособия и социальной поддержки для приобретения или строительства жилья
  kaz: 2022 жылға арналған ауылдық елді мекендерге жұмыс істеу және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, Краснояр ауылдық округі әкімі аппаратының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
