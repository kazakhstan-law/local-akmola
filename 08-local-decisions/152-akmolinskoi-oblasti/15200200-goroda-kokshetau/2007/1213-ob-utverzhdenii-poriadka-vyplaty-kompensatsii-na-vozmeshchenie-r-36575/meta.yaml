act_code: '36575'
requisite: Решение Кокшетауского городского маслихата Акмолинской области от 13 декабря 2007 года № С-6/14. Зарегистрировано Управлением юстиции города Кокшетау 29 декабря 2007 года № 1-1-72. Утратило силу - решением Кокшетауского городского маслихата Акмолинской области от 20 марта 2008 года № C-6/13
title:
  rus: Об утверждении «Порядка выплаты компенсации на возмещение расходов на приобретение топлива специалистам здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельских населенных пунктах»
  kaz: «Ауылдық елді мекендерде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандарына отын сатып алуға жұмсалатын шығынды өтеу үшін өтемақы төлеу тәртібін» бекіту туралы
