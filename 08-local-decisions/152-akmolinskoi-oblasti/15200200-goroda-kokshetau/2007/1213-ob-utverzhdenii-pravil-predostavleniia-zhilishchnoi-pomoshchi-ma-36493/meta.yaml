  title:
    rus: О внесении изменений и дополнений в решение Кокшетауского городского маслихата от 13 декабря 2007 года № C-6/13 "Об утверждении Правил предоставления жилищной помощи малообеспеченным семьям (гражданам) на оплату содержания жилища (кроме содержания индивидуального жилого дома) и потребления коммунальных услуг и услуг связи в городе Кокшетау"
    kaz: Көкшетау қалалық мәслихатының 2007 жылғы 13 желтоқсандағы № C-6/13 "Көкшетау қаласындағы аз қамсыздандырылған отбасыларға (азаматтарға) тұрғын үйді ұстауға (жекеменшік тұрғын үйді ұстаудан басқасы) және коммуналдық қызметтерді және байланыс қызметін пайдалануға төлем төлеуге тұрғын үй көмегін ұсыну Ережесін бекіту туралы" шешіміне өзгерістер мен толықтырулар енгізу туралы"
