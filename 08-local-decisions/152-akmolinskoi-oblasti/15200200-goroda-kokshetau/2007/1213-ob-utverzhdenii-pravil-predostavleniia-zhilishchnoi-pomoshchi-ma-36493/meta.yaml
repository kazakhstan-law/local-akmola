act_code: '36493'
requisite: Решение Кокшетауского городского маслихата Акмолинской области от 13 декабря 2007 года № С-6/13. Зарегистрировано управлением юстиции города Кокшетау Акмолинской области 29 декабря 2007 года № 1-1-70. Утратило силу - решением Кокшетауского городского маслихата Акмолинской области от 7 апреля 2011 года № С-45/6
title:
  rus: Об утверждении "Правил предоставления жилищной помощи малообеспеченным семьям (гражданом) на оплату содержания жилища (кроме содержания индивидуального жилого дома) и потребления коммунальных услуг и услуг связи в городе Кокшетау"
  kaz: Көкшетау қаласындағы аз қамсыздандырылған отбасыларға (азаматтарға) тұрғын үйді ұстауға (жекеменшік тұрғын үйді ұстаудан басқасы) және коммуналдық қызметтерді және байланыс қызметін пайдалануға төлем төлеуге тұрғын үй көмегін ұсыну Ережесін" бекіту туралы
