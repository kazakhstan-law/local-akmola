requisite: Решение акима города Кокшетау Акмолинской области от 12 декабря 2008 года № 27. Зарегистрировано управлением юстиции города Кокшетау 29 декабря 2008 года № 1-1-93. Утратило силу - Решением акима города Кокшетау Акмолинской области от 24 декабря 2009 года № 44
title:
