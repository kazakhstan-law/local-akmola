requisite: Решение акима города Кокшетау Акмолинской области от 6 ноября 2008 года № 21. Зарегистрировано управлением юстиции города Кокшетау 1 декабря 2008 года № 1-1-92. Утратило силу решением акима города Кокшетау от 12 декабря 2008 года № 27
title:
  rus: О проведении приписки к призывному участку государственного учреждения "Управление по делам обороны города Кокшетау" граждан мужского пола, которым в год приписки исполняется семнадцать лет
  kaz: '"Көкшетау қаласының қорғаныс істері жөніндегі басқармасы" мемлекеттік  мекемесінің шақыру учаскесінде осы жылы он жеті жасқа толған ер азаматтарды тіркеу туралы'
