act_code: '189364'
requisite: Решение Кокшетауского городского маслихата Акмолинской области от 24 ноября 2023 года № С-8/6
title:
  rus: О предоставлении в 2024 году специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, ветеринарным специалистам ветеринарных пунктов, осуществляющих деятельность в области ветеринарии, государственным служащим аппарата акима Красноярского сельского округа, прибывшим для работы и проживания в сельские населенные пункты, подъемного пособия и социальной поддержки для приобретения или строительства жилья
  kaz: 2024 жылға арналған ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ветеринария саласындағы қызметті жүзеге асыратын ветеринариялық пункттердің ветеринариялық мамандарына, Краснояр ауылдық округі әкімі аппаратының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
