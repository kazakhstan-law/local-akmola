  title:
    rus: О внесении изменений и дополнения в решение Кокшетауского городского маслихата от 24 ноября 2023 года № С-8/8 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Кокшетау»
    kaz: Көкшетау қалалық мәслихатының 2023 жылғы 24 қарашадағы № С-8/8 «Көкшетау қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер және толықтыру енгізу туралы
