  title:
    rus: О внесении изменения в решение Кокшетауского городского маслихата от 14 декабря 2017 года № С-17/3 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2018 год»
    kaz: Көкшетау қалалық мәслихатының 2017 жылғы 14 желтоқсандағы № С-17/3 «2018 жылға арналған ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау,білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
