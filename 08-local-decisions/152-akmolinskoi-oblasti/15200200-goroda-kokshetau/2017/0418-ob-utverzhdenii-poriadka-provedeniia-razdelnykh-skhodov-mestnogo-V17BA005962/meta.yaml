requisite: Решение Кокшетауского городского маслихата Акмолинской области от 18 апреля 2017 года № С-9/6. Зарегистрировано Департаментом юстиции Акмолинской области 24 мая 2017 года № 5962. Утратило силу решением Кокшетауского городского маслихата Акмолинской области от 6 мая 2021 года № С-6/11 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Красноярского сельского округа
  kaz: Краснояр селолық округінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
