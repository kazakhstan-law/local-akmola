requisite: Решение Кокшетауского городского маслихата Акмолинской области от 5 ноября 2010 года № С-40/7. Зарегистрировано Управлением юстиции города Кокшетау Акмолинской области 14 декабря 2010 года № 1-1-132. Утратило силу - решением Кокшетауского городского маслихата Акмолинской области от 8 ноября 2011 года № С-52/7
title:
  rus: О предоставлении в 2010 году подъемного пособия и бюджетного кредита для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в Красноярский сельский округ
  kaz: Краснояр селолық округіне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына тұрғын үй сатып алу үшін 2010 жылы бюджеттік кредит және көтерме жәрдемақы ұсыну туралы
