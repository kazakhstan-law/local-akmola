requisite: Решение Кокшетауского городского маслихата Акмолинской области от 25 ноября 2016 года № С-5/8. Зарегистрировано Департаментом юстиции Акмолинской области 14 декабря 2016 года № 5619. Утратило силу решением Кокшетауского городского маслихата Акмолинской области от 22 ноября 2018 года № С-24/6 (вводится в действие с 1 января 2019 года)
title:
  rus: О повышении (понижении) ставок земельного налога на земельные участки города Кокшетау, населенных пунктов в административных границах города Кокшетау и об утверждении схемы зонирования земель города Кокшетау, населенных пунктов в административных границах города Кокшетау
  kaz: Көкшетау қаласының әкімшілік шекараларындағы Көкшетау қаласы, елді мекендер жер учаскелеріне жер салығының мөлшерлемелерін арттыру (азайту) туралы және Көкшетау қаласының әкімшілік шекараларындағы елді мекендердің, Көкшетау қаласының жерлерін аймақтарға бөлу схемасын бекіту туралы
