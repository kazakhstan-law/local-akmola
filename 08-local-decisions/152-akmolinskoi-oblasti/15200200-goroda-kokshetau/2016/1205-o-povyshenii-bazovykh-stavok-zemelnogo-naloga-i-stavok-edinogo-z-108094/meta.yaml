requisite: Решение Кокшетауского городского маслихата Акмолинской области от 5 декабря 2016 года № С-6/3. Зарегистрировано Департаментом юстиции Акмолинской области 12 декабря 2016 года № 5615. Утратило силу решением Кокшетауского городского маслихата Акмолинской области от 20 марта 2018 года № С-19/5
title:
  rus: О повышении базовых ставок земельного налога и ставок единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения города Кокшетау
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Көкшетау қаласының пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы
