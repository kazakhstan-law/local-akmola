requisite: Решение Кокшетауского городского маслихата Акмолинской области от 26 апреля 2016 года № С-2/7. Зарегистрировано Департаментом юстиции Акмолинской области 20 мая 2016 года № 5372. Утратило силу решением Кокшетауского городского маслихата Акмолинской области от 6 апреля 2018 года № С-20/4
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Кокшетау
  kaz: Көкшетау қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың үлгілік қағидаларын бекіту туралы
