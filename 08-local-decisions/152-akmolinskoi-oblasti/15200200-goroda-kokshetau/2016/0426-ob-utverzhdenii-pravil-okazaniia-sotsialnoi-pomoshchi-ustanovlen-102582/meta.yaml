    rus: О внесении дополнения в решение Кокшетауского городского маслихата от 26 апреля 2016 года № С-2/7 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Кокшетау»
    kaz: Көкшетау қалалық мәслихатының 2016 жылғы 26 сәуірдегі № С-2/7 «Көкшетау қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың үлгілік қағидаларын бекіту туралы» шешіміне толықтыру енгізу туралы
