  title:
    rus: О внесении изменения в решение Кокшетауского городского маслихата от 27 августа 2013 года № С-19/4 "Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Кокшетау"
    kaz: Көкшетау қалалық мәслихатының 2013 жылғы 27 тамыздағы № С-19/4 "Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Көкшетау қаласы мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы" шешіміне өзгеріс енгізу туралы
