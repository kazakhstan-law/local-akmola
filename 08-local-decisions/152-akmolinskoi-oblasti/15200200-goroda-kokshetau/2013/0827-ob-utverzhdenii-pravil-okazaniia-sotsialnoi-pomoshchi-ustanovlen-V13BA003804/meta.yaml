  title:
    rus: О внесении изменения и дополнения в решение Кокшетауского городского маслихата от 27 августа 2013 года № С-19/4 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Кокшетау»
    kaz: Көкшетау қалалық мәслихатының 2013 жылғы 27 тамыздағы № С-19/4 «Әлеуметтiк көмек көрсетудiң, оның мөлшерлерiн белгiлеудiң және Көкшетау қаласы мұқтаж азаматтарының жекелеген санаттарының тiзбесiн айқындаудың қағидаларын бекiту туралы» шешіміне өзгеріс пен толықтыру енгізу туралы
