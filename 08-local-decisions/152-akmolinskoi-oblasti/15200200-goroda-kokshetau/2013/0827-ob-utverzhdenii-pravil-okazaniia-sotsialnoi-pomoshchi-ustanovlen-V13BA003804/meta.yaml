  title:
    rus: О внесении изменений в решение Кокшетауского городского маслихата от 27 августа 2013 года №С-19/4 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Кокшетау»
    kaz: Көкшетау қалалық мәслихатының 2013 жылғы 27 тамыздағы № С-19/4 «Көкшетау қаласының жекелеген санаттарындағы мұқтаж азаматтарының тізбесін анықтау, мөлшерін белгілеу және әлеуметтік көмек көрсету Ережесін бекіту туралы» шешіміне өзгерістер енгізу туралы
