act_code: '151000'
requisite: Решение Кокшетауского городского маслихата Акмолинской области от 24 декабря 2020 года № С-49/5. Зарегистрировано Департаментом юстиции Акмолинской области 30 декабря 2020 года № 8283
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппарата акима Красноярского сельского округа, прибывшим для работы и проживания в сельские населенные пункты, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2021 год
  kaz: 2021 жылға арналған ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, Краснояр ауылдық округі әкімі аппаратының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
