  title:
    rus: О внесении изменения в решение Кокшетауского городского маслихата от 15 сентября 2020 года № С-46/8 «Об определении специализированных мест для организации и проведения мирных собраний, порядка использования специализированных мест для организации и проведения мирных собраний, нормы их предельной заполняемости, а также требования к материально-техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний и границ прилегающих территорий, в которых запрещено проведение пикетирования в городе Кокшетау»
    kaz: «Көкшетау қаласында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды және пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» Көкшетау қалалық мәслихатының 2020 жылғы 15 қыркүйектегі № С-46/8 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/171825/rus
