  title:
    rus: О внесении изменения в решение Кокшетауского городского маслихата от 24 декабря 2020 года № С-49/7 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Кокшетау»
    kaz: Көкшетау қалалық мәслихатының 2020 жылғы 24 желтоқсандағы № С-49/7 «Көкшетау қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
