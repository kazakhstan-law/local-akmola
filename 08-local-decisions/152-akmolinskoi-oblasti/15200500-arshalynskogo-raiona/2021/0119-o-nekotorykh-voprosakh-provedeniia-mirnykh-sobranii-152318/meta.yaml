  requisite: Решение Аршалынского районного маслихата Акмолинской области от 24 ноября 2021 года № 16/4. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 декабря 2021 года № 25505
  title:
    rus: О внесении изменений в решение Аршалынского районного маслихата от 19 января 2021 года № 2/2 «Об определении специализированных мест для организации и проведения мирных собраний, порядка использования специализированных мест для организации и проведения мирных собраний, нормы их предельной заполняемости, а также требования к материально-техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний и границ прилегающих территорий, в которых запрещено проведение пикетирования в Аршалынском районе»
    kaz: Аршалы аудандық мәслихатының 2021 жылғы 19 қаңтардағы № 2/2 «Аршалы ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды және пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/161033/rus
