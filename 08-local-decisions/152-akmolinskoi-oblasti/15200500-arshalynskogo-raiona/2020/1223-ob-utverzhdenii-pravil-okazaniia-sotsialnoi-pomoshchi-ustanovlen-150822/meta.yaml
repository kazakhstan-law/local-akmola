  title:
    rus: О внесении изменения в решение Аршалынского районного маслихата от 23 декабря 2020 года № 70/5 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Аршалынском районе»
    kaz: Аршалы аудандық мәслихатының 2020 жылғы 23 желтоқсандағы № 70/5 «Аршалы ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
