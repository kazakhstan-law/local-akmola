requisite: Решение Аршалынского районного маслихата Акмолинской области от 19 февраля 2020 года № 50/2. Зарегистрировано Департаментом юстиции Акмолинской области 26 февраля 2020 года № 7689. Утратило силу решением Аршалынского районного маслихата Акмолинской области от 21 октября 2020 года № 65/2 (вводится в действие со дня официального опубликования)
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Аршалынского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2020 год
  kaz: 2020 жылға арналған Аршалы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
