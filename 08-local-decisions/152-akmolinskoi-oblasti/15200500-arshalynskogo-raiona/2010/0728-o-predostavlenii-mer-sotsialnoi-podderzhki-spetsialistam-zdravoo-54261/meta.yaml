act_code: '54261'
requisite: Решение Аршалынского районного маслихата Акмолинской области от 28 июля 2010 года № 29/6. Зарегистрировано Управлением юстиции Аршалынского района Акмолинской области 31 августа 2010 года № 1-4-174. Утратило силу - решением Аршалынского районного маслихата Акмолинской области от 9 февраля 2011 года № 35/8
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Аршалынского района на 2010 год
  kaz: 2010 жылға арналған селолық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандарына әлеуметтік қолдау шараларын ұсыну туралы
