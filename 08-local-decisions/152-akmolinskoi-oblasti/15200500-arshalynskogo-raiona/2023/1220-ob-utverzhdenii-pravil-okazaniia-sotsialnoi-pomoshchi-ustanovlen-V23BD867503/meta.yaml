  title:
    rus: О внесении изменений и дополнений в решение Аршалынского районного маслихата от 20 декабря 2023 года № 10/3 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Аршалынском районе»
    kaz: Аршалы аудандық мәслихатының 2023 жылғы 20 желтоқсандағы № 10/3 «Аршалы ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер және толықтырулар енгізу туралы
