  title:
    rus: О внесении изменений и дополнения в решение Аршалынского районного маслихата от 10 февраля 2017 года № 12/5 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Аршалынском районе»
    kaz: Аршалы аудандық мәслихатының 2017 жылғы 10 ақпандағы № 12/5 «Аршалы ауданында мүгедектер қатарындағы кемтар балаларды жеке оқу жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
