act_code: '111723'
requisite: Решение Аршалынского районного маслихата Акмолинской области от 14 марта 2017 года № 13/7. Зарегистрировано Департаментом юстиции Акмолинской области 14 апреля 2017 года № 5885. Утратило силу решением Аршалынского районного маслихата Акмолинской области от 10 июня 2022 года № 26/3 (вводится в действие по истечении десяти календарных дней после его первого официального публикования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Аршалынского района
  kaz: Аршалы ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
