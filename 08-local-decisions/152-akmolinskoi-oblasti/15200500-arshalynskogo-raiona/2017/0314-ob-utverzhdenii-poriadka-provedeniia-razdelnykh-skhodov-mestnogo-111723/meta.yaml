  title:
    rus: О внесении изменений в решение Аршалынского районного маслихата от 14 марта 2017 года № 13/7 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Аршалынского района»
    kaz: Аршалы аудандық мәслихатының 2017 жылғы 14 наурыздағы № 13/7 «Аршалы ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгерістер енгізу туралы
