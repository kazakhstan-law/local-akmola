act_code: '77010'
requisite: Решение Аршалынского районного маслихата Акмолинской области от 25 декабря 2013 года № 23/2. Зарегистрировано Департаментом юстиции Акмолинской области 21 января 2014 года № 3972. Утратило силу решением Арщалынского районного маслиахата Акмолинской области от 27 августа 2014 года № 31/8
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Аршалынского района на 2014 год
  kaz: 2014 жылға арналған Аршалы ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы
