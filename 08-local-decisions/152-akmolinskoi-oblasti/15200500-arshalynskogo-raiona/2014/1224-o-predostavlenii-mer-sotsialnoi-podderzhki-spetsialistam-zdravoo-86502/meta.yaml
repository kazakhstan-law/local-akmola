act_code: '86502'
requisite: Решение Аршалынского районного маслихата Акмолинской области от 24 декабря 2014 года № 36/3. Зарегистрировано Департаментом юстиции Акмолинской области 15 января 2015 года № 4589. Утратило силу решением Аршалынского районного маслихата Акмолинской области от 27 марта 2015 года № 40/8
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населённые пункты Аршалынского района на 2015 год
  kaz: 2015 жылға арналған Аршалы ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына әлеуметтік қолдау шараларын ұсыну туралы
