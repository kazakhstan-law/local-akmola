act_code: '62751'
requisite: Решение Аршалынского районного маслихата Акмолинской области от 13 декабря 2011 года № 43/10. Зарегистрировано Управлением юстиции Аршалынского района Акмолинской области 11 января 2012 года № 1-4-199. Утратило силу - решением Аршалынского районного маслихата Акмолинской области от 3 августа 2012 года № 7/4
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Аршалынского района на 2012 год
  kaz: 2012 жылға арналған Аршалы ауданының селолық елді мекендерінде жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандарына әлеуметтік қолдау шараларын ұсыну туралы
