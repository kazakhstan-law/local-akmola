requisite: Решение Аршалынского районного маслихата Акмолинской области от 15 марта 2011 года № 36/2. Зарегистрировано Управлением юстиции Аршалынского района Акмолинской области 12 апреля 2011 года № 1-4-188. Утратило силу - решением Аршалынского районного маслихата Акмолинской области от 29 июня 2012 года № 6/4
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты  Аршалынского района на 2011 год
  kaz: 2011 жылға арналған Аршалы ауданының селолық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау шараларын ұсыну туралы
