requisite: Решение Жаксынского районного маслихата Акмолинской области от 19 февраля 2015 года № 5ВС-35-7. Зарегистрировано Департаментом юстиции Акмолинской области 18 марта 2015 года № 4692. Утратило силу решением Жаксынского районного маслихата Акмолинской области от 5 мая 2015 года № 5ВС-39-4
title:
