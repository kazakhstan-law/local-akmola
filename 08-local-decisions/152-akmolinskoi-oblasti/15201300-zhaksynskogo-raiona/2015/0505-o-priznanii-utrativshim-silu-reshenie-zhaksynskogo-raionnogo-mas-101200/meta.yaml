act_code: '101200'
requisite: Решение №5ВС-39-4 от 05.05.2015, Маслихат Жаксынского района
title:
  rus: О признании утратившим силу решение Жаксынского районного маслихата от 19 февраля 2015 года № 5ВС-35-7 «О предоставлении мер социальной поддержки в области здравоохранения, образования, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жаксынского района на 2015 год»
  kaz: Жақсы аудандық мәслихатының 2015 жылғы 19 ақпандағы № 5ВС-35-7 «2015 жылға арналған Жақсы ауданының ауылдық елді мекендеріне жұмыс істеу және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына әлеуметтік қолдау шараларын ұсыну  туралы»  шешімінің күшін жою туралы
