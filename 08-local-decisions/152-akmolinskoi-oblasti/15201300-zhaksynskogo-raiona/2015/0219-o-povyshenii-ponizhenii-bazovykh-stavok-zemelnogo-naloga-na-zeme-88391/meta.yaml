requisite: Решение №5ВС-35-5 от 19.02.2015, Маслихат Жаксынского района. Утратило силу решением Жаксынского районного маслихата Акмолинской области от 15 января 2016 года № 5ВС-46-5
title:
  rus: О повышении (понижении) базовых ставок земельного налога на земельные участки села Жаксы, сельских населенных пунктов и земли сельскохозяйственного назначения представленные физическим лицам для ведения личного домашнего (подсобного) хозяйства, на земли промышленности расположенные вне населенных пунктов Жаксынского района
  kaz: Жақсы ауданы Жақсы ауылының ауылдық елді мекендерінің жерлеріне және қосалқы үй шаруашылығын жүргізу үшін жеке тұлғаларға ұсынылған, ауыл шаруашылығы мақсатындағы жерлерге, елді мекендерден тыс орналасқан өнеркәсіп жерлеріне жер салығының базалық ставкаларын жоғарылату (төмендету) туралы
