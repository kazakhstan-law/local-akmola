requisite: Решение акимата Жаксынского района Акмолинской области от 1 декабря 2009 года № 10. Зарегистрировано Управлением юстиции Жаксынского района Акмолинской области 31 декабря 2009 года № 1-13-101. Утратило силу - решением акима Жаксынского района Акмолинской области от 12 июля 2010 года № 10
title:
