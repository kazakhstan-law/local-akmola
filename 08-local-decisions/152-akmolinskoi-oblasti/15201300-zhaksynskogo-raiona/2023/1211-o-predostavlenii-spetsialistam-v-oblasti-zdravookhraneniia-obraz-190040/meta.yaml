  requisite: Решение Жаксынского районного маслихата Акмолинской области от 4 октября 2024 года № 8С-33-2
  title:
    rus: О внесении изменения в решение Жаксынского районного маслихата от 11 декабря 2023 года № 8С-15-2 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жаксынского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2024 год»
    kaz: «Жақсы ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылға арналған тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы және әлеуметтік қолдау көрсету туралы» Жақсы аудандық мәслихатының 2023 жылғы 11 желтоқсандағы № 8С-15-2 шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201482/rus
