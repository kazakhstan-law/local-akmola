  title:
    rus: О внесении изменений в решение Жаксынского районного маслихата от 21 декабря 2023 года № 8С-17-5 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Жаксынском районе»
    kaz: «Жақсы ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Жақсы аудандық мәслихатының 2023 жылғы 21 желтоқсандағы № 8С-17-5 шешіміне өзгерістер енгізу туралы
