requisite: Решение Жаксынского районного маслихата Акмолинской области от 4 марта 2011 года № С-32-6. Зарегистрировано Управлением юстиции Жаксынского района Акмолинской области 28 марта 2011 года № 1-13-129. Утратило силу решением Жаксынского районного маслихата Акмолинской области от 27 марта 2012 года № 5С-2-5
title:
