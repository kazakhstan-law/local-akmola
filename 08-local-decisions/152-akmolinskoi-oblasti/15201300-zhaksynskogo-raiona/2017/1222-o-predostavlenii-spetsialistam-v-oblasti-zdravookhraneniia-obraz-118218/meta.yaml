  title:
    rus: О внесении изменения в решение Жаксынского районного маслихата от 22 декабря 2017 года № 6С-19-2 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жаксынского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2018 год»
    kaz: Жақсы аудандық мәслихатының 2017 жылғы 22 желтоқсандағы № 6С-19-2 «2018 жылға арналған Жақсы ауданының ауылдық елді мекендерінде жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
