act_code: '110252'
requisite: Решение Жаксынского районного маслихата Акмолинской области от 14 февраля 2017 года № 6ВС-10-4. Зарегистрировано Департаментом юстиции Акмолинской области 6 марта 2017 года № 5807
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жаксынского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2017 год
  kaz: Жақсы ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, 2017 жылға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
