requisite: Решение Жаксынского районного маслихата Акмолинской области от 25 декабря 2017 года № 6ВС-20-4. Зарегистрировано Департаментом юстиции Акмолинской области 17 января 2018 года № 6354. Утратило силу решением Жаксынского районного маслихата Акмолинской области от 5 мая 2022 года № 7ВС-27-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Жаксынского района
  kaz: Жақсы ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
