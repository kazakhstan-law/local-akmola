  title:
    rus: О внесении изменения в решение Жаксынского районного маслихата от 25 декабря 2017 года № 6ВС-20-4 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Жаксынского района»
    kaz: Жақсы аудандық мәслихатының 2017 жылғы 25 желтоқсандағы № 6ВС-20-4 «Жақсы ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгерістер енгізу туралы
