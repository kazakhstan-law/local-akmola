  title:
    rus: О внесении изменений в решение Жаксынского районного маслихата от 24 декабря 2013 года № 5С-24-3 "О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Жаксынского района на 2014 год"
    kaz: Жақсы аудандық мәслихатының 2013 жылғы 24 желтоқсандағы "2014 жылға арналған Жақсы ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы" № 5С-24-3 шешіміне өзгерістер енгізу туралы
