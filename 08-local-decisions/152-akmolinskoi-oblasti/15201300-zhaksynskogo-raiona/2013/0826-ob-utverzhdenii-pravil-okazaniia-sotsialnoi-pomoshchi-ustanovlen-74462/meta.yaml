    kaz: Жақсы аудандық мәслихатының 2013 жылғы 26 тамыздағы "Жақсы ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидасын бекіту туралы" № 5С-19-3 шешіміне өзгеріс енгізу туралы
