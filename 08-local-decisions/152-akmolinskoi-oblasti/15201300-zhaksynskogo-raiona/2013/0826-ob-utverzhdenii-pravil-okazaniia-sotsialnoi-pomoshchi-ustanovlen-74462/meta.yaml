  title:
    rus: О внесении изменений и дополнений в решение Жаксынского районного маслихата от 26 августа 2013 года № 5С-19-3 "Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Жаксынском районе
    kaz: Жақсы аудандық мәслихатының 2013 жылғы 26 тамыздағы "Жақсы ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы" № 5С-19-3 шешіміне өзгерістер және толықтырулар енгізу туралы
