  title:
    rus: О внесении изменений в решение Жаксынского районного маслихата от 22 октября 2014 года № 5ВС-31-1 «Об определении порядка и размера затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов в Жаксынском районе»
    kaz: Жақсы аудандық мәслихатының "Жақсы ауданында мүгедектер қатарындағы кемтар балаларды үйде оқытуға тәртібін және мөлшерлерін белгілеу туралы" 2014 жылғы 22 қазандағы № 5ВС-31-1 шешіміне өзгерістер енгізу туралы
