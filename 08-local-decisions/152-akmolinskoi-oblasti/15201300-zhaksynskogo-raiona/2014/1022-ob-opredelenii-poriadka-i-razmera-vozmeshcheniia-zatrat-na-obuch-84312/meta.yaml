requisite: Решение Жаксынского районного маслихата Акмолинской области от 22 октября 2014 года № 5ВС-31-1. Зарегистрировано Департаментом юстиции Акмолинской области 11 ноября 2014 года № 4446. Утратило силу решением Жаксынского районного маслихата Акмолинской области от 11 декабря 2023 года № 8С-15-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Жаксынском районе
  kaz: Жақсы ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
