  title:
    rus: О внесении изменений и дополнения в решение Жаксынского районного маслихата от 22 октября 2014 года № 5ВС-31-1 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Жаксынском районе»
    kaz: Жақсы аудандық мәслихатының 2014 жылғы 22 қазандағы № 5ВС-31-1 «Жақсы ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
