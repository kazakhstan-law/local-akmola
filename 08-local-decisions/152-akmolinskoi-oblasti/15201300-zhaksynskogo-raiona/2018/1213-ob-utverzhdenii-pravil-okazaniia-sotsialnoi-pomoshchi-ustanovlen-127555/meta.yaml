    kaz: «Жақсы ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Жақсы аудандық мәслихатының 2018 жылғы 13 желтоқсандағы № 6ВС-34-4 шешіміне өзгерістер енгізу туралы
