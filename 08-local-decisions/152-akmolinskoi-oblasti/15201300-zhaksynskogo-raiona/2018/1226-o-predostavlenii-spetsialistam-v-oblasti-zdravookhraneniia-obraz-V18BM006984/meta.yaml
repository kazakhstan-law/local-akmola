  title:
    rus: О внесении изменения в решение Жаксынского районного маслихата от 26 декабря 2018 года № 6ВС-36-3 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жаксынского района подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2019 год»
    kaz: Жақсы аудандық мәслихатының 2018 жылғы 26 желтоқсандағы № 6ВС-36-3 «2019 жылға арналған Жақсы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
