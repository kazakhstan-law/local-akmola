  title:
    rus: О внесении изменения в решение Жаксынского районного маслихата от 16 марта 2018 года № 6С-21-4 «Об утверждении границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки села Жаксы и сельских населенных пунктов Жаксынского района»
    kaz: Жақсы аудандық мәслихатының 2018 жылғы 16 наурыздағы № 6С-21-4 «Жақсы ауылы және Жақсы ауданының ауылдық елді мекендердегі бағалау аймақтарының шекаралары және жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы» шешіміне өзгерістер енгізу туралы»
