  title:
    rus: О внесении изменений в решение Жаксынского районного маслихата от 13 декабря 2018 года № 6ВС-34-4 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Жаксынском районе»
    kaz: Жақсы аудандық мәслихатының 2018 жылғы 13 желтоқсандағы № 6ВС-34-4 «Жақсы ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
