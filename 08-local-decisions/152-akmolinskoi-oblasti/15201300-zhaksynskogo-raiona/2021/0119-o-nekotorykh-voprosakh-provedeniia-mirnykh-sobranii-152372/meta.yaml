  requisite: Решение Жаксынского районного маслихата Акмолинской области от 29 октября 2021 года № 7ВС-13-1. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 ноября 2021 года № 25123
  title:
    rus: О внесении изменений в решение Жаксынского районного маслихата от 19 января 2021 года № 7ВС-2-1 «Об определении специализированных мест для организации и проведения мирных собраний, порядка использования специализированных мест для организации и проведения мирных собраний, нормы их предельной заполняемости, а также требования к материально-техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний и границ прилегающих территорий, в которых запрещено проведение пикетирования в Жаксынском районе»
    kaz: Жақсы аудандық мәслихатының 2021 жылғы 19 қаңтардағы № 7ВС-2-1 «Жақсы ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды және пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/160166/rus
