act_code: '217911'
requisite: Решение Жаксынского районного маслихата Акмолинской области от 1 декабря 2025 года № 8С-49-2. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 декабря 2025 года № 37514
title:
  rus: Об утверждении правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Жаксынского района
  kaz: Жақсы ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидалары мен мөлшерін бекіту туралы
