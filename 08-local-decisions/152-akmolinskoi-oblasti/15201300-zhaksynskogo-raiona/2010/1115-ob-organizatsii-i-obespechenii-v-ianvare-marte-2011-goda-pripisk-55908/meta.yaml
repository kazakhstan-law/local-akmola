requisite: Решение акима Жаксынского района Акмолинской области от 15 ноября 2010 года № 11. Зарегистрировано Управлением юстиции Жаксынского района Акмолинской области 9 декабря 2010 года № 1-13-122
title:
  rus: Об организации и обеспечении в январе-марте 2011 года приписки граждан мужского пола, которым в год приписки исполняется семнадцать лет к призывному участку государственного учреждения "Отдел по делам обороны Жаксынского района Акмолинской области"
  kaz: '"Ақмола облысы Жақсы ауданының қорғаныс істер жөніндегі бөлімі" мемлекеттік мекемесінің шақыру учаскесіне тіркеу өткізілетін жылы он жеті жасқа толатын еркек жынысты азаматтарды 2011 жылдың қаңтар-наурызында тіркеуді ұйымдастыру және қамтамасыз ету туралы'
