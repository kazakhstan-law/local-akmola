act_code: '204828'
requisite: Решение Степногорского городского маслихата Акмолинской области от 23 декабря 2024 года № 8С-18/3
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельского округа, прибывшим для работы и проживания в сельские населенные пункты города Степногорска на 2025 год
  kaz: 2025 жылға арналған Степногорск қаласы ауылдық елді мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округ әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
