  title:
    rus: О внесении изменения в решение Степногорского городского маслихата от 09 февраля 2024 года № 8С-10/2 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Степногорска»
    kaz: «Степногорск қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Степногорск қалалық мәслихатының 2024 жылғы 9 ақпандағы № 8С-10/2 шешіміне өзгеріс енгізу туралы
