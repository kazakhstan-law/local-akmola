act_code: '167757'
requisite: Решение Степногорского городского маслихата Акмолинской области от 13 мая 2022 года № 7С-14/4. Зарегистрировано в Министерстве юстиции Республики Казахстан 17 мая 2022 года № 28064
title:
  rus: Об установлении специалистам в области социального обеспечения, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности города Степногорска, повышенных на двадцать пять процентов должностных окладов и тарифных ставок по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметшілер болып табылатын және Степногорск қаласының ауылдық жерде жұмыс істейтін әлеуметтiк қамсыздандыру, мәдениет және спорт саласындағы мамандарға қызметтiң осы түрлерiмен қалалық жағдайда айналысатын азаматтық қызметшiлердiң айлықақыларымен және мөлшерлемелерімен салыстырғанда жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелерін белгiлеу туралы
