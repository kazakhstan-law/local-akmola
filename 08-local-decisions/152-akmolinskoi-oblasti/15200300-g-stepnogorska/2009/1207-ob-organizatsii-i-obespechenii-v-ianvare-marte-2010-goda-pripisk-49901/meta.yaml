requisite: Решение акима города Степногорска Акмолинской области от 7 декабря 2009 года № 27. Зарегистрировано Управлением юстиции города Степногорска Акмолинской области 6 января 2010 года № 1-2-124. Утратило силу - постановлением акимата города Степногорск Акмолинской области от 9 июля 2010 года № 10
title:
  rus: Об организации и обеспечении в январе-марте 2010 года приписки граждан мужского пола, которым в год приписки исполняется семнадцать лет, к призывному участку государственного учреждения "Отдел по делам обороны города Степногорск Акмолинской области"
