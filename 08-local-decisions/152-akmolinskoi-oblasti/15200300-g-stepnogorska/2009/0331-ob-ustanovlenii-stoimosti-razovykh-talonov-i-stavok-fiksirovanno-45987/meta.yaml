    kaz: Степногорск қалалық мәслихатының 2009 жылғы 31 наурыздағы № 4С-18/8 "Степногорск қаласы және кенттердегі бір жолғы талон мен белгіленген салық мөлшерлемесінің құн көлемін бекіту туралы" шешіміне өзгерістер енгізу туралы
