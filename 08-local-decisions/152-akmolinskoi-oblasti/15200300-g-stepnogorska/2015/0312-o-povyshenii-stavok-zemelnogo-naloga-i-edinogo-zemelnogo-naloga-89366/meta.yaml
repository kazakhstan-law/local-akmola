    kaz: Степногорск қалалық мәслихатының 2015 жылғы 12 наурыздағы № 5С-37/6 «Степногорск қаласының әкімшілік шекараларындағы пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы» шешіміне өзгерістер енгізу туралы
