requisite: Решение акима города Степногорска Акмолинской области от 11 декабря 2008 года № 24. Зарегистрировано Управлением юстиции города Степногорска Акмолинской области от 9 января 2009 года № 1-2-101. Утратило силу решением акима города Степногорска Акмолинской области от 7 декабря 2009 года № 27
title:
  rus: О проведении приписки граждан 1992 года рождения, проживающих в городе Степногорске, поселках Аксу, Бестобе, Заводской и Карабулакском сельском округе к призывному участку государственного учреждения "Отдел по делам обороны города Сепногорск"
  kaz: Степногорск қаласы, Ақсу, Бестөбе, Заводской кенттерінде және Қарабұлақ селолық округінде тұратын 1992 жылы туылған азаматтарды "Степногорск қаласының қорғаныс істері жөніндегі бөлімі" мемлекеттік мекемесінің шақыру учаскесіне тіркеу жүргізу туралы
