  title:
    rus: О внесении изменений в решение Степногорского городского маслихата от 23 декабря 2008 года № 4С-14/3 "Об утверждении Правил оказания помощи малообеспеченным семьям (гражданам) на оплату содержания жилища, оплату коммунальных услуг и услуг связи"
    kaz: Степногорск қалалық мәслихатының 2008 жылғы 23 желтоқсандағы № 4С-14/3 "Аз қамтылған отбасыларына (азаматтарға) тұрғын-жайды ұстауға, байланыс және тұрғын үй коммуналдық қызметін төлеуге тұрғын үй көмегін беру ережесін бекіту туралы" шешіміне өзгерістер енгізу туралы
