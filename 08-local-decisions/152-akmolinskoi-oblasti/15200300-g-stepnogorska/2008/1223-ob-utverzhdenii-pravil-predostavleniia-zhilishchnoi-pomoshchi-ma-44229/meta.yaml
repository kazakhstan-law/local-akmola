title:
  rus: Об утверждении Правил предоставления жилищной помощи малообеспеченным семьям (гражданам) по городу Степногорск
  kaz: Степногорск қаласы бойынша аз қамтылған отбасыларға (азаматтарға) тұрғын үй көмегін көрсету ережесін бекіту туралы
