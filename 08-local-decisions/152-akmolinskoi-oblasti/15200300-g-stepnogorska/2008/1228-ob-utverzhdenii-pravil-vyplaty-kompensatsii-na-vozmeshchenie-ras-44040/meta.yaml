requisite: Решение Степногорского городского маслихата Акмолинской области от 28 декабря 2008 года № 4С-14/4. Зарегистрировано Управлением юстициии города Степногорска Акмолинской области 3 февраля 2009 года № 1-2-103. Утратило силу - решением Степногорского городского маслихата Акмолинской области от 31 октября 2012 года № 5С-10/4
title:
  rus: Об утверждении Правил выплаты компенсации на возмещение расходов на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерге тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алуға жұмсалатын шығынды өтеу үшін өтемақы төлеу ережесін бекіту туралы
