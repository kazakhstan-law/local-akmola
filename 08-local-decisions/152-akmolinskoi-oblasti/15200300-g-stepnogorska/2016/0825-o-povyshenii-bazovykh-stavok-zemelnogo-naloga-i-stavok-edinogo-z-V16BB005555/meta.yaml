title:
  rus: О повышении базовых ставок земельного налога и ставок единого земельного налога на не используемые, в соответствии с земельным законодательством Республики Казахстан, земли сельскохозяйственного назначения города Степногорска
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Степногорск қаласының пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы
