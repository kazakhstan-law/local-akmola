  title:
    rus: О признании утратившим силу решения Степногорского городского маслихата от 25 августа 2016 года № 6С-8/5 «О повышении базовых ставок земельного налога и ставок единого земельного налога на не используемые, в соответствии с земельным законодательством Республики Казахстан, земли сельскохозяйственного назначения города Степногорска»
    kaz: Степногорск қалалық мәслихатының 2016 жылғы 25 тамыздағы № 6С-8/5 «Қазақстан Республикасының жер заңнамасына сәйкес Степногорск қаласының пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы» шешімінің күші жойылды деп тану туралы
