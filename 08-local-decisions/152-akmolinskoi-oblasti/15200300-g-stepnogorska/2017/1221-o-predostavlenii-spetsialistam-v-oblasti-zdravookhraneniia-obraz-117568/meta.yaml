  title:
    rus: О внесении изменения в решение Степногорского городского маслихата от 21 декабря 2017 года № 6С-24/3 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2018 год»
    kaz: Степногорск қалалық мәслихатының 2017 жылғы 21 желтоқсандағы № 6С-24/3 «2018 жылға арналған ауылдық елді мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
