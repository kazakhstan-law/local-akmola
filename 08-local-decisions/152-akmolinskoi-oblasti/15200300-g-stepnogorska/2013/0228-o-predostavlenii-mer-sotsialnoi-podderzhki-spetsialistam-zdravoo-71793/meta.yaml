requisite: Решение Степногорского городского маслихата Акмолинской области от 28 февраля 2013 года № 5С-13/3. Зарегистрировано Департаментом юстиции Акмолинской области 28 марта 2013 года № 3693. Утратило силу решением Степногорского городского маслихата Акмолинской области от 5 сентября 2013 года № 5С-21/3
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в село Карабулак на 2013 год
  kaz: Қарабұлақ селосына жұмыс iстеу және тұру үшін келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылы әлеуметтiк қолдау шараларын ұсыну туралы
