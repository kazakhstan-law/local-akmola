  title:
    rus: О внесении изменений в решение Степногорского городского маслихата от 24 декабря 2013 года № 5С-25/8 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Степногорска»
    kaz: «Степногорск қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Степногорск қалалық мәслихатының 2013 жылғы 24 желтоқсандағы № 5С-25/8 шешіміне өзгерістер енгізу туралы
