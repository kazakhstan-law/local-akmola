requisite: Решение Степногорского городского маслихата Акмолинской области от 24 декабря 2013 года № 5С-25/3. Зарегистрировано Департаментом юстиции Акмолинской области 20 января 2014 года № 3971. Утратило силу решением Степногорского городского маслихата Акмолинской области от 22 октября 2014 года № 5С-32/7
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты на 2014 год
  kaz: Ауылдық елді мекендерге жұмыс iстеу және тұру үшін келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2014 жылы әлеуметтiк қолдау шараларын ұсыну туралы
