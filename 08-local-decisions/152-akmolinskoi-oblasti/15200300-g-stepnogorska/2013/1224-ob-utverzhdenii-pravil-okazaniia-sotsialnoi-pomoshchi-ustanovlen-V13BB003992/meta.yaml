requisite: Решение Степногорского городского маслихата Акмолинской области от 24 декабря 2013 года № 5С-25/8. Зарегистрировано Департаментом юстиции Акмолинской области 28 января 2014 года № 3992. Утратило силу решением Степногорского городского маслихата Акмолинской области от 9 февраля 2024 года № 8С-10/2 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Степногорска
  kaz: Степногорск қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы
