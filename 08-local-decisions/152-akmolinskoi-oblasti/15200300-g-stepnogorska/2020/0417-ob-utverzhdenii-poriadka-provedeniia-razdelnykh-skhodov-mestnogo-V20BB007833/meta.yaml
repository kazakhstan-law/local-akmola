requisite: Решение Степногорского городского маслихата Акмолинской области от 17 апреля 2020 года № 6С-50/4. Зарегистрировано Департаментом юстиции Акмолинской области 22 апреля 2020 года № 7833. Утратило силу решением Степногорского городского маслихата Акмолинской области от 3 августа 2022 года № 7С-16/4 (вводится в действие по истечению десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов города Степногорска
  kaz: Степногорск қаласының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
