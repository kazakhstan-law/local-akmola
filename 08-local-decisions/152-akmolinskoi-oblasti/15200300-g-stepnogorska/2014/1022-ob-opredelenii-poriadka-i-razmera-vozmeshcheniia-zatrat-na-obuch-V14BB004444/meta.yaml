  title:
    rus: О внесении изменений в решение Степногорского городского маслихата от 22 октября 2014 года № 5С-32/8 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану»
    kaz: «Мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» Степногорск қалалық мәслихатының 2014 жылғы 22 қазандағы № 5С-32/8 шешіміне өзгерістер енгізу туралы
