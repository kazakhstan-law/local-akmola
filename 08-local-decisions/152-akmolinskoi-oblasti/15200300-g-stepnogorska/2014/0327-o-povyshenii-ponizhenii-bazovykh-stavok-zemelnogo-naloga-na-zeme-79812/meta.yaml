title:
  rus: О повышении (понижении) базовых ставок земельного налога на земельные участки города Степногорска, населенных пунктов в административных границах города Степногорска
  kaz: Степногорск қаласының әкімшілік шекараларындағы Степногорск қаласы, елді мекендер жер учаскелеріне жер салығының базалық ставкаларын жоғарылату (төмендету) туралы
