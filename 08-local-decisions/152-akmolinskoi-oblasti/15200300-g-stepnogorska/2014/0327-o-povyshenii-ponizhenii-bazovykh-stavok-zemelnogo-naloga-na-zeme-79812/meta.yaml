  title:
    rus: О внесении изменений в решение Степногорского городского маслихата от 27 марта 2014 года № 5С-26/6 «О повышении (понижении) базовых ставок земельного налога на земельные участки города Степногорска, населенных пунктов и земли сельскохозяйственного назначения в административных границах города Степногорска»
    kaz: Степногорск қалалық мәслихатының 2014 жылғы 27 наурыздағы № 5С-26/6 «Степногорск қаласының әкімшілік шекараларындағы ауыл шаруашылығы мақсатындағы жерлерге, елді мекендерге Степногорск қаласы бойынша жер салығының базалық ставкаларын жоғарылату (төмендету) туралы» шешіміне өзгерістер енгізу туралы
