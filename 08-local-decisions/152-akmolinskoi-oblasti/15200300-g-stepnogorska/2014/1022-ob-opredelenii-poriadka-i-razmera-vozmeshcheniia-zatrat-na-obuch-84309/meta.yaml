  title:
    rus: О внесении изменений в решение Степногорского городского маслихата от 22 октября 2014 года № 5С-32/8 «Об определении порядка и размера затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов»
    kaz: Степногорск қалалық мәслихатының 2014 жылғы 22 қазандағы № 5С-32/8 «Мүгедектер қатарындағы мүмкіндігі шектеулі балаларды үйде оқытуға жұмсалатын шығындардың тәртібін және мөлшерін белгілеу туралы» шешіміне өзгерістер енгізу туралы
