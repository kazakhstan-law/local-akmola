requisite: Решение Степногорского городского маслихата Акмолинской области от 24 декабря 2019 года № 6С-48/3. Зарегистрировано Департаментом юстиции Акмолинской области 8 января 2020 года № 7614. Утратило силу решением Степногорского городского маслихата Акмолинской области от 29 октября 2020 года № 6С-58/2 (вводится в действие со дня официального опубликования)
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2020 год
  kaz: 2020 жылға арналған ауылдық елді мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
