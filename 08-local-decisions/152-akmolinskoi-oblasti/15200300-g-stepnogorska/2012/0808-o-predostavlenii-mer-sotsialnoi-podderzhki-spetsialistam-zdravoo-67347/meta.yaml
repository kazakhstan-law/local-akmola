requisite: Решение Степногорского городского маслихата Акмолинской области от 8 августа 2012 года № 5С-8/3. Зарегистрировано Управлением юстиции города Степногорска Акмолинской области 28 августа 2012 года № 1-2-168. Утратило силу решением Степногорского городского маслихата Акмолинской области от 3 мая 2013 года № 5С-16/10
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в село Карабулак
  kaz: Қарабұлақ селосына жұмыс істеу және тұру үшін келген денсаулық сақтау,  білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария  мамандарына әлеуметтік қолдау шараларын ұсыну туралы
