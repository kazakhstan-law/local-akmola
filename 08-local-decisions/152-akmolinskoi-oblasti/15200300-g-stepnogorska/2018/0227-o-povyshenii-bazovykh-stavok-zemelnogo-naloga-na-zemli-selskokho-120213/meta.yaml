requisite: Решение Степногорского городского маслихата Акмолинской области от 27 февраля 2018 года № 6С-25/11. Зарегистрировано Департаментом юстиции Акмолинской области 26 марта 2018 года № 6486. Утратило силу решением Степногорского городского маслихата Акмолинской области от 23 декабря 2021 года № 7С-11/4 (вводится в действие с 1 января 2022 года)
title:
  rus: О повышении базовых ставок земельного налога на земли сельскохозяйственного назначения города Степногорска, не используемые в соответствии с земельным законодательством Республики Казахстан
