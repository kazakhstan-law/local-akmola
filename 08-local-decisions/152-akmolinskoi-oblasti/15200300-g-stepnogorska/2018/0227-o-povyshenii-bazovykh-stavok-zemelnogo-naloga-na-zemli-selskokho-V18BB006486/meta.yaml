title:
  rus: О повышении базовых ставок земельного налога на земли сельскохозяйственного назначения города Степногорска, не используемые в соответствии с земельным законодательством Республики Казахстан
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын Степногорск қаласының ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін арттыру туралы
