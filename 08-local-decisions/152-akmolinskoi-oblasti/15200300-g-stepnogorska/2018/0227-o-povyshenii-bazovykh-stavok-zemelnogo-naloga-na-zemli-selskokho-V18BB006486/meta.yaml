  title:
    rus: О признании утратившим силу решения Степногорского городского маслихата от 27 февраля 2018 года № 6С-25/11 «О повышении базовых ставок земельного налога на земли сельскохозяйственного назначения города Степногорска, не используемые в соответствии с земельным законодательством Республики Казахстан»
    kaz: Степногорск қалалық мәслихатының 2018 жылғы 27 ақпандағы № 6С-25/11 «Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын Степногорск қаласының ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін арттыру туралы» шешімінің күші жойылды деп тану туралы
