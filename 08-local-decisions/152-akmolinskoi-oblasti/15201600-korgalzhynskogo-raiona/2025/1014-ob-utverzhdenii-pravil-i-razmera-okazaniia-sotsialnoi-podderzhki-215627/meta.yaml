act_code: '215627'
requisite: Решение Коргалжынского районного маслихата Акмолинской области от 14 октября 2025 года № 5/37. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 октября 2025 года № 37130
title:
  rus: Об утверждении правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, проживающим и работающим в сельских населенных пунктах Коргалжынского района
  kaz: Қорғалжын ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидаларын  және мөлшерін бекіту туралы
