act_code: '154459'
requisite: Решение Коргалжынского районного маслихата Акмолинской области от 31 марта 2021 года № 4/3. Зарегистрировано Департаментом юстиции Акмолинской области 9 апреля 2021 года № 8423
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Коргалжынского района подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2021 год
  kaz: 2021 жылға арналған Қорғалжын ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
