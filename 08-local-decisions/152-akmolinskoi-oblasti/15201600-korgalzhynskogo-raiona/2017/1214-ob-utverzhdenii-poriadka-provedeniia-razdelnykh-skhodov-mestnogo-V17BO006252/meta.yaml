  title:
    rus: О признании утратившим силу решения Коргалжынского районного маслихата от 14 декабря 2017 года № 2/21 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Коргалжынского района»
    kaz: Қорғалжын аудандық мәслихатының 2017 жылғы 14 желтоқсандағы № 2/21 «Қорғалжын ауданының  елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешімінің күші жойылды деп тану туралы
