requisite: Решение Коргалжынского районного маслихата Акмолинской области от 14 декабря 2017 года № 2/21. Зарегистрировано Департаментом юстиции Акмолинской области 26 декабря 2017 года № 6252. Утратило силу решением Коргалжынского районного маслихата Акмолинской области от 29 апреля 2021 года № 1/5 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Коргалжынского района
  kaz: Қорғалжын ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
