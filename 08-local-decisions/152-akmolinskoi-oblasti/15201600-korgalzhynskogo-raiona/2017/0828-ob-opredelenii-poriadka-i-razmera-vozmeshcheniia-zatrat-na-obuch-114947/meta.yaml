  title:
    rus: О внесении изменений в решение Коргалжынского районного маслихата от 28 августа 2017 года № 2/18 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Коргалжынском районе»
    kaz: Қорғалжын аудандық мәслихатының 2017 жылғы 28 тамыздағы № 2/18 «Қорғалжын ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
