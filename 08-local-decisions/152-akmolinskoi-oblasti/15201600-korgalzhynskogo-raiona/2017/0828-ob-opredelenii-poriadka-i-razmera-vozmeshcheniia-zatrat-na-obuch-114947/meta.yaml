  title:
    rus: О внесении изменений и дополнения в решение Коргалжынского районного маслихата от 28 августа 2017 года № 2/18 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Коргалжынском районе»
    kaz: Қорғалжын аудандық мәслихатының 2017 жылғы 28 тамыздағы № 2/18 «Қорғалжын ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
