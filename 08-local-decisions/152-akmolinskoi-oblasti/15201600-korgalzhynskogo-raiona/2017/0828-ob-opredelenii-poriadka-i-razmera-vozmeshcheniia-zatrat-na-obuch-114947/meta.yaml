requisite: Решение Коргалжынского районного маслихата Акмолинской области от 28 августа 2017 года № 2/18. Зарегистрировано Департаментом юстиции Акмолинской области 26 сентября 2017 года № 6085
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Коргалжынском районе
  kaz: Қорғалжын ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
