  title:
    rus: О внесении изменения в решение Коргалжынского районного маслихата от 22 декабря 2017 года № 2/22 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Коргалжынского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2018 год»
    kaz: Қорғалжын аудандық мәслихатының 2017 жылғы 22 желтоқсандағы № 2/22 «2018 жылға арналған Қорғалжын ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
