requisite: Ақмола облысы Қорғалжын аудандық мәслихатының 2011 жылғы 6 сәуірдегі № 5/29 шешімі. Ақмола облысы Қорғалжын ауданының Әділет басқармасында 2011 жылғы 5 мамырда № 1-15-163 тіркелді. Күші жойылды - Ақмола облысы Қорғалжын аудандық мәслихатының 2016 жылғы 8 қыркүйектегі № 4/7 шешімімен
