requisite: Ақмола облысы Қорғалжын аудандық мәслихатының 2009 жылғы 30 наурыздағы № 4/11 шешімі. Ақмола облысы Қорғалжын ауданының Әділет басқармасында 2009 жылғы 27 сәуірде № 1-15-124 тіркелді. Күші жойылды - Ақмола облысы Қорғалжын аудандық мәслихатының 2010 жылғы 21 шілдедегі № 11/22 шешімімен
