  title:
    rus: О внесении изменений и дополнений в решение Коргалжынского районного маслихата от 27 сентября 2016 года № 1/8 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Коргалжынском районе»
    kaz: Қорғалжын аудандық мәслихатының 2016 жылғы 27 қыркүйектегі № 1/8 «Қорғалжын ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер және толықтырулар енгізу туралы
