act_code: '109263'
requisite: Решение Коргалжынского районного маслихата Акмолинской области от 22 декабря 2016 года № 10/12. Зарегистрировано Департаментом юстиции Акмолинской области 13 января 2017 года № 5699
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Коргалжынского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2017 год
  kaz: 2017 жылға арналған Қорғалжын ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау,білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
