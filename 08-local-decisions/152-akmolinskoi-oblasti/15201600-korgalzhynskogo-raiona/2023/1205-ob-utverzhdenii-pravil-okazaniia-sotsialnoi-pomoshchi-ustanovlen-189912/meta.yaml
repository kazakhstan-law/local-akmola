  title:
    rus: О внесении изменений и дополнений в решение Коргалжынского районного маслихата от 5 декабря 2023 года № 7/9 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Коргалжынском районе»
    kaz: Қорғалжын аудандық мәслихатының 2023 жылғы 5 желтоқсандағы № 7/9 «Қорғалжын ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
