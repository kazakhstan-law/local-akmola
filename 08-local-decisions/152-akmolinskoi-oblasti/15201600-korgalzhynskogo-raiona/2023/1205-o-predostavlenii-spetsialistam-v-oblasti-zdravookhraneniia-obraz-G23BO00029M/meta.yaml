  title:
    rus: О внесении изменения в решение Коргалжынского районного маслихата от 5 декабря 2023 года № 2/9 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Коргалжынского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2024 год»
    kaz: Қорғалжын аудандық мәслихатының 2023 жылғы 5 желтоқсандағы № 2/9 «2024 жылға арналған Қорғалжын ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201738/rus
