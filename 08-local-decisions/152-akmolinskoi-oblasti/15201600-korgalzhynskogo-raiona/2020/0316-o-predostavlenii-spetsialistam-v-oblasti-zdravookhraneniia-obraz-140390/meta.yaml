act_code: '140390'
requisite: Решение Коргалжынского районного маслихата Акмолинской области от 16 марта 2020 года № 2/50. Зарегистрировано Департаментом юстиции Акмолинской области 19 марта 2020 года № 7738
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Коргалжынского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2020 год
  kaz: 2020 жылға арналған Қорғалжын ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
