requisite: Решение маслихата района Биржан сал Акмолинской области от 29 марта 2018 года № С-22/6. Зарегистрировано Департаментом юстиции Акмолинской области 17 апреля 2018 года № 6553. Утратило силу решением маслихата района Биржан сал Акмолинской области от 2 августа 2022 года № С-19/2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
