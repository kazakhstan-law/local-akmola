  title:
    rus: О внесении изменения в решение маслихата района Биржан сал от 25 декабря 2018 года № C-34/3 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Биржан сал, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2019 год»
    kaz: Біржан сал ауданы мәслихатының 2018 жылғы 25 желтоқсандағы № С-34/3 «2019 жылға арналған Біржан сал ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
