  title:
    rus: О внесении изменения в решение маслихата района Биржан сал от 29 марта 2018 года № С-22/8 «Об утверждении границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки города Степняк и сельских населенных пунктов района Биржан сал»
