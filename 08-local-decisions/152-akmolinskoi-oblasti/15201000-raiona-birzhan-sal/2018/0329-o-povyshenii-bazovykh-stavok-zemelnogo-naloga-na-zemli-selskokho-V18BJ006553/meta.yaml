  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Біржан сал ауданының шекараларында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін арттыру туралы
