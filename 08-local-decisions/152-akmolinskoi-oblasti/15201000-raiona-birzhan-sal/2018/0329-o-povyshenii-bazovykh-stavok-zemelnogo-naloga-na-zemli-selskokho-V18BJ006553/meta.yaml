  title:
    rus: О признании утратившим силу решения маслихата района Биржан сал от 29 марта 2018 года № С-22/6 «О повышении базовых ставок земельного налога на земли сельскохозяйственного назначения, не используемые в соответствии с земельным законодательством Республики Казахстан в границах района Биржан сал»
    kaz: Біржан сал ауданы мәслихатының 2018 жылғы 29 наурыздағы № С-22/6 «Қазақстан Республикасының жер заңнамасына сәйкес Біржан сал ауданының шекараларында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін арттыру туралы» шешімінің күші жойылды деп тану туралы
