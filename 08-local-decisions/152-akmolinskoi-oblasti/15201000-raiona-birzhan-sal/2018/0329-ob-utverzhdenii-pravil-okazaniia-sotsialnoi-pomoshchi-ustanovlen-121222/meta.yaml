  title:
    rus: О внесении изменений в решение маслихата района Биржан сал от 29 марта 2018 года № С-22/10 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в районе Биржан сал»
    kaz: Біржан сал ауданы мәслихатының 2018 жылғы 29 наурыздағы № С-22/10 «Біржан сал ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
