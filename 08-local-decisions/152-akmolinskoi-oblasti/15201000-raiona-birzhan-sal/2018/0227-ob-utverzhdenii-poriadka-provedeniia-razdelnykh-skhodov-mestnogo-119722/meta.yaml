  title:
    rus: О внесении изменения в решение маслихата района Биржан сал от 27 февраля 2018 года № С-20/9 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов района Биржан сал»
    kaz: Біржан сал ауданы мәслихатының 2018 жылғы 27 ақпандағы № С-20/9 «Біржан сал ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгеріс енгізу туралы
