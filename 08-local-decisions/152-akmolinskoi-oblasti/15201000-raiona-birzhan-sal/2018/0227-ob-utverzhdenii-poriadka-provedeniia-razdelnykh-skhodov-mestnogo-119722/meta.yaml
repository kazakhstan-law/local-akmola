act_code: '119722'
requisite: Решение маслихата района Биржан сал Акмолинской области от 27 февраля 2018 года № С-20/9. Зарегистрировано Департаментом юстиции Акмолинской области 15 марта 2018 года № 6471. Утратило силу решением маслихата района Биржан сал Акмолинской области от 6 мая 2022 года № С-15/4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов района Биржан сал
  kaz: Біржан сал ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
