  title:
    rus: О внесении изменений в решение маслихата района Биржан сал от 2 февраля 2021 года № С-2/2 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в районе Биржан сал»
    kaz: Біржан сал ауданы мәслихатының 2021 жылғы 2 ақпандағы № С-2/2 «Біржан сал ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
