act_code: '139502'
requisite: Решение маслихата района Биржан сал Акмолинской области от 7 февраля 2020 года № С-47/2. Зарегистрировано Департаментом юстиции Акмолинской области 12 февраля 2020 года № 7672. Утратило силу решением маслихата района Биржан сал Акмолинской области от 9 декабря 2020 года № С-59/3 (вводится в действие со дня официального опубликования)
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Биржан сал, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2020 год
  kaz: 2020 жылға арналған Біржан сал ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
