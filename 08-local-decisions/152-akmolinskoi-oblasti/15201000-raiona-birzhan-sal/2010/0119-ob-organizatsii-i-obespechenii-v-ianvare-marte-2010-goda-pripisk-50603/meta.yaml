requisite: Решение акима Енбекшильдерского района Акмолинской области от 19 января 2010 года № 3. Зарегистрировано Управлением юстиции Енбекшильдерского района Акмолинской области 9 февраля 2010 года № 1-10-108. Утратило силу решением акима Енбекшильдерского района Акмолинской области от 20 декабря 2010 года № 32
