act_code: '56680'
requisite: Решение Енбекшильдерского районного маслихата Акмолинской области от 22 декабря 2010 года № С-28/5. Зарегистрировано Управлением юстиции Енбекшильдерского района Акмолинской области 14 января 2011 года № 1-10-133. Утратило силу - решением Енбекшильдерского районного маслихата Акмолинской области от 10 ноября 2011 года № С-37/3
title:
  rus: О предоставлении мер социальный поддержки на 2011 год специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Енбекшильдерского района
  kaz: Еңбекшілдер ауданындағы ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2011 жылғы әлеуметтік қолдау шараларын ұсыну туралы
