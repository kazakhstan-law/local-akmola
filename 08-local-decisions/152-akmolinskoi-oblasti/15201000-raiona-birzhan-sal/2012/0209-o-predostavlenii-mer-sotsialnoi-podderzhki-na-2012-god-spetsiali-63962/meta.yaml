act_code: '63962'
requisite: Решение Енбекшильдерского районного маслихата Акмолинской области от 9 февраля 2012 года № С-2/3. Зарегистрировано Управлением юстиции Енбекшильдерского района Акмолинской области 1 марта 2012 года № 1-10-155. Утратило силу - решением Енбекшильдерского районного маслихата Акмолинской области от 9 января 2013 года № С-12/2
title:
  rus: О предоставлении мер социальной поддержки на 2012 год специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии прибывшим для работы и проживания в сельские населенные пункты Енбекшильдерского района
  kaz: Еңбекшілдер ауданындағы ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2012 жылға келесі әлеуметтік қолдау шараларын ұсыну туралы
