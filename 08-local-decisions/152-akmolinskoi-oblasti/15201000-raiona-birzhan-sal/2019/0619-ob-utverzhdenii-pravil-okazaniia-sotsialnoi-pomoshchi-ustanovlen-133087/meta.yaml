  title:
    rus: О внесении изменений в решение маслихата района Биржан сал от 19 июня 2019 года № С-40/4 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в районе Биржан сал»
    kaz: Біржан сал ауданы мәслихатының 2019 жылғы 19 маусымдағы № С-40/4 «Біржан сал ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
