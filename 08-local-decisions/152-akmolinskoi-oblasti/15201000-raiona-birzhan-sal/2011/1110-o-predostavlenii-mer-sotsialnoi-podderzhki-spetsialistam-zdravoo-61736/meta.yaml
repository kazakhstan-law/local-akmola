act_code: '61736'
requisite: Решение Енбекшильдерского районного маслихата Акмолинской области от 10 ноября 2011 года № С-37/3. Зарегистрировано Управлением юстиции Енбекшильдерского района Акмолинской области 2 декабря 2011 года № 1-10-147. Утратило силу - решением Енбекшильдерского районного маслихата Акмолинской области от 9 февраля 2012 года № С-2/3
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Енбекшильдерского района
  kaz: Еңбекшілдер ауданындағы ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау шараларын ұсыну туралы
