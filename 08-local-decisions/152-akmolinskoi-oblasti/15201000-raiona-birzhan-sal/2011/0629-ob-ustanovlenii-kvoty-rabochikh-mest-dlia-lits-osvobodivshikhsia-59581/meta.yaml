title:
  rus: Об установлении квоты рабочих мест для лиц, освободившихся из мест лишения свободы и для несовершеннолетних выпускников интернатных организаций в Енбекшильдерском районе
  kaz: Еңбекшілдер ауданында бас бостандығынан айыру орындарынан босатылған адамдар үшін және интернаттық ұйымдарды бітіруші кәмелетке толмағандар үшін жұмыс орындарына квота белгілеу туралы
