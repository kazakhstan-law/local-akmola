title:
  rus: Об организации и обеспечении в январе-марте 2012 года приписки граждан мужского пола, которым в год приписки исполняется семнадцать лет к призывному участку государственного учреждения "Отдел по делам обороны Енбекшильдерского района Акмолинской области"
