requisite: Решение Енбекшильдерского районного маслихата Акмолинской области от 9 января 2013 года № С-12/2. Зарегистрировано Департаментом юстиции Акмолинской области 22 января 2013 года № 3625
title:
  rus: О предоставлении мер социальной поддержки на 2013 год специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии прибывшим для работы и проживания в сельские населенные  пункты Енбекшильдерского района
  kaz: Еңбекшілдер ауданындағы ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылға әлеуметтік қолдау шараларын ұсыну туралы
