  title:
    rus: О внесении изменений в решение Енбекшильдерского районного маслихата от 9 января 2013 года № С-12/5 "Об утверждении границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки на земли сельских населенных пунктов и сельскохозяйственного назначения для целей налогообложения в Енбекшильдерском районе"
    kaz: Еңбекшілдер аудандық мәслихатының 2013 жылғы 9 қаңтардағы № С-12/5 "Еңбекшілдер ауданында салық салу мақсаты үшін ауылдық елді мекендердің және ауыл шаруашылығына арналған жерлерге бағалау аймақтары шекараларының және жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерiн бекіту туралы" шешіміне өзгерістер енгізу туралы
