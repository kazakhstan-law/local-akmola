title:
  rus: Об утверждении поправочных коэффициентов к базовым ставкам платы за земельные участки в сельских населенных пунктах Енбекшильдерского района
  kaz: Еңбекшілдер ауданының ауылдық елді мекендердегі жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы
