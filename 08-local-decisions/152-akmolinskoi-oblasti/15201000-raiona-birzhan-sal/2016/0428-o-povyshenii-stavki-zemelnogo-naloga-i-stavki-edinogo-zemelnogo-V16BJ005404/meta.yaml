  title:
    rus: О признании утратившим силу решения Енбекшильдерского районного маслихата от 28 апреля 2016 года № С-2/5 «О повышении ставки земельного налога и единого земельного налога на не используемые, в соответствии с земельным законодательством Республики Казахстан, земли сельскохозяйственного назначения в границах Енбекшильдерского района»
    kaz: Еңбекшілдер аудандық мәслихатының 2016 жылғы 28 сәуірдегі № С-2/5 «Қазақстан Республикасының жер заңнамасына сәйкес Еңбекшілдер ауданы шекарасындағы пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығы және бірыңғай жер салығы мөлшерлемесін жоғарылату туралы» шешімінің күші жойылды деп тану туралы
