  requisite: Решение Енбекшильдерского районного маслихата Акмолинской области от 2 июля 2010 года № С-24/4. Зарегистрировано Управлением юстиции Енбекшильдерского района Акмолинской области 6 августа 2010 года № 1-10-122. Утратило силу решением Енбекшильдерского районного маслихата Акмолинской области от 26 апреля 2013 года № С-15/6
  title:
    rus: О внесении изменения в решение Енбекшильдерского районного маслихата от 22 декабря 2008 года № С-11/6 "Об утверждении Правил предоставления жилищной помощи малообеспеченным семьям (гражданам) на оплату содержания жилища (кроме содержания индивидуального жилого дома) и потребления коммунальных услуг и услуг телефонной абонентской связи в Енбекшильдерском районе"
    kaz: Еңбекшілдер аудандық мәслихатының 2008 жылғы № С-11/6 "Еңбекшілдер ауданында аз камтамасыз етілген отбасыларына (азаматтарға) тұрғын үйлерін (жеке меншіктегі тұрғын үйді ұстаудан басқа) ұстау, коммуналдық және абонеттік телефон байланыс қызметтерімен пайдалану үшін төлеуге, тұрғын үй көмегін беру Ережелерін бекіту туралы" шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/53926/rus
