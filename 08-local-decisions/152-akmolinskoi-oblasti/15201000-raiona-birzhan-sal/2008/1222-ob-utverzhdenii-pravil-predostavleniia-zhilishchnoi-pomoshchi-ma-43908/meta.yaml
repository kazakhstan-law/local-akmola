  requisite: Решение Енбекшильдерского районного маслихата Акмолинской области от 26 апреля 2012 года № С-4/4. Зарегистрировано Управлением юстиции Енбекшильдерского района Акмолинской области 25 мая 2012 года № 1-10-163. Утратило силу решением Енбекшильдерского районного маслихата Акмолинской области от 26 апреля 2013 года № С-15/6
  title:
    rus: О внесении изменений в решение Енбекшильдерского районного маслихата от 22 декабря 2008 года № С-11/6 "Об утверждении Правил предоставления жилищной помощи малообеспеченным семьям (гражданам) на оплату содержания жилища(кроме содержания индивидуального жилого дома) и потребления коммунальных услуг и услуг телефонной абонентской связи в Енбекшильдерском районе"
    kaz: Еңбекшілдер аудандық мәслихатының 2008 жылғы 22 желтоқсандағы № С-11/6 "Еңбекшілдер ауданында аз қамтамасыз етілген отбасыларына (азаматтарға) тұрғын үйлерін (жеке меншіктегі тұрғын үйді ұстаудан басқа) ұстау, коммуналдық қызметтер мен телефондық абоненттік байланыс қызметтерін пайдалану үшін төлеуге, тұрғын үй көмегін беру ережелерін бекіту туралы" шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/65717/rus
