act_code: '43908'
requisite: Решение Енбекшильдерского районного маслихата Акмолинской области от 22 декабря 2008 года № С-11/6. Зарегистрировано Управлением юстиции Енбекшильдерского района Акмолинской области 28 января 2009 года № 1-10-81. Утратило силу решением Енбекшильдерского районного маслихата Акмолинской области от 26 апреля 2013 года № С-15/6
title:
  rus: Об утверждении Правил предоставления жилищной помощи малообеспеченным семьям (гражданам) постоянно проживающим в Енбекшильдерском районе
  kaz: Еңбекшілдер ауданында тұрақты тұратын аз қамтамасыз етілген отбасыларына (азаматтарға) тұрғын үй көмегін беру ережесін бекіту туралы
