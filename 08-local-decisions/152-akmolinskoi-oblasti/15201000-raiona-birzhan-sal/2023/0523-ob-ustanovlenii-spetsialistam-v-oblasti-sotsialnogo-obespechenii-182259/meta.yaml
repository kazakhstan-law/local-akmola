act_code: '182259'
requisite: Решение маслихата района Биржан сал Акмолинской области от 23 мая 2023 года № С-2/2. Зарегистрировано Департаментом юстиции Акмолинской области 30 мая 2023 года № 8574-03
title:
  rus: Об установлении специалистам в области социального обеспечения, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности района Биржан сал, повышенных на двадцать пять процентов должностных окладов и тарифных ставок по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Біржан сал ауданының азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандарға қызметтің осы түрлерімен қалалық жағдайда айналысатын азаматтық қызметшілердің айлықақыларымен және мөлшерлемелерімен салыстырғанда жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
