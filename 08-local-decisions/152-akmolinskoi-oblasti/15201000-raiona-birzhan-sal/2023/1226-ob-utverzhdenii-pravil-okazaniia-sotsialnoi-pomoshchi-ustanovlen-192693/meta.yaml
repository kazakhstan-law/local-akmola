  title:
    rus: О внесении изменений в решение маслихата района Биржан сал от 26 декабря 2023 года № С-8/5 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в районе Биржан сал»
    kaz: Біржан сал ауданы мәслихатының 2023 жылғы 26 желтоқсандағы С-8/5 «Біржан сал ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
