act_code: '118232'
requisite: Решение Енбекшильдерского районного маслихата Акмолинской области от 25 декабря 2017 года № С-18/5. Зарегистрировано Департаментом юстиции Акмолинской области 16 января 2018 года № 6345. Утратило силу решением маслихата района Биржан сал Акмолинской области от 27 февраля 2018 года № С-20/4
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Енбекшильдерского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2018 год
  kaz: 2018 жылға арналған Еңбекшілдер ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
