  title:
    rus: О внесении изменений в решение Енбекшильдерского районного маслихата от 13 марта 2017 года № С-10/2 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Енбекшильдерском районе»
    kaz: Еңбекшілдер аудандық мәслихатының 2017 жылғы 13 наурыздағы № С-10/2 «Еңбекшілдер ауданында мүгедектер қатарындағы кемтар балаларды жеке оқу жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
