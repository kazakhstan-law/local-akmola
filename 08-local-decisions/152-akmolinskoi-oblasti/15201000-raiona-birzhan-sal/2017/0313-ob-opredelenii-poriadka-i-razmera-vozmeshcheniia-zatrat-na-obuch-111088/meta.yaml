act_code: '111088'
requisite: Решение Енбекшильдерского районного маслихата Акмолинской области от 13 марта 2017 года № С-10/2. Зарегистрировано Департаментом юстиции Акмолинской области 7 апреля 2017 года № 5871. Утратило силу решением маслихата района Биржан сал Акмолинской области от 5 марта 2024 года № С-10/2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в районе Биржан сал
  kaz: Біржан сал ауданында мүгедектер қатарындағы кемтар балаларды жеке оқу жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы
