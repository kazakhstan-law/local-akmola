requisite: Решение Енбекшильдерского районного маслихата Акмолинской области от 23 декабря 2014 года № С-35/4. Зарегистрировано Департаментом юстиции Акмолинской области 16 января 2015 года № 4599
title:
  rus: О предоставлении мер социальной поддержки на 2015 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Енбекшильдерского района
  kaz: Еңбекшілдер ауданындағы ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және  агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылға әлеуметтік қолдау шараларын ұсыну туралы
