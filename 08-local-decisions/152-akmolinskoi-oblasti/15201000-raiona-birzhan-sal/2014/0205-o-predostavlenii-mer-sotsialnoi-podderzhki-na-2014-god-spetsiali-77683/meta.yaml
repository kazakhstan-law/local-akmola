act_code: '77683'
requisite: Решение Енбекшильдерского районного маслихата Акмолинской области от 5 февраля 2014 года № С-26/2. Зарегистрировано Департаментом юстиции Акмолинской области 27 февраля 2014 года № 4018
title:
  rus: О предоставлении мер социальной поддержки на 2014 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Енбекшильдерского района
  kaz: Еңбекшілдер ауданындағы ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2014 жылға әлеуметтік қолдау шараларын ұсыну туралы
