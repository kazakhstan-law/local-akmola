requisite: Решение Енбекшильдерского районного маслихата Акмолинской области от 24 декабря 2015 года № С-46/4. Зарегистрировано Департаментом юстиции Акмолинской области 19 января 2016 года № 5220
title:
  rus: О предоставлении мер социальной поддержки на 2016 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Енбекшильдерского района
  kaz: Еңбекшілдер ауданындағы ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет,спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылға әлеуметтік қолдау шараларын ұсыну туралы
