requisite: Решение Енбекшильдерского районного маслихата Акмолинской области от 30 апреля 2015 года № С-39/5. Зарегистрировано Департаментом юстиции Акмолинской области 9 июня 2015 года № 4825. Утратило силу решением Енбекшильдерского районного маслихата Акмолинской области от 18 февраля 2016 года № С-48/11
title:
  rus: О повышении ставки земельного налога и ставки единого земельного налога на не используемые, в соответствии с земельным законодательством Республики Казахстан, земли сельскохозяйственного назначения в границах Енбекшильдерского района
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Еңбекшілдер ауданы шекарасындағы пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығы және бірыңғай жер салығы мөлшерлемесін жоғарылату туралы
