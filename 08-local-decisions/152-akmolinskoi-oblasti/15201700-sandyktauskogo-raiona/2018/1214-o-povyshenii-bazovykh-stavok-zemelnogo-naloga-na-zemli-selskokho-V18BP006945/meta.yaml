  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Сандықтау ауданының шекараларындағы пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін арттыру туралы
