    kaz: Ақмола облысы Сандықтау аудандық мәслихатының 2018 жылғы 14 желтоқсандағы № 24/2 «Қазақстан Республикасының жер заңнамасына сәйкес Сандықтау ауданының шекараларындағы пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін арттыру туралы» шешімінің күші жойылды деп тану туралы
