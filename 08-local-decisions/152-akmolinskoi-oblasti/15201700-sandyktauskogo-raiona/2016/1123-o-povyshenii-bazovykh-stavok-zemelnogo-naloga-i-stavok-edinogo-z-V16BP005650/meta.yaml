title:
  rus: О повышении базовых ставок земельного налога и ставок единого земельного налога на неиспользуемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения в границах Сандыктауского района
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Сандықтау ауданының шекарасындағы пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін және біріңғай жер салығының мөлшерлемелерін жоғарылату туралы
