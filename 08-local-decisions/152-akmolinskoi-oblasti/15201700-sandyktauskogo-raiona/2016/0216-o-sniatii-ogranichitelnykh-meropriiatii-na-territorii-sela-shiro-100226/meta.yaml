requisite: Решение акима Жамбылского сельского округа Лебяжинского района Павлодарской области от 16 февраля 2016 года № 1-16/01
title:
  rus: О снятии ограничительных мероприятий на территории села Широкое Жамбылского сельского округа и признании утратившим силу решение акима Жамбылского  сельского округа от 23 февраля 2015 года № 1-16/01 «Об установлении ветеринарного режима с введением ограничительных мероприятий на территории села Широкое Жамбылского сельского округа»
  kaz: Жамбыл ауылдық округі Широкое ауылының аумағында шектеу іс-шараларын алу және Жамбыл ауылдық округі әкімінің 2015 жылғы 23 ақпандағы «Жамбыл ауылдық округі Широкое ауылының аумағында шектеу іс-шараларын енгізе отырып ветеринариялық режимін белгілеу туралы» № 1-16/01 шешімінің күшін жою туралы
