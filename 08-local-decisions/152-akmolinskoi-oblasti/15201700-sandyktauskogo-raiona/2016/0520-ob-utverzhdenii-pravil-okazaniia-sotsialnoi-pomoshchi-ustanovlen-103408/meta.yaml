  title:
    rus: О внесении изменений в решение Сандыктауского районного маслихата от 20 мая 2016 года № 3/4 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан по Сандыктаускому району»
    kaz: Сандықтау аудандық мәслихатының 2016 жылғы 20 мамырдағы № 3/4 «Сандықтау ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
