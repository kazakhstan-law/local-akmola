  title:
    rus: О внесении изменений в решение Сандыктауского районного маслихата Акмолинской области от 26 декабря 2023 года № 8/6 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан по Сандыктаускому району»
    kaz: Ақмола облысы Сандықтау аудандық мәслихатының 2023 жылғы 26 желтоқсандағы № 8/6 «Сандықтау ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
