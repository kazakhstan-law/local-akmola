  title:
    rus: О внесении изменения в решение Сандыктауского районного маслихата от 26 декабря 2023 года № 8/4 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Сандыктауского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2024 год»
    kaz: Сандықтау аудандық мәслихатының 2023 жылғы 26 желтоқсандағы № 8/4 «2024 жылға арналған Сандықтау ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгерістер енгізу туралы
