act_code: '141002'
requisite: Решение Сандыктауского районного маслихата Акмолинской области от 31 марта 2020 года № 40/2. Зарегистрировано Департаментом юстиции Акмолинской области 3 апреля 2020 года № 7785. Утратило силу решением Сандыктауского районного маслихата Акмолинской области от 7 декабря 2020 года № 51/2 (вводится в действие со дня официального опубликования)
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Сандыктауского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2020 год
  kaz: 2020 жылға арналған Сандықтау ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
