act_code: '86163'
requisite: Решение Сандыктауского районного маслихата Акмолинской области от 26 декабря 2014 года № 29/4. Зарегистрировано Департаментом юстиции Акмолинской области 22 января 2015 года № 4604. Утратило силу решением Сандыктауского районного маслихата Акмолинской области от 17 февраля 2016 года № 42/4
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населённые пункты района на 2015 год
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына 2015 жылға әлеуметтік қолдау шараларын ұсыну туралы
