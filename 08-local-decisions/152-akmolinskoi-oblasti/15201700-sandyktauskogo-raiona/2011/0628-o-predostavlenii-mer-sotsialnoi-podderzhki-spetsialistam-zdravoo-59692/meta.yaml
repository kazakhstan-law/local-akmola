requisite: Решение Сандыктауского районного маслихата Акмолинской области от 28 июня 2011 года № 27/4. Зарегистрировано Управлением юстиции Сандыктауского района Акмолинской области 15 июля 2011 года № 1-16-130. Утратило силу решением Сандыктауского районного маслихата Акмолинской области от 7 сентября 2011 года № 28/5
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты района
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау шараларын ұсыну туралы
