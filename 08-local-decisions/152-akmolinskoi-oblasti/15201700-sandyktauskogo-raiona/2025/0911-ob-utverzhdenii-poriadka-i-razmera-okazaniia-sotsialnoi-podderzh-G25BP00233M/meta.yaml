  title:
    rus: О внесении дополнений в решение Сандыктауского районного маслихата Акмолинской области от 11 сентября 2025 года № 23/3 «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Сандыктауского района»
    kaz: Ақмола облысы Сандықтау аудандық мәслихатының 2025 жылғы 11 қыркүйектегі № 23/3 «Сандықтау ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мемлекеттік ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы» шешіміне толықтырулар енгізу туралы
