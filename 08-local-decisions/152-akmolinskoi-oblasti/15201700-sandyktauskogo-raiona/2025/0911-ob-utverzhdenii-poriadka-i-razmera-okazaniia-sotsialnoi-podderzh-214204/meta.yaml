act_code: '214204'
requisite: Решение Сандыктауского районного маслихата Акмолинской области от 11 сентября 2025 года № 23/3
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения образования, социального обеспечения, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Сандыктауского района
  kaz: Сандықтау ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мемлекеттік ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
