  title:
    rus: О внесении изменения в решение Сандыктауского районного маслихата от 25 декабря 2017 года № 17/9 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Сандыктауского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2018 год»
    kaz: Сандықтау аудандық мәслихатының 2017 жылғы 25 желтоқсандағы № 17/9 «2018 жылға арналған Сандықтау ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй алу немесе салу үшін көтерме жәрдемақы және әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
