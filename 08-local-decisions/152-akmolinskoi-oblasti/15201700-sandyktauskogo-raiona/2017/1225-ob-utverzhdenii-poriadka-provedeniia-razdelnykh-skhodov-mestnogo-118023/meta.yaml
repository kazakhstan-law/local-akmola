requisite: Решение Сандыктауского районного маслихата Акмолинской области от 25 декабря 2017 года № 17/8. Зарегистрировано Департаментом юстиции Акмолинской области 11 января 2018 года № 6335. Утратило силу решением Сандыктауского районного маслихата Акмолинской области от 28 июля 2022 года № 22/4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Сандыктауского района
  kaz: Сандықтау ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
