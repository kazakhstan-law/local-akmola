requisite: Решение Сандыктауского районного маслихата Акмолинской области от 25 августа 2017 года № 13/3. Зарегистрировано Департаментом юстиции Акмолинской области 25 сентября 2017 года № 6083. Утратило силу решением Сандыктауского районного маслихата Акмолинской области от 13 августа 2019 года № 32/3 (вводится в действие со дня официального опубликования)
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности Сандыктауского района
  kaz: Сандықтау ауданының азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
