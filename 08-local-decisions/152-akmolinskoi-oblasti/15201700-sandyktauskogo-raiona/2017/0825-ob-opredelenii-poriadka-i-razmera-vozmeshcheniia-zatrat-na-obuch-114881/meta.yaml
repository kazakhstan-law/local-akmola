    kaz: Ақмола облысы Сандықтау аудандық мәслихатының 2017 жылғы 25 тамыздағы № 13/2 «Сандықтау ауданында мүгедектер қатарындағы кемтар балаларды жеке оқу жоспары бойынша үйде оқытуға жұмсаған шығындарды өтеу тәртібі мен мөлшерін белгілеу туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
