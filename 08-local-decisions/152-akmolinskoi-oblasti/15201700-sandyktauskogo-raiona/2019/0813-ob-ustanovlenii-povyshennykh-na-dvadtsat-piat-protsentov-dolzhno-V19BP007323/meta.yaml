  title:
    rus: О признании утратившим силу решения Сандыктауского районного маслихата от 13 августа 2019 года № 32/3 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства, являющимся гражданскими служащими и работающим в сельской местности Сандыктауского района по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях»
    kaz: Сандықтау аудандық мәслихатының «Азаматтық қызметшілер болып табылатын және Сандықтау ауданының ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы саласындағы мамандарға қызметтің осы түрлерімен қалалық жағдайда айналысатын азаматтық қызметшілердің айлықақыларымен және мөлшерлемелерімен салыстырғанда жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» 2019 жылғы 13 тамыздағы № 32/3 шешімінің күші жойылды деп тану туралы
