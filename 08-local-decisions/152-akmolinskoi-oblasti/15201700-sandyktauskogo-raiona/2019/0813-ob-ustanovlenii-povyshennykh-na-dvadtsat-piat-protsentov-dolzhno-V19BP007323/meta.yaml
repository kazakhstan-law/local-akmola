requisite: Решение Сандыктауского районного маслихата Акмолинской области от 13 августа 2019 года № 32/3. Зарегистрировано Департаментом юстиции Акмолинской области 16 августа 2019 года № 7323. Утратило силу решением Сандыктауского районного маслихата Акмолинской области от 30 марта 2021 года № 4/4 (вводится в действие со дня официального опубликования)
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства, являющимся гражданскими служащими и работающим в сельской местности Сандыктауского района по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметшілер болып табылатын және Сандықтау ауданының ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы саласындағы мамандарға қызметтің осы түрлерімен қалалық жағдайда айналысатын азаматтық қызметшілердің айлықақыларымен және мөлшерлемелерімен салыстырғанда жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
