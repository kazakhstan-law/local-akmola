act_code: '137632'
requisite: Решение Ерейментауского районного маслихата Акмолинской области от 24 декабря 2019 года № 6С-46/4-19. Зарегистрировано Департаментом юстиции Акмолинской области 30 декабря 2019 года № 7605. Утратило силу решением Ерейментауского районного маслихата Акмолинской области от 28 октября 2020 года № 6С-53/7-20 (вводится в действие со дня официального опубликования)
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Ерейментауского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2020 год
  kaz: 2020 жылға арналған Ерейментау ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
