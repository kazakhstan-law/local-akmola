act_code: '90199'
requisite: Решение №5С-38/3-15 от 29.04.2015, Маслихат Ерейментауского района
title:
  rus: О предоставлении мер социальной поддержки на 2015 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Ерейментауского района
  kaz: Ерейментау ауданындағы ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылға әлеуметтік қолдау шараларын ұсыну туралы
