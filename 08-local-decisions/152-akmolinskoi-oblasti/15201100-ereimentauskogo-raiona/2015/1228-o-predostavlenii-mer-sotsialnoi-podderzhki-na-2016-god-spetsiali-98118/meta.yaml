act_code: '98118'
requisite: Решение Ерейментауского районного маслихата Акмолинской области от 28 декабря 2015 года № 5С-44/3-15. Зарегистрировано Департаментом юстиции Акмолинской области 26 января 2016 года № 5231
title:
  rus: О предоставлении мер социальной поддержки на 2016 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Ерейментауского района
  kaz: Ерейментау ауданындағы ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылға әлеуметтік қолдау шараларын ұсыну туралы
