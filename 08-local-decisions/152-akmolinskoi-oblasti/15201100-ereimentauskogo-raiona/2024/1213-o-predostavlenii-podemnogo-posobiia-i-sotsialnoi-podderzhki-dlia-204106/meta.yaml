act_code: '204106'
requisite: Решение Ерейментауского районного маслихата Акмолинской области от 13 декабря 2024 года № 8С-32/3-24
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2025 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Ерейментауского района
  kaz: Ерейментау ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2025 жылға арналған тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы және әлеуметтік қолдау көрсету туралы
