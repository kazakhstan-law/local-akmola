    kaz: Ерейментау аудандық мәслихатының 2024 жылғы 26 қаңтардағы № 8С-15/3-24 «Ерейментау ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
