    rus: О внесении изменений и дополнений в решение Ерейментауского районного маслихата от 26 января 2024 года № 8С-15/3-24 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Ерейментауском районе»
    kaz: Ерейментау аудандық мәслихатының 2024 жылғы 26 қаңтардағы № 8С-15/3-24 «Ерейментау ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
