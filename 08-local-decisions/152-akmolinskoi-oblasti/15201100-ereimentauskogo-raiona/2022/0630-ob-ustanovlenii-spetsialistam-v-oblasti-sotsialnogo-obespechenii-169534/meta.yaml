act_code: '169534'
requisite: Решение Ерейментауского районного маслихата Акмолинской области от 30 июня 2022 года № 7С-29/4-22. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 июля 2022 года № 28686
title:
  rus: Об установлении специалистам в области социального обеспечения и культуры, являющимся гражданскими служащими и работающим в сельской местности Ерейментауского района, повышенных на двадцать пять процентов должностных окладов и тарифных ставок по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметшілер болып табылатын және Ерейментау ауданының ауылдық жерінде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандарға, қызметтің осы түрлерімен қалалық жағдайда айналысатын азаматтық қызметшілердің айлықақыларымен және мөлшерлемелерімен салыстырғанда жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
