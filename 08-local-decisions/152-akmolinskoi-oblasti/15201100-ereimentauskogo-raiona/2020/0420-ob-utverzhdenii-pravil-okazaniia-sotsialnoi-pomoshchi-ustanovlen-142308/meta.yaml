  title:
    rus: О внесении изменения в решение Ерейментауского районного маслихата Акмолинской области от 20 апреля 2020 года № 6С-48/5-20 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Ерейментауском районе»
    kaz: Ақмола облысы Ерейментау аудандық мәслихатының 2020 жылғы 20 сәуірдегі № 6С-48/5-20 «Ерейментау ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
