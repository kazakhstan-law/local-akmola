requisite: Решение акима Ерейментауского района Акмолинской области от 23 декабря 2009 года № 8. Зарегистрировано Управлением юстиции Ерейментауского района Акмолинской области 18 января 2010 года № 1-9-141. Утратило силу - решением акима Ерейментауского района Акмолинской области от 8 декабря 2010 года № 7
title:
  rus: Об организации и обеспечении в январе-марте 2010 года приписки граждан мужского пола, которым в год приписки исполняется 17 лет, к призывному участку государственного учреждения "Отдел по делам обороны Ерейментауского района Акмолинской области"
  kaz: 2010 жылдың қаңтар-наурызында тіркеу өткізілетін жылы 17 жасқа толатын еркек жынысты азаматтарды "Ақмола облысы Ерейментау ауданының қорғаныс істері жөніндегі бөлімі" мемлекеттік мекемесінің шақыру учаскесіне тіркеуді ұйымдастыру және қамтамасыз ету туралы
