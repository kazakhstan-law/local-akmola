title:
  rus: Об утверждении Плана по управлению пастбищами и их использованию села Бозтал, села Новомарковка, Койтасского сельского округа, Еркиншиликского сельского округа, Тайбайского сельского округа, Тургайского сельского округа Ерейментауского района на 2021 год
  kaz: «Ерейментау ауданы Бозтал ауылының, Новомарковка ауылының, Қойтас ауылдық округінің, Еркіншілік ауылдық округінің, Тайбай ауылдық округінің, Торғай ауылдық округінің 2021 жылға арналған жайылымдарды басқару және оларды пайдалану жөніндегі жоспарларын бекіту туралы
