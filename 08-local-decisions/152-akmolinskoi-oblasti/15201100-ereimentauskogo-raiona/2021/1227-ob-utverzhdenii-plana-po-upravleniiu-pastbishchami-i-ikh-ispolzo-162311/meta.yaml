act_code: '162311'
requisite: Решение Ерейментауского районного маслихата Акмолинской области от 27 декабря 2021 года № 7С-21/2-21
title:
  rus: Об утверждении Плана по управлению пастбищами и их использованию села Аксуат, села Селеты, Бестогайского сельского округа, Акмырзинского сельского округа, Куншалганского сельского округа, сельского округа имени Олжабай батыра, Улентинского сельского округа Ерейментауского района на 2021 год
  kaz: Ерейментау ауданы Ақсуат ауылы, Сілеті ауылы, Бестоғай ауылдық округінің, Ақмырза ауылдық округінің, Күншалған ауылдық округінің, Олжабай батыр атындағы ауылдық округінің, Өлеңті ауылдық округінің 2021 жылға арналған жайылымдарды басқару және оларды пайдалану жөніндегі жоспарларын бекіту туралы
