  title:
    rus: О внесении изменения в решение Ерейментауского районного маслихата от 6 декабря 2023 года № 8С-10/3-23 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Ерейментауского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2024 год»
    kaz: Ерейментау аудандық мәслихатының 2023 жылғы 6 желтоқсандағы № 8С-10/3-23 «2024 жылға арналған Ерейментау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201715/rus
