  title:
    rus: О внесении изменений в решение Ерейментауского районного маслихата Акмолинской области от 22 августа 2017 года № 6С-14/6-17 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Ерейментауском районе»
    kaz: Ақмола облысы Ерейментау аудандық мәслихатының 2017 жылғы 22 тамыздағы № 6С-14/6-17 «Ерейментау ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
