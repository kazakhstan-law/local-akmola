act_code: '115003'
requisite: Решение Ерейментауского районного маслихата Акмолинской области от 22 августа 2017 года № 6С-14/6-17. Зарегистрировано Департаментом юстиции Акмолинской области 2 октября 2017 года № 6093
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Ерейментауском районе
  kaz: Ерейментау ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
