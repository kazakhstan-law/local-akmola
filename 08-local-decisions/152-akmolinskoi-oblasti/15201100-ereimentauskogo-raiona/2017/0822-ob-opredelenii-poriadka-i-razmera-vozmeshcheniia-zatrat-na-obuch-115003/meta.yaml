caused_by:
  code: '175476'
  requisite: Решение Ерейментауского районного маслихата Акмолинской области от 9 декабря 2022 года № 7С-37/3-22. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 декабря 2022 года № 31132
  title:
    rus: О внесении изменений и дополнения в решение Ерейментауского районного маслихата Акмолинской области от 22 августа 2017 года № 6С-14/6-17 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Ерейментауском районе»
    kaz: Ақмола облысы Ерейментау аудандық мәслихатының 2017 жылғы 22 тамыздағы № 6С-14/6-17 «Ерейментау ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
