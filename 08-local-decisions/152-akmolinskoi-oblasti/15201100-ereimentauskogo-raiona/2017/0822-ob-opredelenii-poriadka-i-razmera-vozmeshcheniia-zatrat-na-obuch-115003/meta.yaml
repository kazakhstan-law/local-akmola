    kaz: Ерейментау аудандық мәслихатының 2017 жылғы 22 тамыздағы № 6С-14/6-17 «Ерейментау ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
