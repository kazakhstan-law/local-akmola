requisite: Решение Ерейментауского районного маслихата Акмолинской области от 12 мая 2017 года № 6С-13/9-17. Зарегистрировано Департаментом юстиции Акмолинской области 19 июня 2017 года № 6000. Утратило силу решением Ерейментауского районного маслихата Акмолинской области от 30 июня 2022 года № 7С-29/2-22 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Ерейментауского района
  kaz: Ерейментау ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
