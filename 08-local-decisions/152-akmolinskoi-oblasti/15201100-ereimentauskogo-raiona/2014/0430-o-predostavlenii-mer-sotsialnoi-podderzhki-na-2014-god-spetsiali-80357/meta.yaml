act_code: '80357'
requisite: Решение Ерейментауского районного маслихата Акмолинской области от 30 апреля 2014 года № 5С-26/3-14. Зарегистрировано Департаментом юстиции Акмолинской области 23 мая 2014 года № 4210
title:
  rus: О предоставлении мер социальной поддержки на 2014 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Ерейментауского района
  kaz: Ерейментау ауданындағы ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2014 жылға әлеуметтік қолдау шараларын ұсыну туралы
