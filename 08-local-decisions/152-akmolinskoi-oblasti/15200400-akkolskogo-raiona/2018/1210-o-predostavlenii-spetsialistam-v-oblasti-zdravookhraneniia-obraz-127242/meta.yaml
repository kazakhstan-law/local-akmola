  title:
    rus: О внесении изменения в решение Аккольского районного маслихата от 10 декабря 2018 года № С 32-1 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Аккольского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2019 год»
    kaz: Ақкөл аудандық мәслихатының 2018 жылғы 10 желтоқсандағы № С 32-1 «2019 жылға арналған Ақкөл ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй алу немесе салу үшін көтерме жәрдемақы және әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
