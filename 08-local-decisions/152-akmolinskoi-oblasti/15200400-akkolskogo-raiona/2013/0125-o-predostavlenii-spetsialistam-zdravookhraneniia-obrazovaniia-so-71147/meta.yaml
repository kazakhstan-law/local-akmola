act_code: '71147'
requisite: Решение Аккольского районного маслихата Акмолинской области от 25 января 2013 года № С 13-1. Зарегистрировано Департаментом юстиции Акмолинской области 20 февраля 2013 года № 3655
title:
  rus: О предоставлении специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Аккольского района, социальной поддержки в виде подъемного пособия и бюджетного кредита на приобретение или строительство жилья в 2013 году
  kaz: Ақкөл ауданының селолық елді мекендеріне 2013 жылғы жұмыс істеуге және тұруға келген денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға немесе құрылысына бюджеттік несие түрінде әлеуметтік қолдау көрсету туралы
