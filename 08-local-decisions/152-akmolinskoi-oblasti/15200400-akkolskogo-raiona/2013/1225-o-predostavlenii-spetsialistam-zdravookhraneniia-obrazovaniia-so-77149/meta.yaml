act_code: '77149'
requisite: Решение Аккольского районного маслихата Акмолинской области от 25 декабря 2013 года № С 28-2. Зарегистрировано Департаментом юстиции Акмолинской области 24 января 2014 года № 3987. Утратило силу решением Аккольского районного маслиахата Акмолинской области от 21 августа 2014 года № С 39-3
title:
  rus: О предоставлении специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Аккольского района, социальной поддержки в виде подъемного пособия и бюджетного кредита на приобретение или строительства жилья в 2014 году
  kaz: Ақкөл ауданының ауылдық елді мекендерге 2014 жылы жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй сатып алу үшін немесе салу үшін бюджеттік кредит түрінде әлеуметтік қолдау көрсету туралы
