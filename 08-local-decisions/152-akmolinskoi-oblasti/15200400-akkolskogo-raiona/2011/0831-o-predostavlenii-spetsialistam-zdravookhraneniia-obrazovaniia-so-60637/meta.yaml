act_code: '60637'
requisite: Решение Аккольского районного маслихата Акмолинской области от 31 августа 2011 года № С 42-2. Зарегистрировано Управлением юстиции Аккольского района Акмолинской области 28 сентября 2011 года № 1-3-160
title:
  rus: О предоставлении специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Аккольского района, социальной поддержки в виде подъемного пособия и бюджетного кредита на приобретение жилья в 2011 году
  kaz: Ақкөл ауданы селолық елді мекендеріне 2011 жылы жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт салаларының мамандарына көтерме жәрдемақы түрінде әлеуметтік қолдау көрсету және тұрғын үй сатып алуға бюджеттік несие беру туралы
