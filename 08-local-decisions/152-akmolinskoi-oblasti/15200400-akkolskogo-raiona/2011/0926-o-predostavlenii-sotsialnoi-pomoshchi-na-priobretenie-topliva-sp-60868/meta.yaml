requisite: Решение Аккольского районного маслихата Акмолинской области от 26 сентября 2011 года № С 43-4. Зарегистрировано Управлением юстиции Аккольского района Акмолинской области 19 октября 2011 года № 1-3-162. Утратило силу решением Аккольского районного маслихата Акмолинской области от 5 мая 2016 года № С 3-2
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, образования, социального обеспечения, культуры и спорта, проживающим и работающим в сельских населенных пунктах Аккольского района
  kaz: Ақкөл ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін денсаулық сақтау, білім, әлеуметтік қамтамасыз ету, мәдениет және спорт мемлекеттік ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек көрсету туралы
