requisite: Решение Аккольского районного маслихата Акмолинской области от 22 августа 2017 года № С 14-3. Зарегистрировано Департаментом юстиции Акмолинской области 15 сентября 2017 года № 6076. Утратило силу решением Аккольского районного маслихата Акмолинской области от 21 апреля 2022 года № С 19-2 (вводится в действие по истечению десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Аккольского района
  kaz: Ақкөл ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
