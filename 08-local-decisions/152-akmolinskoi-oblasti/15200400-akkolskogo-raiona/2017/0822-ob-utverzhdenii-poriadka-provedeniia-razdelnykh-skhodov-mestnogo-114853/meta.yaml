  title:
    rus: О внесении изменения в решение Аккольского районного маслихата от 22 августа 2017 года № С 14-3 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Аккольского района»
    kaz: Ақкөл аудандық мәслихатының 2017 жылғы 22 тамыздағы № С 14-3 «Ақкөл ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгеріс енгізу туралы
