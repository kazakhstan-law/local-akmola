  title:
    rus: О внесении изменения в решение Аккольского районного маслихата от 22 декабря 2017 года № С 17-3 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Аккольского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2018 год»
    kaz: Ақкөл аудандық мәслихатының 2017 жылғы 22 желтоқсандағы № С 17-3 «2018 жылға арналған Ақкөл ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға тұрғын үй алу немесе салу үшін көтерме жәрдемақы және әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
