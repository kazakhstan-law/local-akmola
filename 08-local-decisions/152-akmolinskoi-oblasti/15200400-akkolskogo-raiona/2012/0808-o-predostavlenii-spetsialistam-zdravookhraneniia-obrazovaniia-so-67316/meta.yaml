act_code: '67316'
requisite: Решение Аккольского районного маслихата Акмолинской области от 8 августа 2012 года № С 8-2. Зарегистрировано Управлением юстиции Аккольского района Акмолинской области 27 августа 2012 года № 1-3-187. Утратило силу решением Аккольского районного маслихата Акмолинской области от 25 января 2013 года № С 13-1
title:
  rus: О предоставлении специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Аккольского района, социальной поддержки в виде подъемного пособия и бюджетного кредита на приобретение жилья в 2012 году
  kaz: Ақкөл ауданының селолық елді мекендеріне 2012 жылы жұмыс істеуге және тұруға келген денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария салаларының мамандарына көтерме жәрдемақы түрінде әлеуметтік қолдау көрсету және тұрғын үй сатып алуға бюджеттік несие беру туралы
