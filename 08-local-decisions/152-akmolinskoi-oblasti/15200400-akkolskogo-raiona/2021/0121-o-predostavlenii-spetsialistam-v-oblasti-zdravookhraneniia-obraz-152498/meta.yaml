act_code: '152498'
requisite: Решение Аккольского районного маслихата Акмолинской области от 21 января 2021 года № С 66-1. Зарегистрировано Департаментом юстиции Акмолинской области 28 января 2021 года № 8341
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов села, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Аккольского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2021 год
  kaz: 2021 жылға арналған Ақкөл ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауыл, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне тұрғын үй сатып алу немесе салу үшін көтерме жәрдемақы және әлеуметтік қолдау көрсету туралы
