act_code: '88435'
requisite: Решение Аккольского районного маслихата Акмолинской области от 25 февраля 2015 года № С 44-1. Зарегистрировано Департаментом юстиции Акмолинской области 20 марта 2015 года № 4707. Утратило силу решением Аккольского районного маслихата Акмолинской области от 1 июля 2015 года № С 48-9
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Аккольского района, социальной поддержки в виде подъемного пособия и бюджетного кредита на приобретение или строительства жилья в 2015 году
  kaz: Ақкөл ауданының ауылдық елді мекендеріне 2015 жылы жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит түрінде әлеуметтік қолдау көрсету туралы
