act_code: '97802'
requisite: Решение Аккольского районного маслихата Акмолинской области от 23 декабря 2015 года № С 52-4. Зарегистрировано Департаментом юстиции Акмолинской области 14 января 2016 года № 5210
title:
  rus: О предоставлении в 2016 году специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Аккольского района, социальной поддержки в виде подъемного пособия и бюджетного кредита на приобретение или строительства жилья
  kaz: Ақкөл ауданының ауылдық елді мекендеріне 2016 жылы жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит түрінде әлеуметтік қолдау көрсету туралы
