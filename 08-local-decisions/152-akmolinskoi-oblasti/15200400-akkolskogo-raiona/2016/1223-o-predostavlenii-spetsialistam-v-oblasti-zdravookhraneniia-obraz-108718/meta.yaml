requisite: Решение Аккольского районного маслихата Акмолинской области от 23 декабря 2016 года № С 8-3. Зарегистрировано Департаментом юстиции Акмолинской области 30 декабря 2016 года № 5662
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Аккольского района подъемного пособия и социальной поддержки для приобретения или строительства жилья в 2017 году
  kaz: 2017 жылға арналған Ақкөл ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
