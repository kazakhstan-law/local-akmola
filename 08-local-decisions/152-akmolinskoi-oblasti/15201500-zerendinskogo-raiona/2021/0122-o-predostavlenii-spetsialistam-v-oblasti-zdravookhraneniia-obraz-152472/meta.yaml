act_code: '152472'
requisite: Решение Зерендинского районного маслихата Акмолинской области от 22 января 2021 года № 2-10. Зарегистрировано Департаментом юстиции Акмолинской области 27 января 2021 года № 8339
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов села, поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Зерендинского района подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2021 год
  kaz: 2021 жылға арналған Зеренді ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауыл, кент, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне, көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
