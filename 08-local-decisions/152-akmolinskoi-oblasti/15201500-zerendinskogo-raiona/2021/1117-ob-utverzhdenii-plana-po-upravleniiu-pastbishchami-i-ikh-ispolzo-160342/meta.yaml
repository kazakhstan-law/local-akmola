act_code: '160342'
requisite: Решение Зерендинского районного маслихата Акмолинской области от 17 ноября 2021 года № 12-73
title:
  rus: Об утверждении Плана по управлению пастбищами и их использованию сельских округов имени Канай би, имени Сакена Сейфуллина, сельского округа Малика Габдуллина, Булакского, Байтерекского, Викторовского, Исаковского, Кызылегисского, Кызылсаянского, Конысбайского, Приреченского, Садового, Сарыозекского, Симферопольского, Троицкого сельских округов Зерендинского района на 2021-2022 годы
  kaz: 2021-2022 жылдарға арналған жайылымдарды басқару және олардың пайдалану бойынша Зеренді ауданының Қанай би атындағы, Сәкен Сейфуллин атындағы ауылдық округтері, Мәлік Ғабдуллин ауылдық округі, Бұлақ, Бәйтерек, Викторовка, Исаковка, Қызылегіс, Қызылсая, Қонысбай, Приречное, Садовый, Сарыөзек, Симферополь, Троицкое ауылдық округтерінде жоспарды бекіту туралы
