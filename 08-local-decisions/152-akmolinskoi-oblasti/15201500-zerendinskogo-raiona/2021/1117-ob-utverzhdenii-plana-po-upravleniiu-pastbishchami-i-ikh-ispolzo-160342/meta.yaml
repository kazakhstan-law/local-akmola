  title:
    rus: О внесении изменения в решение маслихата Зерендинского района от 17 ноября 2021 года № 12-73 «Об утверждении Плана по управлению пастбищами и их использованию сельских округов имени Канай би, имени Сакена Сейфуллина, сельского округа Малика Габдуллина, Булакского, Байтерекского, Викторовского, Исаковского, Кызылегисского, Кызылсаянского, Конысбайского, Приреченского, Садового, Сарыозекского, Симферопольского, Троицкого сельских округов Зерендинского района на 2021-2022 годы»
    kaz: Зеренді аудандық мәслихатының 2021 жылғы 17 қарашадағы № 12-73 «2021-2022 жылдарға арналған жайылымдарды басқару және олардың пайдалану бойынша Зеренді ауданының Қанай би атындағы, Сәкен Сейфуллин атындағы ауылдық округтері, Мәлік Ғабдуллин ауылдық округі, Бұлақ, Бәйтерек, Викторовка, Исаковка, Қызылегіс, Қызылсая, Қонысбай, Приреченое, Садовый,Сарыөзек, Симферополь, Троицкое ауылдық округтерінде жоспарды бекіту туралы» шешіміне өзгеріс енгізу туралы
