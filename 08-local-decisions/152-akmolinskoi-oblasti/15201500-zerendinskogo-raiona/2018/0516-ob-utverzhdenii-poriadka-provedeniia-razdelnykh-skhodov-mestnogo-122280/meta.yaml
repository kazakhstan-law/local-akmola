  title:
    rus: О внесении изменения в решение Зерендинского районного маслихата от 16 мая 2018 года № 23-187 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Зерендинского района»
    kaz: Зеренді аудандық мәслихаттың 2018 жылғы 16 мамырдағы № 23-187 «Зеренді ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгеріс енгізу туралы
