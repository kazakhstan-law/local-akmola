  kaz: Зеренді аудандық мәслихаттың 2015 жылғы 30 қарашадағы № 42-353 «Ақмола облысы Зеренді аудандық мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметіне жыл сайынғы бағалау әдістемесін бекіту туралы» шешімінің күшін жою туралы
