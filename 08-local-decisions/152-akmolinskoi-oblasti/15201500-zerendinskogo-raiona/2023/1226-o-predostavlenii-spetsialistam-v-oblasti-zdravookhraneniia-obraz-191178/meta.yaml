  requisite: Решение Зерендинского районного маслихата Акмолинской области от 27 ноября 2024 года № 23-168
  title:
    rus: О внесении изменения в решение Зерендинского районного маслихата от 26 декабря 2023 года № 13-87 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов села, поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Зерендинского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2024 год»
    kaz: Зеренді аудандық маслихатының 2023 жылғы 26 желтоқсандағы № 13-87 «2024 жылға арналған Зеренді ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауыл, кент, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне, көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/203238/rus
