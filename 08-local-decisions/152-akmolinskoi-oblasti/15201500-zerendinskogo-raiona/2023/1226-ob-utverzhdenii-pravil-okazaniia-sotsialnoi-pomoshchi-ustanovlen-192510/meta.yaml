  title:
    rus: О внесении дополнений в решение Зерендинского районного маслихата от 26 декабря 2023 года № 13-95 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Зерендинском районе»
    kaz: Зеренді аудандық мәслихатының 2023 жылғы 26 желтоқсандағы № 13-95 «Зеренді ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерiн белгiлеудің және мұқтаж азаматтардың жекелеген санаттарының тiзбесiн айқындаудың қағидаларын бекiту туралы» шешіміне толықтырулар енгізу туралы
