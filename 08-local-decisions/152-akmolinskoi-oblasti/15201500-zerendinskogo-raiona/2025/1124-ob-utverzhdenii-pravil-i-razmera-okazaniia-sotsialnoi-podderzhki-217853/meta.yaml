act_code: '217853'
requisite: Решение Зерендинского районного маслихата Акмолинской области от 24 ноября 2025 года № 36-275. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 декабря 2025 года № 37511
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Зерендинского района
  kaz: Зеренді ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету мөлшері және қағидаларын бекіту туралы
