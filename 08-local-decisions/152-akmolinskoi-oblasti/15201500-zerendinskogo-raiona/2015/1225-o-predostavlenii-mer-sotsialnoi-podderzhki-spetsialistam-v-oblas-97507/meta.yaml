requisite: Решение Зерендинского районного маслихата Акмолинской области от 25 декабря 2015 года № 45-368. Зарегистрировано Департаментом юстиции Акмолинской области 12 января 2016 года № 5189
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Зерендинского района на 2016 год
  kaz: 2016 жылға арналған Зеренді ауданның ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
