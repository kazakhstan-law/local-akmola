  title:
    rus: О внесении изменений в решение Зерендинского районного маслихата от 6 марта 2013 года № 12-109 «Об утверждении схемы зонирования земель и процентов повышения (понижения) базовых ставок земельного налога Зерендинского района»
    kaz: Зеренді аудандық мәслихатының 2013 жылғы 6 наурыздағы № 12-109 «Зеренді ауданының жерлерін аймақтарға бөлу схемасын және жер салығының базалық ставкаларын жоғарылату (төмендету) пайыздарын бекіту туралы» шешіміне өзгерістер енгізу туралы
