  title:
    rus: О внесении изменений в решение Зерендинского районного маслихата от 6 марта 2013 года № 12-110 «Об утверждении границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки на земли сельских населенных пунктов для целей налогооблажения в Зерендинском районе»
    kaz: Зеренді аудандық мәслихаттың 2013 жылғы 6 наурыздағы № 12-110 «Зеренді ауданында салық салу мақсаты үшін ауылдық елді мекендердің жерлерге бағалау аймақтары шекараларының және жер телімдері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы» шешіміне өзгерістер енгізу туралы
