    kaz: Зеренді аудандық мәслихаттың 2013 жылғы 6 наурыздағы № 12-110 «Зеренді ауданында салық салу мақсаты үшін ауылдық елді мекендердің жерлерге бағалау аймақтары шекараларының және жер телімдері үшін төлемақының базалық ставкаларына түзету коэффиценттерін бекіту туралы» шешіміне өзгеріс енгізу туралы
