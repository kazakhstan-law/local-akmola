act_code: '110009'
requisite: Решение Зерендинского районного маслихата Акмолинской области от 6 февраля 2017 года № 10-81. Зарегистрировано Департаментом юстиции Акмолинской области 23 февраля 2017 года № 5767
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Зерендинского района подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2017 год
  kaz: 2017 жылға арналған Зеренді ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
