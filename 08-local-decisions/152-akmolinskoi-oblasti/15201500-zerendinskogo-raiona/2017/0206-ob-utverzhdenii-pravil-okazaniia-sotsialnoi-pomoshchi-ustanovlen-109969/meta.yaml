  title:
    rus: О внесении изменений в решение Зерендинского районного маслихата от 6 февраля 2017 года № 10-83 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Зерендинском районе»
    kaz: Зеренді аудандық мәслихатының 2017 жылғы 6 ақпандағы № 10-83 «Зеренді ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
