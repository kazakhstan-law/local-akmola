act_code: '117579'
requisite: Решение Зерендинского районного маслихата Акмолинской области от 21 декабря 2017 года № 17-135. Зарегистрировано Департаментом юстиции Акмолинской области 5 января 2018 года № 6284
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Зерендинского района подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2018 год
  kaz: 2018 жылға арналған Зеренді ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
