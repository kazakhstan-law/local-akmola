requisite: Решение акима Зерендинского района Акмолинской области от 29 ноября 2010 года № 07. Зарегистрировано Управлением юстиции Зерендинского района Акмолинской области 6 декабря 2010 года № 1-14-146. Утратило силу решением акима Зерендинского района Акмолинской области от 29 ноября 2011 года № 08
title:
  rus: Об организации и обеспечении в январе-марте 2011 года приписки граждан мужского пола, которым в год приписки исполняется семнадцать лет к призывному участку государственного учреждения "Отдел по делам обороны Зерендинского района Акмолинской области"
  kaz: 2011 жылдың қаңтар-наурызында тіркеуден өткізілетін жылы он жеті жасқа толатын еркек жынысты азаматтарды "Ақмола облысы Зеренді ауданының Қорғаныс істері жөніндегі бөлімі" мемлекеттік мекемесінің шақырту учаскесіне тіркеуді ұйымдастыру және қамтамасыз ету туралы
