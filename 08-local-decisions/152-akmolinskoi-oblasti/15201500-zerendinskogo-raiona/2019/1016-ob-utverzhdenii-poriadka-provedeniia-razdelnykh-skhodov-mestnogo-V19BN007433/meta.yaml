  title:
    rus: О признании утратившим силу решения Зерендинского районного маслихата от 16 октября 2019 года № 44-295 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Зерендинского района»
    kaz: Зеренді аудандық мәслихатының 2019 жылғы 16 қазандағы № 44-295 «Зеренді ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешімінің күші жойылды деп тану туралы
