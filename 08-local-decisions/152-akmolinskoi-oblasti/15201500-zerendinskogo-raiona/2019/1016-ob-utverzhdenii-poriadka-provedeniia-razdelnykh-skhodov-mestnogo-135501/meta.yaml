act_code: '135501'
requisite: Решение Зерендинского районного маслихата Акмолинской области от 16 октября 2019 года № 44-295. Зарегистрировано Департаментом юстиции Акмолинской области 24 октября 2019 года № 7433. Утратило силу решением Зерендинского районного маслихата Акмолинской области от 30 апреля 2021 года № 6-32 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Зерендинского района
  kaz: Зеренді ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
