act_code: '131236'
requisite: Решение Зерендинского районного маслихата Акмолинской области от 26 апреля 2019 года № 36-255. Зарегистрировано Департаментом юстиции Акмолинской области 3 мая 2019 года № 7162
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Зерендинского района подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2019 год
  kaz: 2019 жылға арналған Зеренді ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
