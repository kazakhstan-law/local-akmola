    rus: О внесении изменения в решение Зерендинского районного маслихата от 8 октября 2014 года № 31-241 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Зерендинском районе»
