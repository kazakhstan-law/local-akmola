requisite: Решение Атбасарского районного маслихата Акмолинской области от 25 декабря 2013 года № 5С 21/4. Зарегистрировано Департаментом юстиции Акмолинской области 23 января 2014 года № 3977
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Атбасарского района на 2014 год
  kaz: 2014 жылға арналған Атбасар ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына әлеуметтік қолдау шараларын ұсыну туралы
