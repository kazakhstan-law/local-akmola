  title:
    rus: О внесении изменений в решение Атбасарского районного маслихата от 25 декабря 2013 года № 5С 21/4 "О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Атбасарского района на 2014 год"
    kaz: Атбасар аудандық мәслихатының 2013 жылғы 25 желтоқсандағы № 5С 21/4 "2014 жылға арналған Атбасар ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы" шешіміне өзгерістер енгізу туралы
