    kaz: Атбасар аудандық мәслихатының 2023 жылғы 17 қарашадағы № 8С 9/4 «Aтбасар ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс пен толықтыру енгізу туралы
