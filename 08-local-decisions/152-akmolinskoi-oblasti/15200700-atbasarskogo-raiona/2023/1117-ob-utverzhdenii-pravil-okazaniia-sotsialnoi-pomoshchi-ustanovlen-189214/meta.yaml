  title:
    rus: О внесении изменений и дополнения в решение Атбасарского районного маслихата от 17 ноября 2023 года № 8С 9/4 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Атбасарского района»
    kaz: Атбасар аудандық мәслихатының 2023 жылғы 17 қарашадағы № 8С 9/4 «Aтбасар ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер және толықтыру енгізу туралы
