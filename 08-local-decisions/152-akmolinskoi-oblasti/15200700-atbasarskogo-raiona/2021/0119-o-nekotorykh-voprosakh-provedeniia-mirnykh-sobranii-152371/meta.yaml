  requisite: Решение Атбасарского районного маслихата Акмолинской области от 10 ноября 2021 года № 7С 9/7. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 ноября 2021 года № 25269
  title:
    rus: О внесении изменений в решение Атбасарского районного маслихата от 19 января 2021 года № 7С 2/2 «Об определении специализированных мест для организации и проведения мирных собраний, порядка использования специализированных мест для организации и проведения мирных собраний, нормы их предельной заполняемости, а также требования к материально-техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний и границ прилегающих территорий, в которых запрещено проведение пикетирования в Атбасарском районе
    kaz: Атбасар аудандық мәслихатының 2021 жылғы 19 қаңтардағы № 7С 2/2 «Атбасар ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды және пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/160438/rus
