requisite: Решение Атбасарского районного маслихата Акмолинской области от 23 декабря 2015 года № 5С 35/3. Зарегистрировано Департаментом юстиции Акмолинской области 31 декабря 2015 года № 5166
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Атбасарского района на 2016 год
  kaz: 2016 жылға арналған Атбасар ауданының ауылдық елді мекендерге жұмыс істеу  және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына әлеуметтік қолдау шараларын ұсыну туралы
