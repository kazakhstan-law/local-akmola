requisite: Решение Атбасарского районного маслихата Акмолинской области от 21 декабря 2012 года № 5С 12/3. Зарегистрировано Департаментом юстиции Акмолинской области 11 января 2013 года № 3600
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Атбасарского района на 2013 год
  kaz: 2013 жылға арналған Атбасар ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы
