  title:
    rus: О внесении изменений в решение Атбасарского районного маслихата № 6С 9/10 от 22 февраля 2017 года «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Атбасарского района»
    kaz: Атбасар аудандық мәслихатының 2017 жылғы 22 ақпандағы № 6С 9/10 «Атбасар ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
