  requisite: Решение Атбасарского районного маслихата Акмолинской области от 17 ноября 2022 года № 7С 25/16. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 ноября 2022 года № 30700. Утратило силу решением Атбасарского районного маслихата Акмолинской области от 17 ноября 2023 года № 8С 9/4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в решение маслихата Атбасарского района от 22 февраля 2017 года № 6С 9/10 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Атбасарского района»
    kaz: Атбасар аудандық мәслихатының 2017 жылғы 22 ақпандағы № 6С 9/10 «Атбасар ауданының  әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
