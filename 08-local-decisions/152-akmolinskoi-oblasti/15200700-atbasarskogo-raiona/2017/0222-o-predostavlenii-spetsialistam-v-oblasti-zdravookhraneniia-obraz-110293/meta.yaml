act_code: '110293'
requisite: Решение Атбасарского районного маслихата Акмолинской области от 22 февраля 2017 года № 6С 9/5. Зарегистрировано Департаментом юстиции Акмолинской области 6 марта 2017 года № 5806
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Атбасарского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2017 год
  kaz: 2017 жылға арналған Атбасар ауданының ауылдық елді мекендерге жұмыс iстеу және тұру үшін келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
