requisite: Решение Атбасарского районного маслихата Акмолинской области от 22 февраля 2017 года № 6С 9/7. Зарегистрировано Департаментом юстиции Акмолинской области 28 марта 2017 года № 5852. Утратило силу решением Атбасарского районного маслихата Акмолинской области от 21 февраля 2018 года № 6С 18/6
title:
  rus: Об установлении категорий автостоянок (паркингов) и увеличении не более чем в десять раз базовые ставки налога на земли, выделенные под автостоянки (паркинги) в Атбасарском районе
  kaz: Атбасар ауданында автотұрақтар (паркингтер) санаттарын белгілеу және он еседен артық болмайтын автотұрақтар (паркингтер) үшін бөлінген жерлерге салықтың базалық мөлшерлемелерін ұлғайту туралы
