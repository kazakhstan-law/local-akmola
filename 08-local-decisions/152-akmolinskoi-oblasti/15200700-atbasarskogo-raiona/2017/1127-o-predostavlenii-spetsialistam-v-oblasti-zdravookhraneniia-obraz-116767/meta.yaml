  title:
    rus: О внесении изменения в решение Атбасарского районного маслихата от 27 ноября 2017 года № 6С 14/5 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Атбасарского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2018 год»
    kaz: Атбасар аудандық мәслихатының 2017 жылғы 27 қарашадағы № 6С 14/5 «2018 жылға арналған Атбасар ауданының ауылдық елді мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
