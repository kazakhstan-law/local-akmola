requisite: Решение Атбасарского районного маслихата Акмолинской области от 27 ноября 2017 года № 6С 14/5. Зарегистрировано Департаментом юстиции Акмолинской области 12 декабря 2017 года № 6215
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Атбасарского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2018 год
  kaz: 2018 жылға арналған Атбасар ауданының ауылдық елді мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
