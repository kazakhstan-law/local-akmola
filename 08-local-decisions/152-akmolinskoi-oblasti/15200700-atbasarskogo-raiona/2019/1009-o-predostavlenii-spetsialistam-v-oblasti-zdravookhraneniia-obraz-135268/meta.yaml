act_code: '135268'
requisite: Решение Атбасарского районного маслихата Акмолинской области от 9 октября 2019 года № 6С 34/3. Зарегистрировано Департаментом юстиции Акмолинской области 14 октября 2019 года № 7420. Утратило силу решением Атбасарского районного маслихата Акмолинской области от 28 октября 2020 года № 6С 44/3 (вводится в действие со дня официального опубликования)
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Атбасарского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2020 год
  kaz: 2020 жылға арналған Атбасар ауданының ауылдық елді мекендерге жұмыс істеуге  және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
