requisite: Решение Атбасарского районного маслихата Акмолинской области от 22 июня 2016 года № 6С 3/8. Зарегистрировано Департаментом юстиции Акмолинской области 25 июля 2016 года № 5473. Утратило силу решением Атбасарского районного маслихата Акмолинской области от 9 февраля 2018 года № 6С 17/8
title:
  rus: О повышении базовых ставок земельного налога и ставки единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Атбасарского района
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Атбасар ауданының пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін және бірыңғай жер салығының мөлшерлемесін жоғарылату туралы
