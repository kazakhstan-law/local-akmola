  title:
    rus: О внесении изменения в решение Атбасарского районного маслихата от 24 декабря 2014 года № 5С 30/4 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Атбасарского района на 2015 год»
    kaz: Атбасар аудандық мәслихатының 2014 жылғы 24 желтоқсандағы № 5С 30/4 «2015 жылға арналған Атбасар ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына әлеуметтік қолдау шараларын ұсыну туралы» шешіміне өзгеріс енгізу туралы
