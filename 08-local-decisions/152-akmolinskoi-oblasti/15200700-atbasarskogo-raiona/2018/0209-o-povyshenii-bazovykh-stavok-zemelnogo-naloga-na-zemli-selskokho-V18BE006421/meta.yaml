    kaz: Атбасар аудандық мәслихатының 2018 жылғы 9 ақпандағы № 6С 17/8 «Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын Атбасар ауданының ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін арттыру туралы» шешімінің күші жойылды деп тану туралы
