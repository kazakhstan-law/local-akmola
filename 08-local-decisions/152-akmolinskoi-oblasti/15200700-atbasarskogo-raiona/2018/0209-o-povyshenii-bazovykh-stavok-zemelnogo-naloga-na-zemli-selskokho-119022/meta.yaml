requisite: Решение Атбасарского районного маслихата Акмолинской области от 9 февраля 2018 года № 6С 17/8. Зарегистрировано Департаментом юстиции Акмолинской области 21 февраля 2018 года № 6421. Утратило силу решением Атбасарского районного маслихата Акмолинской области от 30 марта 2022 года № 7С 16/5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
