requisite: Решение Атбасарского районного маслихата Акмолинской области от 28 ноября 2018 года № 6С 25/3. Зарегистрировано Департаментом юстиции Акмолинской области 5 декабря 2018 года № 6892
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Атбасарского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2019 год
  kaz: 2019 жылға арналған Атбасар ауданының ауылдық елді мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
