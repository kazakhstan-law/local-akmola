requisite: Решение Атбасарского районного маслихата Акмолинской области от 11 апреля 2018 года № 6С 19/8. Зарегистрировано Департаментом юстиции Акмолинской области 2 мая 2018 года № 6595. Утратило силу решением Атбасарского районного маслихата Акмолинской области от 3 августа 2022 года № 7С 21/3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Атбасарского района
  kaz: Атбасар ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
