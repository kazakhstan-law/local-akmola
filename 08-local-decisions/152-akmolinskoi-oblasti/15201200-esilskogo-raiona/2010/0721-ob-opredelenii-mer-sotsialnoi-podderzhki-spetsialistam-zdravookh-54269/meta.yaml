requisite: Решение Есильского районного маслихата Акмолинской области от 21 июля 2010 года № 27/10. Зарегистрировано Управлением юстиции Есильского района Акмолинской области 27 августа 2010 года № 1-11-124. Утратило силу - решением Есильского районного маслихата Акмолинской области от 29 марта 2011 года № 36/3
title:
  rus: Об определении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Есильского района на 2010 год
  kaz: Есіл ауданының ауылдық елді мекендеріне 2010 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау шараларын  белгілеу туралы
