act_code: '190590'
requisite: Решение Есильского районного маслихата Акмолинской области от 20 декабря 2023 года № 8С-12/3
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Есильского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2024 год
  kaz: 2024 жылға арналған Есіл ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
