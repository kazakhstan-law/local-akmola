  requisite: Решение Есильского районного маслихата Акмолинской области от 23 октября 2024 года № 8С-28/4
  title:
    rus: О внесении изменения в решение Есильского районного маслихата от 20 декабря 2023 года №8С-12/3 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Есильского района подъемного пособия и бюджетного кредита для приобретение или строительство жилья на 2024 год»
    kaz: Есіл аудандық мәслихатының 2023 жылғы 20 желтоқсандағы №8С-12/3 «2024 жылға арналған Есіл ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201938/rus
