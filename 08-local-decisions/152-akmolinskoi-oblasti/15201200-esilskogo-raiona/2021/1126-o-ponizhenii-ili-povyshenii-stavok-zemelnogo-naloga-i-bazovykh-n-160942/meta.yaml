  title:
    rus: О внесении изменений в решение Есильского районного маслихата от 26 ноября 2021 года № 15/3 «О повышении (понижении) ставок земельного налога и базовых налоговых ставок на земли, занятые жилищным фондом, в том числе строениями и сооружениями Есильского района»
    kaz: Есіл аудандық мәслихатының 2021 жылғы 26 қарашадағы № 15/3 «Есіл ауданының жер салығының мөлшерлемелерін және тұрғын үй қоры, соның ішінде оның жанындағы құрылыстар мен құрылысжайлар алып жатқан жерлерге базалық салықтық мөлшерлемелерін жоғарылату (төмендету) туралы» шешіміне өзгерістер енгізу туралы
