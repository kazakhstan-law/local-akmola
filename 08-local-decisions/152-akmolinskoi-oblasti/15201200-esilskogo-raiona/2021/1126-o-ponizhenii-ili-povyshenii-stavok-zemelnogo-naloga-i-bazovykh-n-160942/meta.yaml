title:
  rus: О понижении или повышении ставок земельного налога и базовых налоговых ставок на земли, занятые жилищным фондом, в том числе строениями и сооружениями при нем по Есильскому району
  kaz: Есіл ауданы бойынша тұрғын үй қоры, соның ішінде оның жанындағы құрылыстар мен құрылысжайлар алып жатқан жерлерге жер салығының мөлшерлемелерін және жерлерге базалық салықтық мөлшерлемелерін азайту немесе арттыру туралы
