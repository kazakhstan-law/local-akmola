act_code: '86124'
requisite: Решение Есильского районного маслихата Акмолинской области от 25 декабря 2014 года № 36/9. Зарегистрировано Департаментом юстиции Акмолинской области 23 января 2015 года № 4609. Утратило силу решением Есильского районного маслихата Акмолинской области от 28 апреля 2015 года № 42/5
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Есильского района на 2015 год
  kaz: 2015 жылы Есіл ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
