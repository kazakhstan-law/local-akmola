act_code: '86034'
requisite: ''
title:
  rus: 'О предоставлении в 2015 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Есильского района '
  kaz: Есіл ауданының ауылдық елді мекендеріне жұмыс істеу және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына тұрғын үй сатып алу немесе салу үшін 2015 жылы көтерме жәрдемақы және әлеуметтік қолдау ұсыну туралы
