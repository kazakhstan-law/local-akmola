act_code: '116762'
requisite: Решение Есильского районного маслихата Акмолинской области от 21 ноября 2017 года № 20/2. Зарегистрировано Департаментом юстиции Акмолинской области 13 декабря 2017 года № 6220
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Есильского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2018 год
  kaz: 2018 жылға арналған Есіл ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
