  title:
    rus: О внесении изменения в решение Есильского районного маслихата от 22 февраля 2017 года № 12/5 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Есильского района»
    kaz: Есіл аудандық мәслихатының 2017 жылғы 22 ақпандағы № 12/5 «Есіл ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгеріс енгізу туралы
