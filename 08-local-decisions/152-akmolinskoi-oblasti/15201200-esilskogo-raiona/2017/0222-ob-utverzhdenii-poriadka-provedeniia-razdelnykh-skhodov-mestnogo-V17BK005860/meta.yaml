requisite: Решение Есильского районного маслихата Акмолинской области от 22 февраля 2017 года № 12/5. Зарегистрировано Департаментом юстиции Акмолинской области 30 марта 2017 года № 5860. Утратило силу решением Есильского районного маслихата Акмолинской области от 29 апреля 2022 года № 23/4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Есильского района
  kaz: Есіл ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
