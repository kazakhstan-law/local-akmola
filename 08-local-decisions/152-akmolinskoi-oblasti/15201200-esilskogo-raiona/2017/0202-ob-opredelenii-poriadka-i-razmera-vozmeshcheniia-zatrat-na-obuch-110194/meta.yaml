requisite: Решение Есильского районного маслихата Акмолинской области от 2 февраля 2017 года № 11/3. Зарегистрировано Департаментом юстиции Акмолинской области 2 марта 2017 года № 5793. Утратило силу решением Есильского районного маслихата Акмолинской области от 29 ноября 2023 года № 8С-11/4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
