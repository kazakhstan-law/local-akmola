act_code: '216906'
requisite: Решение Есильского районного маслихата Акмолинской области от 13 ноября 2025 года № 8С-39/4
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Есильского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2026 год
  kaz: 2026 жылға арналған Есіл ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кент, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
