act_code: '167674'
requisite: Решение Есильского районного маслихата Акмолинской области от 29 апреля 2022 года № 23/3. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 мая 2022 года № 28037
title:
  rus: Об установлении специалистам в области социального обеспечения, культуры, спорта, являющимся гражданскими служащими и работающим в сельской местности Есильского района, повышенных на двадцать пять процентов должностных окладов и тарифных ставок по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметшілер болып табылатын және Есіл ауданының ауылдық жерінде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет, спорт саласындағы мамандарға, қызметтің осы түрлерімен қалалық жағдайда айналысатын азаматтық қызметшілердің айлықақыларымен және мөлшерлемелерімен салыстырғанда жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
