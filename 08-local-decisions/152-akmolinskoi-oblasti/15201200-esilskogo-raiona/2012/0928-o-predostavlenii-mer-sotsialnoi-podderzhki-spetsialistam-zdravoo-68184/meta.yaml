requisite: Решение Есильского районного маслихата Акмолинской области от 28 сентября 2012 года № 10/4. Зарегистрировано Департаментом юстиции Акмолинской области 19 октября 2012 года № 3472. Утратило силу решением Есильского районного маслихата Акмолинской области от 29 января 2013 года № 15/3
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Есильского района на 2012 год
  kaz: 2012 жылы Есіл ауданының селолық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы
