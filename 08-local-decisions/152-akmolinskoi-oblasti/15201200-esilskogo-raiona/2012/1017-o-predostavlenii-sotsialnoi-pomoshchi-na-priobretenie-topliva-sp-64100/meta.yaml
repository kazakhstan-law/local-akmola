requisite: Решение Есильского районного маслихата Акмолинской области от 17 октября 2012 года № 11/4. Зарегистрировано Департаментом юстиции Акмолинской области 2 ноября 2012 года № 3479. Утратило силу решением Есильского районного маслихата Акмолинской области от 27 февраля 2013 года № 16/13
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельских населенных пунктах Есильского района
  kaz: Есіл ауданының селолық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
