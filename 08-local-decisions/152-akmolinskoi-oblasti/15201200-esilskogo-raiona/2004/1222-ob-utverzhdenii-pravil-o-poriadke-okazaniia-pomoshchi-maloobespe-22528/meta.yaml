requisite: Решение Есильского районного маслихата Акмолинской области от 22 декабря 2004 года № 13/5. Зарегистрировано Департаментом юстиции Акмолинской области 28 декабря 2004 года № 2953. Утратило силу решением Есильского районного маслихата Акмолинской области от 27 ноября 2007 года № 4/3
title:
  rus: Об утверждении Правил «О порядке оказания помощи малообеспеченным семьям (гражданам) на оплату содержания жилища (кроме содержания индивидуального жилого дома) потребления коммунальных услуг и телефонной абонентской платы»
  kaz: «Қамтылуы аз жанұяларға (азаматтарға) тұрғын үйін ұстауға (жеке үйлерді ұстаудан басқа), коммуналдық қызмет тұтыну және телефонның абоненттік ақысына көмек көрсету реті туралы» Ережені бекіту туралы»
