requisite: Решение Есильского районного маслихата Акмолинской области от 28 декабря 2009 года № 22/6. Зарегистрировано Управлением юстиции Есильского района Акмолинской области 8 февраля 2010 года № 1-11-113. Утратило силу - решением Есильского районного маслихата Акмолинской области от 17 октября 2012 года № 11/4
title:
  rus: Об оказании социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельских населенных пунктах Есильского района
  kaz: Есіл ауданы ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек көрсету туралы
