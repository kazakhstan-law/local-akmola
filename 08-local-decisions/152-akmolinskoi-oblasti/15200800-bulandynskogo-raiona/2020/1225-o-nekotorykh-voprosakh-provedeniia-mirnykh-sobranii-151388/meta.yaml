  requisite: Решение Буландынского районного маслихата Акмолинской области от 27 августа 2021 года № 7С-9/4. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 сентября 2021 года № 24328
  title:
    rus: О внесении изменений в решение Буландынского районного маслихата от 25 декабря 2020 года № 6С-67/3 «Об определении специализированных мест для организации и проведения мирных собраний, порядка использования специализированных мест для организации и проведения мирных собраний, нормы их предельной заполняемости, а также требования к материально-техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний, границ прилегающих территорий, в которых запрещено проведение пикетирования в Буландынском районе»
    kaz: Бұланды аудандық мәслихатының 2020 жылғы 25 желтоқсандағы № 6С-67/3 «Бұланды ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды және пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/158561/rus
