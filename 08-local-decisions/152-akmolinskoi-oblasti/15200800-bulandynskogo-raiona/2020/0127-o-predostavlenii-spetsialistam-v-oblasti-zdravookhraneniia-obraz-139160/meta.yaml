requisite: Решение Буландынского районного маслихата Акмолинской области от 27 января 2020 года № 6С-51/1. Зарегистрировано Департаментом юстиции Акмолинской области 30 января 2020 года № 7661. Утратило силу решением Буландынского районного маслихата Акмолинской области от 26 октября 2020 года № 6С-63/2 (вводится в действие со дня официального опубликования)
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Буландынского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2020 год
  kaz: 2020 жылға арналған Бұланды ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
