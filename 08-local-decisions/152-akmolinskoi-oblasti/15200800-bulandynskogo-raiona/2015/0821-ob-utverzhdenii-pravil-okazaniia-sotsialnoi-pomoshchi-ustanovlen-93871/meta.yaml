  title:
    rus: О внесении изменений и дополнений в решение Буландынского районного маслихата от 21 августа 2015 года № 5С-40/3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Буландынского района»
    kaz: Бұланды аудандық мәслихатының 2015 жылғы 21 тамыздағы № 5С-40/3 «Бұланды ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
