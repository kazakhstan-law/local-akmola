title:
  rus: О повышении базовых ставок земельного налога и ставок единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Буландынского района
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Бұланды ауданының пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлеріне жер салығының базалық мөлшерлемесін және бірыңғай жер салығының мөлшерлемесін жоғарылату туралы
