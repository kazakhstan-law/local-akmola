  title:
    rus: О внесении изменения в решение Буландынского районного маслихата от 25 декабря 2018 года № 6С-34/2 «О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Буландынского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2019 год»
    kaz: Бұланды аудандық мәслихатының 2018 жылғы 25 желтоқсандағы № 6С-34/2 «2019 жылға арналған Бұланды ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
