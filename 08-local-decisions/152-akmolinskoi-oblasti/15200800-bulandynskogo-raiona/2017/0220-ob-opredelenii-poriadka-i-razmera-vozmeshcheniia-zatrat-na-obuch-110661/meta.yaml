    kaz: Бұланды аудандық мәслихатының 2017 жылғы 20 ақпандағы № 6С-9/9 «Бұланды ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарды өтеу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
