requisite: Решение Буландынского районного маслихата Акмолинской области от 20 июня 2017 года № 6С-12/5. Зарегистрировано Департаментом юстиции Акмолинской области 25 июля 2017 года № 6027. Утратило силу решением Буландынского районного маслихата Акмолинской области от 18 апреля 2022 года № 7С-20/1 (вводится в действие по истечении десяти календарных дней после дня официального опубликования)
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Буландынского района
  kaz: Бұланды ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
