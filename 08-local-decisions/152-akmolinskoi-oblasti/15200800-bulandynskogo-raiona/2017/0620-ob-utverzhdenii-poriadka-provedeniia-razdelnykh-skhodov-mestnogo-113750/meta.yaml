  title:
    rus: О внесении изменения в решение Буландынского районного маслихата от 20 июня 2017 года № 6С-12/5 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Буландынского района»
    kaz: Бұланды аудандық мәслихатының 2017 жылғы 20 маусымдағы № 6С-12/5 «Бұланды ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешіміне өзгеріс енгізу туралы
