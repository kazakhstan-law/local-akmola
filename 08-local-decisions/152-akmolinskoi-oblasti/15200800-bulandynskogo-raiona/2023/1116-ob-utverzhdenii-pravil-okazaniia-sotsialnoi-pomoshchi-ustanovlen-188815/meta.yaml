  title:
    rus: О внесении изменений и дополнений в решение Буландынского районного маслихата от 16 ноября 2023 года № 8С-10/15 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Буландынском районе»
    kaz: Бұланды аудандық мәслихатының 2023 жылғы 16 қарашадағы № 8C-10/15 «Бұланды ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
