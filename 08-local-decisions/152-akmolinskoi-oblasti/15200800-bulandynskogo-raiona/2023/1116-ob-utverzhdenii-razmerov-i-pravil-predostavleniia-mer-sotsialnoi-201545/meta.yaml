caused_by:
  code: '201390'
  requisite: Решение Буландынского районного маслихата Акмолинской области от 27 сентября 2024 года № 8С-22/3
  title:
    rus: О внесении изменений и дополнений в решение Буландынского районного маслихата № 8С-10/14 от 16 ноября 2023 года «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Буландынского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2024 год
    kaz: Бұланды аудандық мәслихатының 2023 жылғы 16 қарашадағы № 8С-10/14 «2024 жылға арналған Бұланды ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау шараларын ұсыну туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201390/rus
