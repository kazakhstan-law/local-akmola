act_code: '216133'
requisite: Решение Буландынского районного маслихата Акмолинской области от 22 октября 2025 года № 8С-33/7
title:
  rus: Об утверждении размеров и Правил предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Буландынского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2026 год
  kaz: 2026 жылға арналған Бұланды ауданының ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтiк қолдау шараларын ұсыну мөлшерін және қағидаларын бекіту туралы
