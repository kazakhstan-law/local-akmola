act_code: '216083'
requisite: Решение Буландынского районного маслихата Акмолинской области от 22 октября 2025 года № 8С-33/3. Зарегистрировано в Министерстве юстиции Республики Казахстан 24 октября 2025 года № 37211
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Буландынского района
  kaz: Бұланды ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық қызметтерді төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидаларын және мөлшерін бекіту туралы
