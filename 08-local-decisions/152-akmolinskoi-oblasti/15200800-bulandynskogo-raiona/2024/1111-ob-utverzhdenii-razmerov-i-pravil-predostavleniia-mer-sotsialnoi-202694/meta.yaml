act_code: '202694'
requisite: Решение Буландынского районного маслихата Акмолинской области от 11 ноября 2024 года № 8С-23/14
title:
  rus: «Об утверждении размеров и Правил предоставления мер социальной поддержки специалистам в области здравоохранения образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Буландынского района, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2025 год
  kaz: 2025 жылға арналған Бұланды ауданының ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтiк қолдау шараларын ұсыну мөлшерін және қағидаларын бекіту туралы
