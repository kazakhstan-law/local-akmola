requisite: Решение акимата Буландынского района Акмолинской области от 20 декабря 2010 года № 17. Зарегистрировано Управлением юстиции Буландынского района Акмолинской области 30 декабря 2010 года № 1-7-126. Утратило силу постановлением акимата Буландынского района Акмолинской области от 10 февраля 2015 года № а-02/49
title:
