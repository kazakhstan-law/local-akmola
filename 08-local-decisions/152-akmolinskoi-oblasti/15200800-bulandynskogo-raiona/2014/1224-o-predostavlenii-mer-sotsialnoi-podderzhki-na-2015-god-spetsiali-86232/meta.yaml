  title:
    rus: О внесении изменения в решение Буландынского районного маслихата от 24 декабря 2014 года № 5С-34/7 «О предоставлении мер социальной поддержки на 2015 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Буландынского района»
    kaz: Бұланды аудандық мәслихаттың 2014 жылғы 24 желтоқсандағы № 5С-34/7 «Бұланды ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылға әлеуметтік қолдау шараларын ұсыну туралы» шешіміне өзгеріс енгізу туралы
