requisite: Решение Буландынского районного маслихата Акмолинской области от 24 декабря 2014 года № 5С-34/7. Зарегистрировано Департаментом юстиции Акмолинской области 22 января 2015 года № 4607. Утратило силу решением Буландынского районного маслихата Акмолинской области от 17 февраля 2016 года № 5С-45/6
title:
  rus: О предоставлении мер социальной поддержки на 2015 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Буландынского района
  kaz: Бұланды ауданының ауылдық елді екендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылға әлеуметтік қолдау шараларын ұсыну туралы
